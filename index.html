<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لافي منير | الشبكة السيادية العالمية الحية للصوت والصورة</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0d0221, #1a0033, #240046, #3c096c);
            background-size: 300% 300%;
            animation: cosmicAurora 12s ease infinite;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes cosmicAurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #spaceCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .cinematic-moon {
            position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
            width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #00f2fe 35%, #7928ca 70%, #ff007f 100%);
            box-shadow: 0 0 80px rgba(0, 242, 254, 0.6), 0 0 140px rgba(255, 0, 127, 0.4);
            z-index: 2; opacity: 0.9; pointer-events: none;
            transition: transform 0.3s ease;
        }
        .cinematic-moon.pulse { transform: translateX(-50%) scale(1.08); }

        .container {
            position: relative; z-index: 3; width: 100%; max-width: 430px; height: 100vh;
            background: rgba(18, 8, 38, 0.95); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(0, 242, 254, 0.4); border-right: 1px solid rgba(0, 242, 254, 0.4);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* نظام فصل الشاشات المانع للتداخل نهائياً */
        .screen { display: none !important; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
        .screen.active { display: flex !important; }

        .gateway-screen { align-items: center; justify-content: center; text-align: center; padding: 30px; overflow-y: auto; }
        .avatar-box {
            width: 110px; height: 110px; margin: 0 auto 15px;
            background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f);
            border-radius: 50%; padding: 3px;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.7);
            animation: avatarGlow 3s infinite alternate;
        }
        .avatar-inner { width: 100%; height: 100%; background: #0c0614; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 45px; }
        @keyframes avatarGlow {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(0,242,254,0.4); }
            100% { transform: scale(1.06); box-shadow: 0 0 60px rgba(255,0,127,0.7); }
        }

        h1 {
            color: #00f2fe; margin-bottom: 8px; font-size: 26px; font-weight: 800;
            background: linear-gradient(90deg, #00f2fe, #a855f7, #ff007f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .gateway-desc { color: #d8b4fe; font-size: 12px; margin-bottom: 20px; line-height: 1.6; }

        .room-input {
            width: 100%; padding: 12px 16px; margin-bottom: 12px; border-radius: 20px;
            background: rgba(25, 10, 50, 0.9); border: 1px solid rgba(0, 242, 254, 0.4);
            color: #fff; font-size: 14px; text-align: center; outline: none;
        }
        .room-input:focus { border-color: #ff007f; box-shadow: 0 0 15px rgba(255,0,127,0.4); }

        .btn {
            width: 100%; padding: 14px; margin: 6px 0; border-radius: 25px; border: none;
            font-size: 14px; font-weight: bold; cursor: pointer; color: white;
            background: linear-gradient(135deg, #00f2fe, #7928ca); text-decoration: none;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 5px 25px rgba(0, 242, 254, 0.4); transition: 0.2s;
        }
        .btn:hover { transform: scale(1.02); }

        .system-footer { margin-top: 15px; font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.5); text-align: center; }

        /* شاشة الاتصال داخل الغرفة */
        .live-room-content { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #1e0a3c 0%, #0d0221 100%); position: relative; height: 100%; }
        .room-top-bar { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background: rgba(20, 10, 40, 0.85); backdrop-filter: blur(10px); z-index: 5; border-bottom: 1px solid rgba(0,242,254,0.3); }
        
        .videos-container { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #080112; }
        #localVideo {
            position: absolute; top: 15px; left: 15px; width: 100px; height: 140px; object-fit: cover;
            border-radius: 14px; border: 2px solid #00f2fe; background: #190028; z-index: 10;
            box-shadow: 0 0 20px rgba(0,242,254,0.5);
        }

        #stardustMemoryLayer {
            position: absolute; top: 70px; left: 15px; right: 15px; bottom: 80px;
            pointer-events: none; z-index: 8; overflow: hidden;
        }
        .stardust-particle {
            position: absolute; background: rgba(0, 242, 254, 0.8);
            padding: 4px 10px; border-radius: 12px; font-size: 11px; color: #fff;
            box-shadow: 0 0 10px rgba(0,242,254,0.6); animation: floatUp 6s linear infinite;
            border: 1px solid rgba(255,0,127,0.5);
        }
        @keyframes floatUp {
            0% { transform: translateY(100px) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-200px) scale(1.1); opacity: 0; }
        }

        .room-chat-overlay {
            position: absolute; bottom: 80px; left: 15px; right: 15px; max-height: 120px;
            overflow-y: auto; z-index: 9; display: flex; flex-direction: column; gap: 4px; padding: 5px;
            scrollbar-width: none;
        }
        .room-chat-overlay::-webkit-scrollbar { display: none; }
        .chat-bubble {
            background: rgba(15, 5, 30, 0.75); backdrop-filter: blur(5px);
            padding: 6px 12px; border-radius: 12px; font-size: 11px; border-right: 3px solid #00f2fe;
            max-width: 80%; width: fit-content; color: #fff;
        }
        .chat-bubble span { color: #00f2fe; font-weight: bold; margin-left: 5px; }

        .room-input-box {
            position: absolute; bottom: 10px; left: 15px; right: 15px; z-index: 10;
            display: flex; gap: 8px; background: rgba(15, 5, 30, 0.9); padding: 8px; border-radius: 20px;
            border: 1px solid rgba(0,242,254,0.3); backdrop-filter: blur(10px);
        }
        .room-input-box input {
            flex: 1; background: transparent; border: none; color: #fff; font-size: 12px; outline: none; padding: 0 8px;
        }
        .room-input-box button {
            background: linear-gradient(135deg, #00f2fe, #ff007f); border: none; color: #fff;
            padding: 6px 14px; border-radius: 14px; font-size: 11px; font-weight: bold; cursor: pointer;
        }

        .call-controls {
            padding: 15px; background: rgba(15, 5, 30, 0.9); backdrop-filter: blur(10px);
            display: flex; justify-content: center; gap: 15px; align-items: center; z-index: 10;
        }
        .control-icon-btn {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: #fff; font-size: 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.2s;
        }
        .control-icon-btn.active { background: #ff0844; border-color: #ff0844; box-shadow: 0 0 20px rgba(255,8,68,0.6); }
        .hangup-btn { background: linear-gradient(135deg, #ff0844, #ffb199); border: none; width: 52px; height: 52px; font-size: 18px; box-shadow: 0 6px 20px rgba(255,8,68,0.5); }
    </style>
</head>
<body>

    <div class="cinematic-moon" id="cinematicMoon"></div>
    <canvas id="spaceCanvas"></canvas>

    <div class="container">
        
        <!-- شاشة البوابة (تكون مفعلة وتظهر وحدها في البداية) -->
        <div id="screen-gateway" class="screen active gateway-screen">
            <div class="avatar-box"><div class="avatar-inner">🌌</div></div>
            <h1>لافي منير</h1>
            <p class="gateway-desc">
                الشبكة السيادية الحية المزودة بخاصية "الصدى النجمي للذاكرة الكونية" ومشاركة الشاشة. تواصل وخلّد أثرك للأبد.
            </p>
            
            <input type="text" id="roomInput" class="room-input" placeholder="اكتب اسم أو رقم الغرفة (مثال: lafi-room-1)" value="lafi-room-1">
            
            <button class="btn" onclick="enterRoom()">
                دخول الغرفة الحية 🎙️
            </button>
            <a href="https://github.com/wwwmounirmp-hue/lafi-munir" target="_blank" class="btn" style="background: linear-gradient(135deg, rgba(30,15,60,0.9), rgba(60,20,90,0.9)); border: 1px solid rgba(0,242,254,0.4);">
                استكشف 🚀 GitHub
            </a>
            <div class="system-footer">STARDUST MEMORY P2P • 2026</div>
        </div>

        <!-- شاشة الاتصال داخل الغرفة (مخفية كلياً ولا تظهر إلا عند تفعيلها) -->
        <div id="screen-app" class="screen">
            <div class="live-room-content">
                <div class="room-top-bar">
                    <span id="roomTitleDisplay" style="font-size:12px; font-weight:bold; color:#00f2fe;">الغرفة: جاري الاتصال... 🌐</span>
                    <span onclick="goHome()" style="cursor:pointer; font-size:14px; color:#ff0844; font-weight:bold;">✕ خروج</span>
                </div>

                <div class="videos-container">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <video id="localVideo" autoplay playsinline muted></video>
                    
                    <div id="stardustMemoryLayer"></div>
                    <div class="room-chat-overlay" id="roomChatOverlay"></div>

                    <div class="room-input-box">
                        <input type="text" id="roomMsgInput" placeholder="أرسل رسالة تخلد في سماء الغرفة..." autocomplete="off">
                        <button onclick="sendStardustMsg()">إرسال ✨</button>
                    </div>
                </div>

                <div class="call-controls">
                    <button class="control-icon-btn" id="micBtn" onclick="toggleMic()" title="كتم الصوت">🎤</button>
                    <button class="control-icon-btn" id="screenShareBtn" onclick="toggleScreenShare()" title="مشاركة الشاشة">💻</button>
                    <button class="control-icon-btn hangup-btn" onclick="goHome()" title="إنهاء المكالمة">📞</button>
                    <button class="control-icon-btn" id="camBtn" onclick="toggleCam()" title="الكاميرا">📷</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onChildAdded, remove, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://lafi-munir-global-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let peer = null;
        let currentCall = null;
        let myPeerRef = null;

        window.initRoomP2P = function(roomName, stream) {
            const roomRef = ref(db, `rooms_v3/${roomName}/peers`);
            const stardustRef = ref(db, `rooms_v3/${roomName}/stardust`);

            peer = new Peer();

            peer.on('open', (id) => {
                document.getElementById('roomTitleDisplay').innerText = `الغرفة: ${roomName} • متصل 🟢`;
                
                myPeerRef = push(roomRef);
                set(myPeerRef, { peerId: id });

                onChildAdded(roomRef, (snapshot) => {
                    const data = snapshot.val();
                    if(data && data.peerId && data.peerId !== id && !currentCall) {
                        if(id > data.peerId) {
                            const call = peer.call(data.peerId, stream);
                            handleCall(call);
                        }
                    }
                });

                const recentStardust = query(stardustRef, limitToLast(15));
                let isInitialLoad = true;

                onChildAdded(recentStardust, (snap) => {
                    const msg = snap.val();
                    if(msg) {
                        displayStardustMemory(msg.sender, msg.text, isInitialLoad);
                    }
                });

                setTimeout(() => { isInitialLoad = false; }, 1200);
            });

            peer.on('call', (call) => {
                call.answer(stream);
                handleCall(call);
            });
        };

        window.sendStardustToCloud = function(roomName, text) {
            const stardustRef = ref(db, `rooms_v3/${roomName}/stardust`);
            push(stardustRef, {
                sender: "لافي منير",
                text: text,
                timestamp: Date.now()
            });
        };

        function handleCall(call) {
            currentCall = call;
            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('cinematicMoon').classList.add('pulse');
                setTimeout(() => document.getElementById('cinematicMoon').classList.remove('pulse'), 1000);
            });
            call.on('close', () => {
                goHome();
            });
        }

        window.cleanupRoom = function() {
            if(myPeerRef) {
                remove(myPeerRef);
            }
        }
    </script>

    <script>
        let globalStream = null;
        let currentRoomName = "";
        let isSharingScreen = false;
        let screenStream = null;
        let originalVideoTrack = null;

        function enterRoom() {
            currentRoomName = document.getElementById('roomInput').value.trim();
            if(!currentRoomName) {
                alert("يرجى إدخال اسم أو رقم الغرفة أولاً.");
                return;
            }

            // إخفاء البوابة تماماً وتفعيل شاشة التطبيق
            document.getElementById('screen-gateway').classList.remove('active');
            document.getElementById('screen-app').classList.add('active');

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    globalStream = stream;
                    document.getElementById('localVideo').srcObject = stream;
                    if(window.initRoomP2P) {
                        window.initRoomP2P(currentRoomName, stream);
                    }
                })
                .catch(err => {
                    alert("يرجى السماح بالوصول للكاميرا والمايكروفون للبدء.");
                    goHome();
                });
        }

        async function toggleScreenShare() {
            if (!currentCall) {
                alert("يجب أن تكون في مكالمة نشطة لمشاركة الشاشة.");
                return;
            }

            const btn = document.getElementById('screenShareBtn');

            if (!isSharingScreen) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const screenTrack = screenStream.getVideoTracks()[0];

                    originalVideoTrack = globalStream.getVideoTracks()[0];

                    const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        await sender.replaceTrack(screenTrack);
                    }

                    document.getElementById('localVideo').srcObject = screenStream;
                    isSharingScreen = true;
                    btn.classList.add('active');

                    screenTrack.onended = () => {
                        stopScreenShare();
                    };

                } catch (err) {
                    console.error("فشل مشاركة الشاشة:", err);
                    isSharingScreen = false;
                    btn.classList.remove('active');
                }
            } else {
                stopScreenShare();
            }
        }

        async function stopScreenShare() {
            const btn = document.getElementById('screenShareBtn');
            if (!isSharingScreen) return;

            try {
                if (screenStream) {
                    screenStream.getTracks().forEach(t => t.stop());
                }

                if (originalVideoTrack && currentCall) {
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        await sender.replaceTrack(originalVideoTrack);
                    }
                }

                document.getElementById('localVideo').srcObject = globalStream;

            } catch (err) {
                console.error("خطأ عند إيقاف مشاركة الشاشة:", err);
            }

            isSharingScreen = false;
            btn.classList.remove('active');
        }

        function displayStardustMemory(sender, text, isInitial = false) {
            const chatOverlay = document.getElementById('roomChatOverlay');
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.innerHTML = `<span>[${sender}]:</span> ${text}`;
            chatOverlay.appendChild(bubble);
            chatOverlay.scrollTop = chatOverlay.scrollHeight;

            if (!isInitial) {
                const layer = document.getElementById('stardustMemoryLayer');
                const particle = document.createElement('div');
                particle.className = 'stardust-particle';
                particle.style.left = Math.random() * 70 + '%';
                particle.style.top = (50 + Math.random() * 30) + '%';
                particle.innerText = `✨ ${text}`;
                layer.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 6000);
            }
        }

        function sendStardustMsg() {
            const input = document.getElementById('roomMsgInput');
            const text = input.value.trim();
            if(!text) return;

            if(window.sendStardustToCloud) {
                window.sendStardustToCloud(currentRoomName, text);
            }
            input.value = '';
        }

        function goHome() {
            if(window.cleanupRoom) {
                window.cleanupRoom();
            }
            if(globalStream) {
                globalStream.getTracks().forEach(t => t.stop());
            }
            if(screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
            }
            location.reload();
        }

        function toggleMic() {
            if(!globalStream) return;
            const audioTrack = globalStream.getAudioTracks()[0];
            if(audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('micBtn').classList.toggle('active', !audioTrack.enabled);
            }
        }

        function toggleCam() {
            if(!globalStream || isSharingScreen) return;
            const videoTrack = globalStream.getVideoTracks()[0];
            if(videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                document.getElementById('camBtn').classList.toggle('active', !videoTrack.enabled);
            }
        }

        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for(let i=0; i<80; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.1 + 0.02
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.y -= star.speed;
                if(star.y < 0) star.y = canvas.height;
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();
    </script>
</body>
</html>
