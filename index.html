function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  termOutput.appendChild(div);

}
async function sha256Hex(str) {
  const buf = new TextEncoder().encode(str);
  const h = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ─── AES-GCM Crypto ─── */
async function deriveCryptoKey(secret) {
  try {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "PBKDF2" }, false, ["deriveKey"]);
    cryptoKeyObj = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: enc.encode("SOVEREIGN_SALT"), iterations: 100000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
    );
    $("cryptoStatus").textContent = "AES-GCM-256";
    $("cryptoStatus").className = "text-cyber-green font-bold";
  } catch (e) {}
}
async function encryptPayload(text) {
  try {
    if (!cryptoKeyObj) await deriveCryptoKey(rawPasswordSecret);
    const enc = new TextEncoder();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc_data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKeyObj, enc.encode(text));
    const combined = new Uint8Array(iv.length + enc_data.byteLength);
    combined.set(iv, 0); combined.set(new Uint8Array(enc_data), iv.length);
    let bin = ""; for (let i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
    return "AES256:" + btoa(bin);
  } catch (e) {
    let bin = ""; const enc = new TextEncoder(); const data = enc.encode(text); const k = enc.encode(rawPasswordSecret);
    for (let i = 0; i < data.length; i++) bin += String.fromCharCode(data[i] ^ k[i % k.length]);
    return "XOR:" + btoa(bin);
  }
}
async function decryptPayload(cipher) {
  try {
    if (cipher.startsWith("XOR:")) {
      const bin = atob(cipher.slice(4)); const enc = new TextEncoder(); const k = enc.encode(rawPasswordSecret); let out = "";
      for (let i = 0; i < bin.length; i++) out += String.fromCharCode(bin.charCodeAt(i) ^ k[i % k.length]);
      return out;
    }
    if (!cipher.startsWith("AES256:")) return cipher;
    if (!cryptoKeyObj) await deriveCryptoKey(rawPasswordSecret);
    const raw = atob(cipher.slice(7)); const combined = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) combined[i] = raw.charCodeAt(i);
    const iv = combined.slice(0, 12); const ct = combined.slice(12);
    const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cryptoKeyObj, ct);
    return new TextDecoder().decode(dec);
  } catch (e) { return "[فشل فك التشفير - مفتاح خاطئ]"; }
}

/* ─── IndexedDB ─── */
function initIndexedDB() {
  return new Promise(resolve => {
    const req = indexedDB.open("SovereignOS_v36", 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("vfs")) d.createObjectStore("vfs");
      if (!d.objectStoreNames.contains("ledger")) d.createObjectStore("ledger");
      if (!d.objectStoreNames.contains("shadow")) d.createObjectStore("shadow");
    };
    req.onsuccess = e => { idb = e.target.result; $("dbStatus").textContent = "ON"; resolve(); };
    req.onerror = () => { $("dbStatus").textContent = "ERR"; resolve(); };
  });
}
async function saveVFSToIDB() {
  if (!idb) return;
  try {
    const tx = idb.transaction("vfs", "readwrite");
    const s = tx.objectStore("vfs"); s.clear();
    for (const [k, v] of Object.entries(vfs)) s.put(v, k);
  } catch (e) {}
}
async function loadVFSFromIDB() {
  if (!idb) return null;
  return new Promise(resolve => {
    try {
      const tx = idb.transaction("vfs", "readonly");
      const s = tx.objectStore("vfs"); const req = s.getAllKeys();
      req.onsuccess = async () => {
        if (req.result.length === 0) return resolve(null);
        const result = {};
        for (const key of req.result) {
          result[key] = await new Promise(r => { const rq = s.get(key); rq.onsuccess = () => r(rq.result); rq.onerror = () => r(null); });
        }
        resolve(result);
      };
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function saveLedgerToIDB() {
  if (!idb) return;
  try { const tx = idb.transaction("ledger", "readwrite"); tx.objectStore("ledger").put(auditLedger, "ledger"); } catch (e) {}

async function loadLedgerFromIDB() {
  if (!idb) return null;
  return new Promise(resolve => {
    try {
      const tx = idb.transaction("ledger", "readonly"); const req = tx.objectStore("ledger").get("ledger");
      req.onsuccess = () => resolve(req.result || null); req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

/* ─── Blockchain ─── */
async function createLedgerBlock(type, details, author) {
  author = author || currentUser;
  const prev = auditLedger.length > 0 ? auditLedger[auditLedger.length - 1] : null;
  const prevHash = prev ? prev.hash : "00000000000000000000000000000000";
  const timestamp = new Date().toISOString();
  const index = auditLedger.length;
  const blockHash = await sha256Hex(index + "|" + timestamp + "|" + type + "|" + details + "|" + author + "|" + prevHash);
  auditLedger.push({ index, timestamp, type, details, author, prevHash, hash: blockHash });
  await saveLedgerToIDB();
  renderLedgerUI();
}
async function verifyBlockchain() {
  for (let i = 0; i < auditLedger.length; i++) {
    const b = auditLedger[i];
    const expectedPrev = i === 0 ? "00000000000000000000000000000000" : auditLedger[i - 1].hash;
    if (b.prevHash !== expectedPrev) return false;
    const rehash = await sha256Hex(b.index + "|" + b.timestamp + "|" + b.type + "|" + b.details + "|" + b.author + "|" + b.prevHash);
    if (rehash !== b.hash) return false;
  }
  return true;
}
function renderLedgerUI() {
  const box = $("ledgerLog"); if (!box) return;

async function hashPassword(password, salt) {
  const buf = new TextEncoder().encode(salt + ":" + password + ":SOVEREIGN");
  const h = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function generateSalt() {
  const arr = new Uint8Array(8); crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function createUser(username, uid, gid, home, shell, password, groups) {
  groups = groups || [];
  if (passwdDB.has(username)) return { ok: false };
  passwdDB.set(username, { username, uid, gid, home, shell });
  const salt = generateSalt(); const hash = await hashPassword(password || "changeme", salt);

/* ─── Space & Crystal Dust Background ─── */
function initMatrix() {
  const canvas = $("matrixCanvas");
  const ctx = canvas.getContext("2d");
  let width, height;
  let stars = [], particles = [];

  function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
  resize(); window.addEventListener("resize", resize);

  class Star {
    constructor() { this.reset(); }
    reset() {
      this.x = (Math.random() - 0.5) * width * 2;
      this.y = (Math.random() - 0.5) * height * 2;
      this.z = Math.random() * width; this.pz = this.z;
    }
    update(speed) { this.z -= speed; if (this.z < 1) this.reset(); }
    draw() {
      let sx = (this.x / this.z) * width + width / 2;
      let sy = (this.y / this.z) * height + height / 2;
      let r = Math.max(0.5, (1 - this.z / width) * 3);
      let px = (this.x / this.pz) * width + width / 2;
      let py = (this.y / this.pz) * height + height / 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy);
      ctx.strokeStyle = `rgba(200, 230, 255, ${1 - this.z / width})`;
      ctx.lineWidth = r; ctx.stroke();
      this.pz = this.z;
    }
  }

  class CrystalDust {
    constructor(x, y) {
      this.x = x; this.y = y; this.size = Math.random() * 4 + 1;
      this.speedX = Math.random() * 6 - 3; this.speedY = Math.random() * 6 - 3;
      const colors = ['#00ffff', '#00bfff', '#8a2be2', '#ff69b4', '#ffffff'];
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.life = 1.0; this.decay = Math.random() * 0.02 + 0.01;
      this.rotation = Math.random() * Math.PI * 2; this.rotSpeed = Math.random() * 0.1 - 0.05;
    }
    update() {
      this.x += this.speedX; this.y += this.speedY;
      this.life -= this.decay; this.rotation += this.rotSpeed;
      if (this.size > 0.2) this.size -= 0.06;
    }
    draw() {
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
      ctx.fillStyle = this.color; ctx.globalAlpha = this.life;
      ctx.shadowBlur = 8; ctx.shadowColor = this.color;
      ctx.beginPath(); ctx.moveTo(0, -this.size); ctx.lineTo(this.size, 0);
      ctx.lineTo(0, this.size); ctx.lineTo(-this.size, 0); ctx.closePath(); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }
  }

  for (let i = 0; i < 300; i++) stars.push(new Star());

  canvas.addEventListener('touchmove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left; const y = e.touches[0].clientY - rect.top;
    for (let i = 0; i < 3; i++) particles.push(new CrystalDust(x, y));
  }, { passive: true });

  canvas.addEventListener('touchstart', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left; const y = e.touches[0].clientY - rect.top;
    for (let i = 0; i < 15; i++) particles.push(new CrystalDust(x, y));
  });
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left; const y = e.clientY - rect.top;
    for (let i = 0; i < 15; i++) particles.push(new CrystalDust(x, y));
  });

  function animate() {
    ctx.fillStyle = 'rgba(3, 0, 20, 0.2)';
    ctx.fillRect(0, 0, width, height);
    stars.forEach(star => { star.update(10); star.draw(); });
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update(); particles[i].draw();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(animate);
  }
  animate();
}

/* ─── Shell Engine ─── */
function tokenizeShellLine(line) {
  const tokens = []; let cur = "", q = null;

    else if (c === '"' || c === "'") q = c;
    else if (c === ' ' || c === '\t') { if (cur) { tokens.push(cur); cur = ""; } }
    else if (c === '|' || c === '>' || c === '<') {
      if (cur) { tokens.push(cur); cur = ""; }
      if (c === '>' && line[i + 1] === '>') { tokens.push(">>"); i++; }
      else tokens.push(c);
    } else cur += c;

}

    return parts.length === 0 ? "/" : "/" + parts.join("/");

}

async function runPipeline(line, opts) {

    stages[stages.length - 1].push(t);

      const source = shellVars.STDIN ? shellVars.STDIN.split("\n") : [];
      if (source.length === 0 && args[1]) {
        const fp = resolvePath(args[1]); if (vfs[fp] && vfs[fp].type === "file") source.push.apply(source, vfs[fp].content.split("\n"));
      }
      let re = null; try { re = new RegExp(pattern, "i"); } catch (e) {}
      source.forEach(l => { if (re ? re.test(l) : l.indexOf(pattern) !== -1) out(l, "text-cyber-green"); });
      break;
    }

    case "wc": {
      const s = shellVars.STDIN || "";
      out("  " + s.split("\n").length + "  " + s.split(/\s+/).filter(Boolean).length + "  " + s.length, "text-cyber-gold");
      break;
    }
    case "head": {
      const n = args[0] && args[0].startsWith("-") ? parseInt(args[0].slice(1), 10) : 10;
      (shellVars.STDIN || "").split("\n").slice(0, n).forEach(l => out(l, "text-cyber-green"));
      break;
    }
    case "tail": {
      const n = args[0] && args[0].startsWith("-") ? parseInt(args[0].slice(1), 10) : 10;
      (shellVars.STDIN || "").split("\n").slice(-n).forEach(l => out(l, "text-cyber-green"));
      break;
    }

    case "encrypt": {
      if (args.length < 2) { out("encrypt <file> <key>", "text-red-400"); break; }
      const fp = resolvePath(args[0]);
      if (!vfs[fp] || vfs[fp].type !== "file") { out("not found", "text-red-400"); break; }
      vfs[fp].content = xorCipher(vfs[fp].content, args[1]);
      await saveVFSToIDB(); await createLedgerBlock("ENCRYPT", args[0]);
      out("[CIPHER] ✅", "text-cyber-green");
      break;
    }
    case "decrypt": {
      if (args.length < 2) { out("decrypt <file> <key>", "text-red-400"); break; }
      const fp = resolvePath(args[0]);
      if (!vfs[fp] || vfs[fp].type !== "file") { out("not found", "text-red-400"); break; }
      const dec = xorDecipher(vfs[fp].content, args[1]);
      if (dec !== null && dec.indexOf("\u0000") === -1) {
        vfs[fp].content = dec; await saveVFSToIDB(); await createLedgerBlock("DECRYPT", args[0]);
        out("[CIPHER] ✅", "text-cyber-green");
      } else out("[CIPHER ERROR] مفتاح خاطئ", "text-red-400");
      break;
    }

    case "ps":
      out("  PID  USER        STAT   COMMAND", "text-cyber-gold");
      out("  1    root        Ss     sovereign_init", "text-cyber-magenta");
      out("  1024 " + currentUser.padEnd(11) + " R      -bash", "text-cyber-cyan");
      break;

    case "sysinfo":
      out("═══ SOVEREIGN OS v36.0 ULTIMATE ═══", "text-cyber-gold");
      out("User     : " + currentUser, "text-gray-200");
      out("Path     : " + currentPath, "text-cyber-cyan");
      out("Peer     : " + (myPeerId ? "✓ " + myPeerId.substring(0, 12) : "✗"), myPeerId ? "text-cyber-green" : "text-cyber-gold");
      out("Room     : " + (roomId || "—"), roomId ? "text-cyber-magenta" : "text-cyber-gold");
      out("Members  : " + (1 + Object.keys(roomMembers).length), "text-cyber-cyan");
      out("Blocks   : " + auditLedger.length, "text-cyber-green");
      out("© لافي منير 2026", "text-cyber-gold");
      break;

    case "chain":
      out("═══ LEDGER ═══", "text-cyber-gold");
      auditLedger.slice(-10).forEach(b => out("[#" + b.index + "] " + b.hash.substring(0, 14) + "... | " + b.type + " " + b.details, "text-cyber-cyan"));
      break;

    case "verify": {
      const ok = await verifyBlockchain();
      out(ok ? "[✅] سليمة" : "[❌] تلاعب!", ok ? "text-cyber-green" : "text-red-400");
      break;
    }

    case "audit":
      auditLedger.slice(-15).forEach(b => out("[" + new Date(b.timestamp).toLocaleTimeString() + "] [" + b.type + "] " + b.details, "text-cyber-green"));
      break;

    default:
      if (cmd.indexOf("./") === 0 || cmd.endsWith(".sh")) {
        const fp = resolvePath(cmd.indexOf("./") === 0 ? cmd.slice(2) : cmd);
        if (vfs[fp] && vfs[fp].type === "file") {
          await createLedgerBlock("EXEC", fp);
          out("[EXEC] " + cmd, "text-cyber-cyan");
          await runScriptContent(vfs[fp].content, opts);
          break;
        }
      }
      out("Unknown command: " + cmd + ". Type 'help'.", "text-red-400");
  }
}

/* ─── File Transfer (16KB Chunks) ─── */
const CHUNK_SIZE = 16384;
async function sendP2PFile(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { notify("⚠️ الحد الأقصى 5MB", 3000); return; }
  const conns = Object.values(dataConnections).filter(c => c.open);
  if (conns.length === 0) { notify("⚠️ لا أعضاء متصلون لإرسال الملف", 2000); return; }

  const prog = $("fileProgressContainer"); prog.classList.remove("hidden");
  $("transferFileName").textContent = file.name;

  const buf = await file.arrayBuffer(); const total = Math.ceil(buf.byteLength / CHUNK_SIZE);
  const tid = Math.random().toString(36).substring(2);

  for (let i = 0; i < total; i++) {
    const start = i * CHUNK_SIZE; const end = Math.min(start + CHUNK_SIZE, buf.byteLength);
    const chunk = new Uint8Array(buf.slice(start, end));
    const packet = { type: "FILE_CHUNK", transferId: tid, fileName: file.name, chunkIndex: i, totalChunks: total, data: chunk };
    conns.forEach(c => c.send(packet));
    const pct = Math.round(((i + 1) / total) * 100);
    $("transferProgressBar").style.width = pct + "%"; $("transferPercent").textContent = pct + "%";
    await new Promise(r => setTimeout(r, 5));
  }
  addChatMessage("SYSTEM", "📁 تم إرسال الملف: " + file.name);
  await createLedgerBlock("FILE_SENT", file.name);
  setTimeout(() => prog.classList.add("hidden"), 2500);
}
function handleIncomingChunk(packet) {
  const { transferId, fileName, chunkIndex, totalChunks, data } = packet;
  if (!pendingFileChunks[transferId]) {
    pendingFileChunks[transferId] = { fileName, chunks: new Array(totalChunks), received: 0, startedAt: Date.now() };
  }
  const t = pendingFileChunks[transferId];
  t.chunks[chunkIndex] = new Uint8Array(data); t.received++;
  if (t.received === totalChunks) {
    try {
      const blob = new Blob(t.chunks); const url = URL.createObjectURL(blob);
      const line = document.createElement("div"); line.className = "text-[10px]";
      line.innerHTML = '📁 <a href="' + url + '" download="' + escapeHtml(fileName) + '" class="text-cyber-gold underline">تنزيل: ' + escapeHtml(fileName) + '</a>';
      $("chatBox").appendChild(line); $("chatBox").scrollTop = $("chatBox").scrollHeight;
      createLedgerBlock("FILE_RECV", fileName);
    } catch (e) {}
    delete pendingFileChunks[transferId];
  }
}

function snapshot() {
  const v = $("localVideo"); if (!v.srcObject) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  c.toBlob(b => {
    const url = URL.createObjectURL(b); const a = document.createElement("a");
    a.href = url; a.download = "snap_" + Date.now() + ".png"; a.click();
    notify("📸 تم التقاط الصورة", 1500);

  createLedgerBlock("SNAPSHOT", "Screen captured");
}

    e.preventDefault(); if (historyIndex > 0) { historyIndex--; termInput.value = commandHistory[historyIndex]; } return;

  if (e.key === "ArrowDown") {
    e.preventDefault(); if (historyIndex < commandHistory.length - 1) { historyIndex++; termInput.value = commandHistory[historyIndex]; }
    else { historyIndex = commandHistory.length; termInput.value = ""; } return;
  }
  if (e.key !== "Enter") return;
  const val = termInput.value; termInput.value = "";
  if (!val.trim()) return;
  printToTerm(currentUser + "@sovereign:" + currentPath + "# " + val, "text-cyber-cyan");
  commandHistory.push(val); historyIndex = commandHistory.length;
  await runPipeline(val);
});
