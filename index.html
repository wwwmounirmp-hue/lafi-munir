<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لافي منير | البوابة الفضائية العليا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #03000a;
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* خلفية النجوم التفاعلية */
        #spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* هالة كونية متحركة خلف البطاقة */
        .cosmic-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(59, 130, 246, 0.4), rgba(236, 72, 153, 0.4));
            border-radius: 50%;
            filter: blur(100px);
            z-index: 2;
            animation: pulseNebula 8s infinite alternate ease-in-out;
        }
        @keyframes pulseNebula {
            0% { transform: scale(0.8) translate(-20px, -20px); opacity: 0.5; }
            100% { transform: scale(1.2) translate(20px, 20px); opacity: 0.9; }
        }
        /* بطاقة الزجاج المتقدمة (Glassmorphism) */
        .container {
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* الأفاتار المتوهج بنبض نيون */
        .avatar {
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 0 40px rgba(121, 40, 202, 0.7), 0 0 80px rgba(0, 223, 216, 0.4);
            animation: avatarGlow 4s infinite alternate;
        }
        @keyframes avatarGlow {
            0% { transform: rotate(0deg) scale(1); box-shadow: 0 0 30px rgba(121, 40, 202, 0.6); }
            100% { transform: rotate(5deg) scale(1.05); box-shadow: 0 0 60px rgba(255, 0, 127, 0.8); }
        }
        /* عنوان ناري متدرج */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #60a5fa, #c084fc, #f472b6, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: -1px;
        }
        /* وصف ذو طابع مستقبلي */
        p {
            color: #cbd5e1;
            font-size: 1.15rem;
            line-height: 1.9;
            margin-bottom: 35px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        /* مجموعة الأزرار المستقبلية */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            position: relative;
            display: inline-block;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 1.05rem;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            color: white;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 15px 40px rgba(236, 72, 153, 0.7);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px) scale(1.03);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
        }
        /* تذييل الصفحة */
        .footer {
            margin-top: 45px;
            font-size: 0.9rem;
            color: #64748b;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- الخلفية الكونية الحية -->
    <canvas id="spaceCanvas"></canvas>
    <div class="cosmic-glow"></div>

    <!-- البطاقة الرئيسية -->
    <div class="container">
        <div class="avatar">🌌</div>
        <h1>لافي منير</h1>
        <p>هنا حيث يلتقي الخيال بالبرمجة العميقة. تم بناء هذه البوابة خصيصاً لتتحدى المألوف وتقدم تجربة بصرية لا توصف.</p>
        <div class="btn-group">
            <a href="https://github.com/wwwmounirmp-hue" target="_blank" class="btn btn-primary">استكشف GitHub 🚀</a>
            <a href="#" class="btn btn-secondary">البوابة المركزية ✨</a>
        </div>
        <div class="footer">
            SYSTEM ONLINE • LAFI MUNIR 2026
        </div>
    </div>

    <!-- كود الجسيمات الكونية المتحركة (JavaScript) -->
    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        const numStars = 120;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8,
                alpha: Math.random(),
                speed: Math.random() * 0.4 + 0.1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';

            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                star.y -= star.speed;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }

                // وميض النجوم الخفيف
                star.alpha += (Math.random() - 0.5) * 0.05;
                if (star.alpha < 0.1) star.alpha = 0.1;
                if (star.alpha > 1) star.alpha = 1;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
