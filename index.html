/* ═══ UTILITIES ═══ */
function notify(msg, ms = 3000) {
  const el = $("notification");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(el._to);
  el._to = setTimeout(() => el.classList.add("hidden"), ms);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function printToTerm(text, color = "text-gray-300") {
  const div = document.createElement("div");
  div.className = "font-mono " + color;
  div.innerText = text;
  termOutput.appendChild(div);
  termOutput.scrollTop = termOutput.scrollHeight;
}
async function sha256Hex(str) {
  const buf = new TextEncoder().encode(str);
  const h = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function beep(freq = 440, dur = 80, type = "sine") {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    osc.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur / 1000);
    osc.start(); osc.stop(ctx.currentTime + dur / 1000);
  } catch (e) {}
}

/* ═══ AI ENGINE ═══ */
async function queryAI(prompt) {
  if (!prompt) return "⚠️ اكتب سؤالاً بعد الأمر ai";

  if (openAiApiKey) {
    try {
      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + openAiApiKey },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [
            { role: "system", content: "You are Sovereign AI assistant inside Sovereign OS created by لافي منير. Answer concisely in Arabic." },
            { role: "user", content: prompt }
          ]
        })
      });
      const data = await res.json();
      if (data.choices && data.choices[0]) return data.choices[0].message.content;
      if (data.error) return "❌ " + data.error.message;
    } catch (e) { return "❌ فشل الاتصال: " + e.message; }
  }

  // Local fallback AI
  const p = prompt.toLowerCase().trim();
  if (p.includes("من أنت") || p.includes("who are you") || p.includes("اسمك")) return "🤖 أنا Sovereign AI — مساعد ذكي مدمج في نظام لافي منير. أعمل محلياً بدون اتصال، أو عبر OpenAI لو ضبطت مفتاحاً بـ setapikey.";
  if (p.includes("مرحبا") || p.includes("hello") || p.includes("سلام")) return "👋 أهلاً بك! كيف أساعدك في Sovereign OS اليوم؟";
  if (p.includes("كيف") || p.includes("how")) return "💡 استخدم help للأوامر، أو sysinfo لحالة النظام، أو call لبدء شبكة Mesh.";
  if (p.includes("تشفير") || p.includes("encrypt")) return "🔒 النظام يدعم AES-GCM 256-bit + PBKDF2. اضبط المفتاح من الواجهة الجانبية.";
  if (p.includes("وقت") || p.includes("time")) return "⏰ الوقت الحالي: " + new Date().toLocaleString("ar-DZ");
  if (p.includes("تاريخ") || p.includes("date")) return "📅 التاريخ: " + new Date().toLocaleDateString("ar-DZ");
  if (p.startsWith("احسب") || p.startsWith("calc") || /^[\d\s+\-*/()]+$/.test(p)) {
    try {
      const expr = p.replace("احسب", "").replace("calc", "").trim();
      // eslint-disable-next-line no-new-func
      const r = Function('"use strict";return (' + expr + ")")();
      return "🧮 النتيجة: " + r;
    } catch (e) {}
  }
  if (p.includes("نكتة") || p.includes("joke")) {
    const jokes = ["لماذا لا يخاف المبرمج من الظلام؟ لأنه يعمل في بيئة terminal مظلمة أصلاً 😄", "كم مبرمج لتغيير مصباح؟ لا شيء، إنه مشكلة في الشبكة 🐛"];
    return "😄 " + jokes[Math.floor(Math.random() * jokes.length)];
  }
  return "🤖 (محلي) فهمت: \"" + prompt + "\". ضبط setapikey <key> لتفعيل OpenAI، أو جرّب: احسب 2+2، نكتة، الوقت، من أنت.";
}
function speakAI(text) {
  try {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text.replace(/[🤖👋💡🔒⏰📅🧮😄❌]/g, ""));
    u.lang = "ar-SA"; u.rate = 1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ═══ AES-GCM ═══ */
async function deriveCryptoKey(secret) {
  try {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "PBKDF2" }, false, ["deriveKey"]);
    cryptoKeyObj = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: enc.encode("SOVEREIGN_SALT"), iterations: 100000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
    );
    const cs = $("cryptoStatus"); if (cs) cs.textContent = "AES-GCM-256";
  } catch (e) { console.warn("crypto error", e); }
}
async function encryptPayload(text) {
  try {
    if (!cryptoKeyObj) await deriveCryptoKey(rawPasswordSecret);
    const enc = new TextEncoder(); const iv = crypto.getRandomValues(new Uint8Array(12));
    const encData = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKeyObj, enc.encode(text));
    const combined = new Uint8Array(iv.length + encData.byteLength);
    combined.set(iv, 0); combined.set(new Uint8Array(encData), iv.length);
    let bin = ""; for (let i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
    return "AES256:" + btoa(bin);
  } catch (e) { return text; }
}
async function decryptPayload(cipher) {
  try {
    if (typeof cipher !== "string" || !cipher.startsWith("AES256:")) return cipher;
    if (!cryptoKeyObj) await deriveCryptoKey(rawPasswordSecret);
    const raw = atob(cipher.slice(7)); const combined = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) combined[i] = raw.charCodeAt(i);
    const iv = combined.slice(0, 12); const ct = combined.slice(12);
    const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cryptoKeyObj, ct);
    return new TextDecoder().decode(dec);
  } catch (e) { return "[فشل فك التشفير]"; }
}

/* ═══ IndexedDB ═══ */
function initIndexedDB() {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open("SovereignOS_v38", 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("vfs")) d.createObjectStore("vfs");
        if (!d.objectStoreNames.contains("ledger")) d.createObjectStore("ledger");
      };

async function saveVFSToIDB() {
  if (!idb) return;
  try {
    const tx = idb.transaction("vfs", "readwrite"); const s = tx.objectStore("vfs"); s.clear();
    for (const [k, v] of Object.entries(vfs)) s.put(v, k);
  } catch (e) {}
}
async function loadVFSFromIDB() {
  if (!idb) return null;
  return new Promise(resolve => {
    try {
      const tx = idb.transaction("vfs", "readonly"); const s = tx.objectStore("vfs"); const req = s.getAllKeys();
      req.onsuccess = async () => {
        if (req.result.length === 0) return resolve(null);
        const result = {};
        for (const key of req.result) {
          result[key] = await new Promise(r => { const rq = s.get(key); rq.onsuccess = () => r(rq.result); rq.onerror = () => r(null); });
        }
        resolve(result);
      };
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function saveLedgerToIDB() {
  if (!idb) return;
  try { const tx = idb.transaction("ledger", "readwrite"); tx.objectStore("ledger").put(auditLedger, "ledger"); } catch (e) {}
}
async function loadLedgerFromIDB() {
  if (!idb) return null;
  return new Promise(resolve => {
    try {
      const tx = idb.transaction("ledger", "readonly"); const req = tx.objectStore("ledger").get("ledger");
      req.onsuccess = () => resolve(req.result || null); req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

/* ═══ BLOCKCHAIN LEDGER ═══ */
async function createLedgerBlock(type, details, author) {
  author = author || currentUser;
  const prev = auditLedger.length > 0 ? auditLedger[auditLedger.length - 1] : null;
  const prevHash = prev ? prev.hash : "00000000000000000000000000000000";
  const timestamp = new Date().toISOString();
  const index = auditLedger.length;
  const blockHash = await sha256Hex(index + "|" + timestamp + "|" + type + "|" + details + "|" + author + "|" + prevHash);
  auditLedger.push({ index, timestamp, type, details, author, prevHash, hash: blockHash });
  await saveLedgerToIDB();
  renderLedgerUI();
}

/* ═══ PATH RESOLUTION (with . .. ~) ═══ */
function resolvePath(arg) {
  if (!arg) return currentPath;
  if (arg === "~") return "/root";
  if (arg.startsWith("~/")) arg = "/root/" + arg.slice(2);
  let base;
  if (arg.startsWith("/")) base = arg;
  else base = (currentPath === "/" ? "" : currentPath) + "/" + arg;
  const parts = base.split("/").filter(p => p !== "" && p !== ".");
  const stack = [];
  for (const p of parts) {
    if (p === "..") stack.pop();
    else stack.push(p);
  }
  return "/" + stack.join("");
}
function parentPath(p) { const idx = p.lastIndexOf("/"); return idx <= 0 ? "/" : p.slice(0, idx); }
function baseName(p) { return p.slice(p.lastIndexOf("/") + 1); }

  await saveVFSToIDB(); await createLedgerBlock("NANO", currentNanoPath);
  closeNano(true); beep(880, 60);
}

async function initPeer() {
  if (peer && !peer.destroyed) return;

    if (!localStream) {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      $("localVideo").srcObject = localStream;
    }
  } catch (e) { notify("⚠️ تعذّر الوصول للكاميرا"); }

  peer = new Peer(undefined, { config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] } });
  peer.on("open", id => {
    myPeerId = id;
    $("p2pStatus").textContent = "ON"; $("p2pStatus").className = "dot-on font-bold";
    addChatMessage("SYSTEM", "✅ متصل — ID: " + id.substring(0, 8));
    printToTerm("🆔 PeerID: " + id, "text-cyber-cyan");
    beep(990, 80);
  });
  peer.on("connection", conn => { setupDataConnection(conn); addChatMessage("SYSTEM", "🔗 اتصال من " + conn.peer.substring(0, 6)); });
  peer.on("error", err => { printToTerm("⚠️ PeerJS: " + err.message, "text-red-400"); });
}
async function joinMeshRoom() {
  const room = $("roomIdInput").value.trim();
  if (!room) { notify("⚠️ اكتب اسم الغرفة"); return; }
  roomId = room;
  $("roomStatusBadge").textContent = "ROOM: " + room;
  await initPeer();

}
function setupDataConnection(conn) {
  dataConnections[conn.peer] = conn;
  conn.on("open", () => { addChatMessage("SYSTEM", "✅ اتصال مفتوح: " + conn.peer.substring(0, 6)); });
  conn.on("data", async data => {
    if (typeof data === "string") {
      const dec = await decryptPayload(data);
      addChatMessage(conn.peer.substring(0, 6), dec);
      beep(660, 60);
    } else if (data && data.type === "file-meta") {
      incomingFileMeta = data; pendingFileChunks = {};
      printToTerm("📥 استقبال: " + data.name + " (" + (data.size / 1024).toFixed(1) + "KB)", "text-cyber-gold");
    } else if (data && data.type === "file-chunk") {
      pendingFileChunks[data.index] = data.data;
    } else if (data && data.type === "file-end") {
      const chunks = Object.keys(pendingFileChunks).sort((a, b) => a - b).map(k => pendingFileChunks[k]);
      const blob = new Blob(chunks);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = incomingFileMeta?.name || "file.bin";
      a.click();
      addChatMessage("SYSTEM", "📎 تم استلام الملف: " + a.download);
      pendingFileChunks = {}; incomingFileMeta = null;
    }
  });
  conn.on("close", () => { delete dataConnections[conn.peer]; addChatMessage("SYSTEM", "❌断开"); });
}
function addChatMessage(sender, text) {
  const box = $("chatBox"); const div = document.createElement("div");
  div.className = "text-[10px]";
  div.innerHTML = '<span class="text-cyber-cyan font-bold">' + escapeHtml(sender) + ':</span> ' + escapeHtml(text);
  box.appendChild(div); box.scrollTop = box.scrollHeight;
}
async function sendChatMessage() {
  const input = $("chatInput"); const text = input.value.trim(); if (!text) return;
  input.value = ""; addChatMessage("أنا", text);
  if (Object.keys(dataConnections).length === 0) { notify("⚠️ لا اتصالات"); return; }
  const enc = await encryptPayload(text);
  Object.values(dataConnections).forEach(c => { if (c.open) c.send(enc); });
}

function snapshot() {

  const canvas = document.createElement("canvas");

  canvas.getContext("2d").drawImage(video, 0, 0);
  canvas.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "snapshot_" + Date.now() + ".png";

    notify("📸 تم حفظ اللقطة");

async function sendP2PFile(file) {
  if (!file) return;
  const conns = Object.values(dataConnections).filter(c => c.open);
  if (conns.length === 0) { notify("⚠️ لا اتصالات نشطة"); return; }
  const conn = conns[0];
  const CHUNK = 16384;
  const total = Math.ceil(file.size / CHUNK);
  $("fileProgressContainer").classList.remove("hidden");
  $("transferFileName").textContent = file.name;
  conn.send({ type: "file-meta", name: file.name, size: file.size, total });
  for (let i = 0; i < total; i++) {
    const chunk = file.slice(i * CHUNK, (i + 1) * CHUNK);
    const buf = await chunk.arrayBuffer();
    conn.send({ type: "file-chunk", index: i, data: buf });
    const pct = Math.round(((i + 1) / total) * 100);
    $("transferPercent").textContent = pct + "%";
    $("transferProgressBar").style.width = pct + "%";
    await new Promise(r => setTimeout(r, 0));
  }
  conn.send({ type: "file-end" });
  addChatMessage("SYSTEM", "📤 أُرسل: " + file.name);
  beep(880, 100);
  setTimeout(() => $("fileProgressContainer").classList.add("hidden"), 2000);
}

}

/* ═══ MATRIX BACKGROUND ═══ */
function initMatrix() {
  const canvas = $("matrixCanvas"); const ctx = canvas.getContext("2d");
  let width, height; let stars = [], particles = [];
  function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
  resize(); window.addEventListener("resize", resize);

  class Star {
    constructor() { this.reset(); }
    reset() { this.x = (Math.random() - 0.5) * width * 2; this.y = (Math.random() - 0.5) * height * 2; this.z = Math.random() * width; this.pz = this.z; }
    update(speed) { this.z -= speed; if (this.z < 1) this.reset(); }
    draw() {
      const sx = (this.x / this.z) * width + width / 2, sy = (this.y / this.z) * height + height / 2;
      const px = (this.x / this.pz) * width + width / 2, py = (this.y / this.pz) * height + height / 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy);
      ctx.strokeStyle = `rgba(200, 230, 255, ${1 - this.z / width})`; ctx.lineWidth = 1; ctx.stroke();
      this.pz = this.z;
    }
  }
  class CrystalDust {
    constructor(x, y) {
      this.x = x; this.y = y; this.size = Math.random() * 4 + 1;
      this.speedX = Math.random() * 6 - 3; this.speedY = Math.random() * 6 - 3;
      const colors = ["#00ffff", "#00bfff", "#8a2be2", "#ff69b4", "#ffffff"];
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.life = 1.0; this.decay = Math.random() * 0.02 + 0.01;
    }
    update() { this.x += this.speedX; this.y += this.speedY; this.life -= this.decay; if (this.size > 0.2) this.size -= 0.06; }
    draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.fillStyle = this.color; ctx.globalAlpha = this.life; ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  }
  for (let i = 0; i < 250; i++) stars.push(new Star());
  canvas.addEventListener("click", e => {
    const r = canvas.getBoundingClientRect();
    for (let i = 0; i < 15; i++) particles.push(new CrystalDust(e.clientX - r.left, e.clientY - r.top));
  });
  function animate() {
    ctx.fillStyle = "rgba(3, 0, 20, 0.2)"; ctx.fillRect(0, 0, width, height);
    stars.forEach(s => { s.update(8); s.draw(); });
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update(); particles[i].draw();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(animate);
  }
  animate();
}

termInput.addEventListener("keydown", async e => {
  if (e.key === "Enter") {
    const val = termInput.value; termInput.value = "";
    await runCommand(val);
  } else if (e.key === "ArrowUp") {
    if (historyIndex > 0) { historyIndex--; termInput.value = commandHistory[historyIndex] || ""; }
    e.preventDefault();
  } else if (e.key === "ArrowDown") {
    if (historyIndex < commandHistory.length - 1) { historyIndex++; termInput.value = commandHistory[historyIndex] || ""; }
    else { historyIndex = commandHistory.length; termInput.value = ""; }
    e.preventDefault();
  } else if (e.key === "Tab") {
    e.preventDefault();
    const partial = termInput.value.trim();
    if (!partial) return;
    const cmds = ["help","ai","call","ls","cd","cat","pwd","write","nano","mkdir","rm","cp","mv","touch","tree","find","stat","sysinfo","whoami","id","su","sudo","echo","env","export","date","uptime","ps","top","chain","chain-verify","clear","history","speak","listen","msg","members","peer"];
    const matches = cmds.filter(c => c.startsWith(partial));
    if (matches.length === 1) termInput.value = matches[0] + " ";
    else if (matches.length > 1) printToTerm(matches.join("  "), "text-cyber-cyan");
  }
});
