/* ═══ Blockchain ═══ */
async function computeSHA256(message) {
  const buf = new TextEncoder().encode(message);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function addBlock(data) {
  const prev = blockchain[blockchain.length - 1] || { hash: "0000000000", index: -1 };
  const timestamp = Date.now();
  const hash = await computeSHA256(prev.hash + data + timestamp);
  const block = { index: prev.index + 1, timestamp, data, prevHash: prev.hash, hash };
  blockchain.push(block);
  $('chainStat').textContent = 'Blocks: ' + blockchain.length;
  addAuditEvent('INFO', 'Block #' + block.index + ': ' + data.substring(0, 20));
  try { localStorage.setItem('sovereign_chain_v27', JSON.stringify(blockchain)); } catch (e) {}
  return block;
}

/* ═══ Crypto ═══ */
async function hashPassword(password, salt) {
  const data = new TextEncoder().encode(salt + ":" + password + ":LAFI-MUNIR-V27");
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function generateSalt() {
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function verifyPassword(username, password) {
  const s = shadowDB.get(username);
  if (!s) return false;
  return (await hashPassword(password, s.salt)) === s.hash;
}
function xorCipher(text, key) {
  const t = new TextEncoder().encode(text);
  const k = new TextEncoder().encode(key);
  const out = new Uint8Array(t.length);
  for (let i = 0; i < t.length; i++) out[i] = t[i] ^ k[i % k.length];
  let bin = "";
  for (let i = 0; i < out.length; i++) bin += String.fromCharCode(out[i]);
  return "ENC:" + btoa(bin);
}
function xorDecipher(c, key) {
  try {
    if (!c.startsWith("ENC:")) return null;
    const bin = atob(c.slice(4));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const k = new TextEncoder().encode(key);
    const out = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) out[i] = bytes[i] ^ k[i % k.length];
    return new TextDecoder().decode(out);
  } catch (e) { return null; }
}

async function createUser(username, uid, gid, home, shell, password, groups) {
  groups = groups || [];
  if (passwdDB.has(username)) return { ok: false, error: "user exists" };
  passwdDB.set(username, { username, uid, gid, home, shell, created: Date.now() });
  const salt = generateSalt();
  const hash = await hashPassword(password, salt);
  shadowDB.set(username, { hash, salt, lastChange: Date.now() });
  groups.forEach(g => {
    if (groupDB.has(g)) {
      const grp = groupDB.get(g);
      if (!grp.members.includes(username)) grp.members.push(username);
    }
  });
  VFS[home] = { type: "dir", children: [], owner: username, group: gid, mode: "rwxr-xr-x" };
  return { ok: true };
}
async function createGroup(name, gid, members) {
  members = members || [];
  if (groupDB.has(name)) return { ok: false };
  groupDB.set(name, { name, gid, members: members.slice() });
  return { ok: true };
}
async function deleteUser(username) {
  if (username === "root") return { ok: false, error: "cannot delete root" };
  if (!passwdDB.has(username)) return { ok: false, error: "user not found" };
  const u = passwdDB.get(username);
  passwdDB.delete(username);
  shadowDB.delete(username);
  groupDB.forEach(g => { g.members = g.members.filter(m => m !== username); });
  return { ok: true, home: u.home };
}
async function changePassword(username, newPassword) {
  const salt = generateSalt();
  const hash = await hashPassword(newPassword, salt);
  shadowDB.set(username, { hash, salt, lastChange: Date.now() });
  return true;
}
function getUserGroups(username) {
  const groups = [];
  const user = passwdDB.get(username);
  if (user) {
    groupDB.forEach(g => {
      if (g.gid === user.gid && groups.indexOf(g.name) === -1) groups.unshift(g.name);
    });
  }
  groupDB.forEach(g => {
    if (g.members.indexOf(username) !== -1 && groups.indexOf(g.name) === -1) groups.push(g.name);
  });
  return groups;
}

/* ═══ 3D Matrix ═══ */
let angle = 0;
function drawMatrix() {
  ctx.fillStyle = '#020005';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2, size = 30;
  angle += 0.02;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  for (let x = -2; x <= 2; x++) {
    for (let y = -2; y <= 2; y++) {
      const px = x * size, py = y * size;
      const pz = Math.sin(x + y + angle * 2) * 18;
      const rx = px * cos - pz * sin;

/* ═══ Tokenizer ═══ */
function tokenizeShellLine(line) {
  const tokens = []; let current = "", quote = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quote) { if (c === quote) quote = null; else current += c; }
    else if (c === '"' || c === "'") quote = c;
    else if (c === ' ' || c === '\t') { if (current) { tokens.push(current); current = ""; } }
    else if (c === '|' || c === '>' || c === '<') {
      if (current) { tokens.push(current); current = ""; }
      if (c === '>' && line[i + 1] === '>') { tokens.push(">>"); i++; }
      else tokens.push(c);
    } else current += c;
  }
  if (current) tokens.push(current);
  return tokens;
}

/* ═══ Pipeline ═══ */
async function runPipeline(line, opts) {
  opts = opts || {};
  if (line.indexOf(';') !== -1 && line.indexOf('"') === -1 && line.indexOf("'") === -1) {
    const parts = line.split(';').map(s => s.trim()).filter(Boolean);
    for (let i = 0; i < parts.length; i++) await runPipeline(parts[i], opts);
    return;
  }
  const tokens = tokenizeShellLine(line);
  if (tokens.length === 0) return;
  const stages = [[]]; let redirect = null;
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t === '|') { stages.push([]); continue; }
    if (t === '>' || t === '>>' || t === '<') { redirect = { type: t, target: tokens[i + 1] }; i++; continue; }
    stages[stages.length - 1].push(t);
  }
  const hasPipe = stages.length > 1;
  let lastOutput = [];
  for (let s = 0; s < stages.length; s++) {
    terminalBuffer = [];
    const stageTokens = stages[s];
    if (stageTokens.length === 0) continue;
    const expanded = stageTokens.map(expandVars);
    const cmd = expanded[0].toLowerCase();
    const args = expanded.slice(1);
    const capture = hasPipe || opts.silent;
    await executeOneCommand(cmd, args, { capture, silent: opts.silent });
    lastOutput = terminalBuffer;
    if (s < stages.length - 1) shellVars.STDIN = lastOutput.map(l => l.text).join("\n");
  }
  if (hasPipe && !opts.silent) lastOutput.forEach(l => printTerm(l.text, l.color, false));
  if (opts.silent && !hasPipe) lastOutput.forEach(l => printTerm(l.text, l.color, false));
  if (redirect && redirect.type !== '<') {
    const target = resolvePath(redirect.target);
    const content = lastOutput.map(l => l.text).join("\n");
    if (redirect.type === ">>" && VFS[target] && VFS[target].type === "file") VFS[target].content += "\n" + content;
    else {
      VFS[target] = { type: "file", content, restricted: false, owner: session.username, group: getCurrentUser()?.gid || 100, mode: "rw-r--r--" };
      const lastSlash = target.lastIndexOf("/");
      const parent = lastSlash > 0 ? target.substring(0, lastSlash) : "/";
      const fname = target.substring(lastSlash + 1);
      if (VFS[parent]?.children && VFS[parent].children.indexOf(fname) === -1) VFS[parent].children.push(fname);
    }
    if (!opts.silent) printTerm("[REDIRECT]: " + redirect.type + " " + redirect.target, "#38bdf8");
  }
}
function expandVars(token) {
  return token.replace(/\$\{(\w+)\}|\$(\w+)/g, (_, a, b) => {
    const name = a || b;
    return shellVars[name] !== undefined ? shellVars[name] : "";
  });
}

/* ═══ Bash-lite ═══ */

      if (raw === 'done' || raw === 'fi' || raw === '}') return idx + 1;
      if (raw.startsWith('for ')) {
        const m = raw.match(/^for\s+(\w+)\s+in\s+(.+?)(?:;?\s*do)?$/);
        if (m) {
          const varName = m[1];
          const items = m[2].replace(/;?\s*do$/, "").trim().split(/\s+/).map(expandVars);
          const bodyLines = []; let depth = 1, j = idx + 1;
          while (j < lines.length && depth > 0) {
            const l = lines[j].trim();
            if (l.startsWith('for ') || l.startsWith('while ')) depth++;
            if (l === 'done') { depth--; if (depth === 0) break; }
            bodyLines.push(lines[j]); j++;
          }
          for (let k = 0; k < items.length; k++) { shellVars[varName] = items[k]; await runScriptContent(bodyLines.join("\n"), opts); }
          idx = j + 1; continue;
        }
      }
      if (raw.startsWith('while ')) {
        const m = raw.match(/^while\s+(.+?)(?:;?\s*do)?$/);
        if (m) {
          const condition = m[1].replace(/;?\s*do$/, "").trim();
          const bodyLines = []; let depth = 1, j = idx + 1;
          while (j < lines.length && depth > 0) {
            const l = lines[j].trim();
            if (l.startsWith('while ') || l.startsWith('for ')) depth++;
            if (l === 'done') { depth--; if (depth === 0) break; }
            bodyLines.push(lines[j]); j++;
          }
          let iter = 0;
          while (iter < 20 && evaluateCondition(condition)) { await runScriptContent(bodyLines.join("\n"), opts); iter++; }
          idx = j + 1; continue;
        }
      }
      if (raw.startsWith('if ')) {
        const result = parseIfBlock(lines, idx);
        for (let k = 0; k < result.branches.length; k++) {
          const br = result.branches[k];
          if (br.cond === null || evaluateCondition(br.cond)) { await runScriptContent(br.body.join("\n"), opts); break; }
        }
        idx = result.nextIdx; continue;
      }
      const varMatch = raw.match(/^(\w+)=(.*)$/);
      if (varMatch && !raw.startsWith("if") && !raw.startsWith("for") && !raw.startsWith("while")) {
        shellVars[varMatch[1]] = expandVars(varMatch[2].replace(/^["']|["']$/g, "")); idx++; continue;
      }
      if (raw === 'exit' || raw.startsWith('exit ')) return lines.length;
      await runPipeline(raw, opts); idx++;

    return idx;
  }
}
function parseIfBlock(lines, startIdx) {
  const branches = []; let idx = startIdx, currentCond = null, currentBody = [], depth = 1;
  const firstLine = lines[idx].trim();
  const m = firstLine.match(/^if\s+(.+?)(?:;?\s*then)?$/);
  currentCond = m ? m[1].replace(/;?\s*then$/, "").trim() : null;
  idx++;
  while (idx < lines.length) {
    const raw = lines[idx].trim();
    if (raw.startsWith('if ')) depth++;

      depth--;

        if (currentBody.length > 0 || currentCond !== null) branches.push({ cond: currentCond, body: currentBody.slice() });
        return { branches, nextIdx: idx + 1 };
      }
    }
    if (depth === 1) {
      if (raw === 'else') { branches.push({ cond: currentCond, body: currentBody.slice() }); currentCond = null; currentBody = []; idx++; continue; }
      if (raw.startsWith('elif ')) {
        branches.push({ cond: currentCond, body: currentBody.slice() });

        currentBody = []; idx++; continue;
      }
    }

}
function evaluateCondition(cond) {
  cond = cond.trim();
  let m = cond.match(/^\[\s*(.+?)\s*\]$/) || cond.match(/^test\s+(.+)$/);
  if (m) cond = m[1].trim();
  const sq = s => s.replace(/^["']|["']$/g, '');
  m = cond.match(/^(.+?)\s+(==|=)\s+(.+)$/);
  if (m) return expandVars(sq(m[1].trim())) === expandVars(sq(m[3].trim()));
  m = cond.match(/^(.+?)\s+!=\s+(.+)$/);
  if (m) return expandVars(sq(m[1].trim())) !== expandVars(sq(m[2].trim()));
  m = cond.match(/^(.+?)\s+-eq\s+(.+)$/);
  if (m) return parseInt(expandVars(m[1]), 10) === parseInt(expandVars(m[2]), 10);
  m = cond.match(/^(.+?)\s+-ne\s+(.+)$/);
  if (m) return parseInt(expandVars(m[1]), 10) !== parseInt(expandVars(m[2]), 10);
  m = cond.match(/^(.+?)\s+-gt\s+(.+)$/);
  if (m) return parseInt(expandVars(m[1]), 10) > parseInt(expandVars(m[2]), 10);
  m = cond.match(/^(.+?)\s+-lt\s+(.+)$/);
  if (m) return parseInt(expandVars(m[1]), 10) < parseInt(expandVars(m[2]), 10);
  m = cond.match(/^-z\s+(.+)$/);
  if (m) return expandVars(m[1]).length === 0;
  m = cond.match(/^-n\s+(.+)$/);
  if (m) return expandVars(m[1]).length > 0;
  return !!cond && cond !== "0" && cond !== "false";
}

/* ═══ VFS Helpers ═══ */
function resolvePath(arg) {
  if (!arg) return currentPath;
  if (arg === "~") return getCurrentUser()?.home || currentPath;
  if (arg.startsWith("/")) { const cleaned = arg.replace(/\/+/g, "/").replace(/\/$/, ""); return cleaned || "/"; }
  if (arg === "..") {
    if (currentPath === "/") return "/";
    const parts = currentPath.split("/").filter(Boolean); parts.pop();
    return parts.length === 0 ? "/" : "/" + parts.join("/");
  }
  if (arg === ".") return currentPath;
  return currentPath === "/" ? "/" + arg : currentPath + "/" + arg;
}
function checkPermission(node, action) {
  action = action || "read";
  if (!node) return false;
  if (isRoot()) return true;
  const user = getCurrentUser();
  if (!user) return false;
  if (node.owner === user.username) return true;
  const gs = getUserGroups(user.username);
  for (let i = 0; i < gs.length; i++) {
    const g = groupDB.get(gs[i]);
    if (g && g.gid === node.group) return true;
  }
  if (node.mode && node.mode.length >= 9) {
    const pub = node.mode.substring(6);
    if (action === "read" && pub[0] === "r") return true;
    if (action === "write" && pub[1] === "w") return true;
    if (action === "exec" && pub[2] === "x") return true;
  }
  return false;
}

/* ═══ Commands ═══ */
async function executeOneCommand(cmd, args, opts) {
  opts = opts || {};

  if (shellFunctions[cmd]) { await runScriptContent(shellFunctions[cmd], opts); return; }

    case "echo": {
      let text = args.join(" ").replace(/^["']|["']$/g, "");
      text = expandVars(text).replace(/\\n/g, "\n");
      if (!text && shellVars.STDIN) text = shellVars.STDIN;
      out(text, "#00ff66"); break;
    }
    case "printf": out(expandVars(args.join(" ")).replace(/\\n/g, "\n"), "#00ff66"); break;
    case "clear": if (!cap) $('termBody').innerHTML = ""; break;
    case "help": case "مساعدة":
      out("═══ نظام لافي منير — الأوامر ═══", "#ffd700");
      out(" 🐚 bash: VAR=val | if/then/fi | for/do/done", "#38bdf8");
      out(" 🔗 Pipes: cmd1 | cmd2   Redirection: > >> <", "#38bdf8");
      out(" 📝 nano | 🐚 ./script.sh | 📊 audit", "#38bdf8");
      out(" 👤 whoami, id, su, sudo, useradd, passwd", "#38bdf8");
      out(" 📁 ls, cd, cat, write, rm, mkdir", "#38bdf8");
      out(" 🔎 grep, wc, head, tail, sort, uniq", "#38bdf8");
      out(" 🔒 encrypt, decrypt, ps, sysinfo", "#38bdf8");
      out(" ⛓️  chain, block, verify, logout", "#38bdf8");
      break;
    case "whoami": out(session.username, "#00ff66"); break;
    case "pwd": out(currentPath, "#00ff66"); break;
    case "id": {
      const u = getCurrentUser();
      const gs = getUserGroups(u.username);
      out("uid=" + u.uid + "(" + u.username + ") gid=" + u.gid + " groups=" + gs.join(","), "#00ff66"); break;
    }
    case "groups": out(getUserGroups(session.username).join(" "), "#00ff66"); break;
    case "logout": case "exit": if (!cap) await performLogout(); break;
    case "env": case "set": Object.keys(shellVars).forEach(k => out(k + "=" + shellVars[k], "#38bdf8")); break;
    case "su": {
      const t = args[0];
      if (!t) { out("su: usage: su <user>", "#ff0844"); break; }
      if (!passwdDB.has(t)) { out("su: user not found", "#ff0844"); break; }
      if (!cap) { printTerm("Password for " + t + ":", "#ffd700"); suPending = { targetUsername: t }; $('cmdInput').type = "password"; }

    }

    }
    case "cd": {
      const target = resolvePath(args[0] || (isRoot() ? "/root" : "/home/" + session.username));
      if (!VFS[target] || VFS[target].type !== "dir") { out("cd: no such directory", "#ff0844"); break; }
      if (!checkPermission(VFS[target], "exec")) { out("cd: Permission denied", "#ff0844"); break; }
      currentPath = target; shellVars.PWD = currentPath; updateStats(); break;
    }
    case "cat": {
      if (!args[0]) {
        if (shellVars.STDIN) { shellVars.STDIN.split("\n").forEach(l => out(l, "#00ff66")); break; }
        out("cat: usage", "#ff0844"); break;
      }
      const fp = resolvePath(args[0]);
      if (fp === "/etc/passwd") { passwdDB.forEach(u => out(u.username + ":x:" + u.uid + ":" + u.gid + "::" + u.home + ":" + u.shell, "#00ff66")); break; }
      if (fp === "/etc/group") { groupDB.forEach(g => out(g.name + ":x:" + g.gid + ":" + g.members.join(","), "#00ff66")); break; }
      if (fp === "/etc/shadow") {
        if (!isRoot()) { out("cat: /etc/shadow: Permission denied", "#ff0844"); break; }
        shadowDB.forEach((s, n) => out(n + ":$6$" + s.hash.substring(0, 20) + "...:...", "#ff007f")); break;
      }
      if (!VFS[fp] || VFS[fp].type !== "file") { out("cat: no such file", "#ff0844"); break; }
      if (!checkPermission(VFS[fp], "read")) { out("cat: Permission denied", "#ff0844"); break; }
      VFS[fp].content.split("\n").forEach(l => out(l, "#00ff66")); break;
    }
    case "write": {
      if (args.length < 2) { out("write <file> <content>", "#ff0844"); break; }
      const name = args[0];
      if (name.indexOf("/") !== -1) { out("write: filename only", "#ff0844"); break; }
      const txt = args.slice(1).join(" ");
      const path = currentPath === "/" ? "/" + name : currentPath + "/" + name;
      const dir = VFS[currentPath];
      if (!checkPermission(dir, "write")) { out("write: Permission denied", "#ff0844"); break; }
      VFS[path] = { type: "file", content: txt, restricted: false, owner: session.username, group: getCurrentUser().gid, mode: "rw-r--r--" };
      if (dir.children.indexOf(name) === -1) dir.children.push(name);
      await addBlock("WRITE: " + path);
      out("[OK] ✅", "#00ff66"); break;
    }
    case "rm": {
      if (!args[0]) { out("rm <file>", "#ff0844"); break; }
      const fp = resolvePath(args[0]);
      if (fp === "/" || fp === currentPath) { out("rm: cannot remove cwd", "#ff0844"); break; }
      const node = VFS[fp];
      if (!node) { out("rm: no such file", "#ff0844"); break; }
      if (!checkPermission(node, "write")) { out("rm: Permission denied", "#ff0844"); break; }
      const lastSlash = fp.lastIndexOf("/");
      const parent = lastSlash > 0 ? fp.substring(0, lastSlash) : "/";
      const name = fp.substring(lastSlash + 1);
      delete VFS[fp];
      if (VFS[parent]?.children) VFS[parent].children = VFS[parent].children.filter(c => c !== name);
      await addBlock("RM: " + fp);
      out("[OK] removed", "#00ff66"); break;
    }
    case "mkdir": {
      if (!args[0]) { out("mkdir <dir>", "#ff0844"); break; }
      const fp = resolvePath(args[0]);
      if (VFS[fp]) { out("mkdir: exists", "#ff0844"); break; }
      const lastSlash = fp.lastIndexOf("/");
      const parent = lastSlash > 0 ? fp.substring(0, lastSlash) : "/";
      const name = fp.substring(lastSlash + 1);
      if (!VFS[parent] || VFS[parent].type !== "dir") { out("mkdir: parent missing", "#ff0844"); break; }
      if (!checkPermission(VFS[parent], "write")) { out("mkdir: Permission denied", "#ff0844"); break; }
      VFS[fp] = { type: "dir", children: [], owner: session.username, group: getCurrentUser().gid, mode: "rwxr-xr-x" };
      if (VFS[parent].children.indexOf(name) === -1) VFS[parent].children.push(name);
      out("[OK] " + args[0] + "/", "#00ff66"); break;
    }
    case "grep": {
      const pattern = args[0]; if (!pattern) { out("grep <pattern>", "#ff0844"); break; }
      const source = shellVars.STDIN ? shellVars.STDIN.split("\n") : [];
      if (source.length === 0 && args[1]) { const fp = resolvePath(args[1]); if (VFS[fp]?.type === "file") source.push.apply(source, VFS[fp].content.split("\n")); }
      let re = null; try { re = new RegExp(pattern, "i"); } catch (e) { re = null; }
      source.forEach(l => { if (re ? re.test(l) : l.indexOf(pattern) !== -1) out(l, "#00ff66"); });
      break;
    }
    case "wc": { const s = shellVars.STDIN || ""; out("  " + s.split("\n").length + "  " + s.split(/\s+/).filter(Boolean).length + "  " + s.length, "#ffd700"); break; }
    case "head": { const n = args[0]?.startsWith("-") ? parseInt(args[0].slice(1), 10) : 10; (shellVars.STDIN || "").split("\n").slice(0, n).forEach(l => out(l, "#00ff66")); break; }
    case "tail": { const n = args[0]?.startsWith("-") ? parseInt(args[0].slice(1), 10) : 10; (shellVars.STDIN || "").split("\n").slice(-n).forEach(l => out(l, "#00ff66")); break; }
    case "sort": (shellVars.STDIN || "").split("\n").filter(Boolean).sort().forEach(l => out(l, "#00ff66")); break;
    case "uniq": { let prev = null; (shellVars.STDIN || "").split("\n").forEach(l => { if (l !== prev) { out(l, "#00ff66"); prev = l; } }); break; }
    case "encrypt": {
      if (args.length < 2) { out("encrypt <file> <key>", "#ff0844"); break; }
      const fp = resolvePath(args[0]);
      if (!VFS[fp] || VFS[fp].type !== "file") { out("encrypt: no such file", "#ff0844"); break; }
      if (!checkPermission(VFS[fp], "write")) { out("encrypt: Permission denied", "#ff0844"); break; }
      if (VFS[fp].content.startsWith("ENC:")) { out("Already encrypted", "#ffd700"); break; }
      VFS[fp].content = xorCipher(VFS[fp].content, args[1]);
      await addBlock("ENCRYPT: " + args[0]);
      out("[CIPHER] ✅", "#00ff66"); break;
    }
    case "decrypt": {
      if (args.length < 2) { out("decrypt <file> <key>", "#ff0844"); break; }
      const fp = resolvePath(args[0]);
      if (!VFS[fp] || VFS[fp].type !== "file") { out("decrypt: no such file", "#ff0844"); break; }
      if (!checkPermission(VFS[fp], "write")) { out("decrypt: Permission denied", "#ff0844"); break; }
      const dec = xorDecipher(VFS[fp].content, args[1]);
      if (dec !== null && dec.indexOf("\u0000") === -1) { VFS[fp].content = dec; await addBlock("DECRYPT: " + args[0]); out("[CIPHER] ✅", "#00ff66"); }
      else out("[CIPHER ERROR]: wrong key", "#ff0844");
      break;
    }
    case "ps":
      out("  PID  USER        STAT   COMMAND", "#ffd700");
      [{ pid: 1, user: "root", stat: "Ss", cmd: "systemd" }, { pid: 214, user: "root", stat: "S", cmd: "sshd" }, { pid: 501, user: "root", stat: "S", cmd: "kernel_apex" }, { pid: 1024, user: session.username || "none", stat: "R", cmd: "-bash" }].forEach(p => out("  " + String(p.pid).padEnd(5) + " " + p.user.padEnd(11) + " " + p.stat.padEnd(6) + " " + p.cmd, p.user === "root" ? "#ff007f" : "#38bdf8"));
      break;
    case "sysinfo":
      out("═══ نظام لافي منير ═══", "#ffd700");
      out("User       : " + session.username + " (UID " + session.uid + ")", "#e5e7eb");
      out("Groups     : " + getUserGroups(session.username).join(", "), "#38bdf8");
      out("Privilege  : " + (isRoot() ? "ROOT 👑" : canSudo() ? "SUDO-capable" : "User"), isRoot() ? "#ff007f" : "#38bdf8");
      out("Blocks     : " + blockchain.length, "#00ff66");
      out("Audit      : " + auditEvents.length + " events", "#38bdf8");
      out("Copyright  : © لافي منير 2026", "#ffd700");
      break;
    case "audit": {
      if (args[0] === "clear") { auditEvents = []; addAuditEvent("WARN", "Audit cleared"); out("[AUDIT] ✅", "#00ff66"); }
      else auditEvents.slice(0, 20).forEach(e => out("[" + e.time + "] [" + e.type + "] " + e.message, e.type === "ERROR" ? "#ff0844" : e.type === "WARN" ? "#ffd700" : "#00ff66"));
      break;
    }
    case "nano": case "vim": case "vi":
      if (!args[0]) { out("nano <file>", "#ff0844"); break; }
      if (!cap) openNano(args[0]);
      break;
    case "bash": case "sh": {
      const t = args[0];
      if (!t) { out("bash <script.sh>", "#ff0844"); break; }
      const fp = resolvePath(t);
      if (!VFS[fp] || VFS[fp].type !== "file") { out("bash: no such file", "#ff0844"); break; }
      await addBlock("EXEC: " + fp);
      addAuditEvent("INFO", "Executed '" + fp + "'");
      if (!cap) printTerm("[EXEC] " + t, "#38bdf8");
      const savedPath = currentPath;
      await runScriptContent(VFS[fp].content, opts);
      currentPath = savedPath; break;
    }
    case "chain":
      out("═══ LEDGER ═══", "#ffd700");
      blockchain.slice(-12).forEach(b => out("[#" + b.index + "] " + b.hash.substring(0, 16) + "... | " + b.data, "#00f2fe"));
      break;
    case "block": { const nb = await addBlock(args.join(" ") || "Manual"); out("[MINED] Block #" + nb.index, "#00ff66"); break; }
    case "verify": {
      let ok = true;
      for (let i = 1; i < blockchain.length; i++) {
        const c = blockchain[i], p = blockchain[i - 1];
        if (c.prevHash !== p.hash) { ok = false; break; }
        if (c.hash !== await computeSHA256(p.hash + c.data + c.timestamp)) { ok = false; break; }
      }
      out(ok ? "[✅] سليمة" : "[❌] تلاعب!", ok ? "#00ff66" : "#ff0844");
      break;
    }
    default:
      if (cmd.indexOf("./") === 0 || cmd.endsWith(".sh")) {
        const fp = resolvePath(cmd.indexOf("./") === 0 ? cmd.slice(2) : cmd);
        if (VFS[fp]?.type === "file") {
          if (!checkPermission(VFS[fp], "exec")) { out("bash: Permission denied", "#ff0844"); break; }
          await addBlock("EXEC: " + fp);
          addAuditEvent("INFO", "Executed '" + fp + "'");
          if (!cap) printTerm("[EXEC] " + cmd, "#38bdf8");
          const savedPath = currentPath;
          await runScriptContent(VFS[fp].content, opts);
          currentPath = savedPath; break;
        }
      }
      out("Unknown command: " + cmd, "#ff0844");
  }
}

/* ═══ Nano ═══ */
function openNano(filename) {
  if (!filename) return;
  const fp = resolvePath(filename);
  const existing = VFS[fp];
  if (existing && existing.type === "dir") { printTerm("nano: is directory", "#ff0844"); return; }
  if (existing && !checkPermission(existing, "write")) { printTerm("nano: Permission denied", "#ff0844"); return; }
  nanoState.active = true; nanoState.filename = filename; nanoState.fullPath = fp;
  nanoState.originalContent = existing ? existing.content : ""; nanoState.dirty = false;
  $('editorOverlay').classList.add('active');
  $('editorFilename').textContent = "nano — " + filename;
  $('editorArea').value = nanoState.originalContent;
  setTimeout(() => $('editorArea').focus(), 50);
  updateEditorInfo(); updateStats();
}
function updateEditorInfo() {
  const v = $('editorArea').value;
  const pos = $('editorArea').selectionStart;
  $('editorLineInfo').textContent = "سطر: " + v.substring(0, pos).split("\n").length + " | أحرف: " + v.length;
}
async function saveNano() {
  const v = $('editorArea').value;
  const fp = nanoState.fullPath;
  const lastSlash = fp.lastIndexOf("/");
  const parent = lastSlash > 0 ? fp.substring(0, lastSlash) : "/";
  const name = fp.substring(lastSlash + 1);
  const existing = VFS[fp];
  if (existing) existing.content = v;
  else VFS[fp] = { type: "file", content: v, restricted: false, owner: session.username, group: getCurrentUser()?.gid || 100, mode: "rw-r--r--" };
  if (VFS[parent]?.children && VFS[parent].children.indexOf(name) === -1) VFS[parent].children.push(name);
  nanoState.dirty = false;
  await addBlock("NANO_SAVE: " + fp);
  printTerm("[NANO] 💾 Saved (" + v.length + " chars)", "#00ff66");
}
function closeNano() {
  if (!nanoState.active) return;
  if (nanoState.dirty) { if (confirm("⚠️ Unsave changes! OK to save?")) saveNano(); else return; }
  nanoState.active = false;
  $('editorOverlay').classList.remove('active');
  $('cmdInput').focus(); updateStats();
  printTerm("[NANO] 🚪 Closed", "#38bdf8");
}

/* ═══ Events ═══ */
$('editorArea').addEventListener('input', () => { nanoState.dirty = true; updateEditorInfo(); });
$('editorArea').addEventListener('keyup', updateEditorInfo);
$('editorArea').addEventListener('click', updateEditorInfo);
$('editorOverlay').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveNano(); }
  else if (e.ctrlKey && e.key === 'x') { e.preventDefault(); closeNano(); }
  else if (e.ctrlKey && e.key === 'k') { e.preventDefault(); $('editorArea').value = ""; nanoState.dirty = true; }
});
$('cmdInput').addEventListener('keydown', async e => {
  if (e.key === 'ArrowUp' && session.loginState === "LOGGED_IN" && !nanoState.active) {
    e.preventDefault();
    if (historyIndex > 0) { historyIndex--; $('cmdInput').value = commandHistory[historyIndex]; }
    return;
  }
  if (e.key === 'ArrowDown' && session.loginState === "LOGGED_IN" && !nanoState.active) {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) { historyIndex++; $('cmdInput').value = commandHistory[historyIndex]; }
    else { historyIndex = commandHistory.length; $('cmdInput').value = ""; }
    return;
  }
  if (e.key !== 'Enter' || nanoState.active) return;
  const val = $('cmdInput').value;
  $('cmdInput').value = "";
  if (suPending) {
    const p = suPending; suPending = null; $('cmdInput').type = "text";
    if (p.mode === "passwd") { await changePassword(p.targetUsername, val); addAuditEvent("WARN", "Password changed"); await addBlock("PASSWD: " + p.targetUsername); printTerm("✅ Password changed", "#00ff66"); return; }
    else { const r = await performSu(p.targetUsername, val); if (!r.ok) printTerm(r.error, "#ff0844"); else printTerm("✅ Now: " + session.username, "#00ff66"); return; }
  }
  if (session.loginState !== "LOGGED_IN") {
    if (session.loginState === "AWAITING_USERNAME") { printTerm("login: " + val, "#38bdf8"); await handleLoginInput(val); }
    else if (session.loginState === "AWAITING_PASSWORD") { printTerm("Password: ••••••••", "#38bdf8"); await handleLoginInput(val); }
    return;
  }
  printTerm($('promptText').textContent + " " + val, "#00f2fe");
  commandHistory.push(val); historyIndex = commandHistory.length;
  await runPipeline(val);
  updateStats();
});
document.addEventListener('click', e => {
  if (nanoState.active) return;
  if (e.target.closest('.editor-overlay')) return;
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
  $('cmdInput').focus();
});
$('exportChainBtn').addEventListener('click', () => {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(blockchain, null, 2));
  const a = document.createElement('a'); a.href = dataStr; a.download = "chain_" + Date.now() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  printTerm("[EXPORT] ✅ Chain exported", "#00ff66");
});
$('exportAuditBtn').addEventListener('click', () => {
  const content = auditEvents.map(e => "[" + e.time + "] [" + e.type + "] " + e.message).join("\n");
  const dataStr = "data:text/plain;charset=utf-8," + encodeURIComponent(content);
  const a = document.createElement('a'); a.href = dataStr; a.download = "audit_" + Date.now() + ".txt";
  document.body.appendChild(a); a.click(); a.remove();
  printTerm("[EXPORT] ✅ Audit exported", "#00ff66");
});

/* ═══ Boot ═══ */
(async function boot() {
  try { await initSystemState(); addAuditEvent("INFO", "System boot v27.0 — لافي منير"); showLoginScreen(); }
  catch (err) { document.body.innerHTML = '<div style="color:#ff0844;padding:20px;font-family:monospace;">Boot failed: ' + err.message + '</div>'; }
})();

})();
</script>
