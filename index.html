<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لافي منير | الحصن السيادي المشفر 🔐🌌</title>

  <meta name="theme-color" content="#0d0221">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- [حماية ضد النسخ والسرقة] -->
  <script>
    (function SecurityShield() {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('selectstart', e => e.preventDefault());
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
    body { 
      min-height: 100vh; overflow: hidden; color: #fff; 
      background: linear-gradient(135deg, #070114, #13002b, #1f0040, #2e0249); 
      background-size: 300% 300%; 
      animation: cosmicAurora 14s ease infinite; 
    }
    @keyframes cosmicAurora { 
      0%, 100% { background-position: 0% 50%; } 
      50% { background-position: 100% 50%; } 
    }
    #matrixCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.12; }
    
    .container { 
      position: relative; z-index: 3; display: flex; flex-direction: column; 
      width: 100%; max-width: 430px; height: 100vh; margin: auto; 
      justify-content: center; align-items: center; padding: 25px;
      background: rgba(14, 5, 30, 0.92); 
      border-left: 2px solid rgba(0, 242, 254, 0.5); border-right: 2px solid rgba(255, 0, 127, 0.5); 
      backdrop-filter: blur(28px); box-shadow: 0 0 50px rgba(0, 242, 254, 0.4); 
    }
    
    .shield-box { 
      width: 95px; height: 95px; margin: 0 auto 16px; padding: 3px; border-radius: 50%; 
      background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f); 
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.8); animation: shieldGlow 3s infinite alternate; 
      display: flex; align-items: center; justify-content: center;
    }
    .shield-inner { 
      display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; 
      border-radius: 50%; background: #080214; font-size: 38px; text-shadow: 0 0 15px rgba(0, 242, 254, 0.8); 
    }
    @keyframes shieldGlow { 
      from { transform: scale(1); box-shadow: 0 0 30px rgba(0, 242, 254, 0.4); } 
      to { transform: scale(1.06); box-shadow: 0 0 60px rgba(255, 0, 127, 0.7); } 
    }
    
    h1 { 
      margin-bottom: 8px; font-size: 24px; font-weight: 900; text-align: center;
      background: linear-gradient(90deg, #00f2fe, #d946ef, #ff007f); 
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.4); 
    }
    .desc { margin-bottom: 20px; color: #e9d5ff; font-size: 11.5px; line-height: 1.6; text-align: center; }
    
    .secure-input { 
      width: 100%; margin-bottom: 12px; padding: 14px 18px; outline: none; 
      border: 1px solid rgba(0, 242, 254, 0.4); border-radius: 22px; color: #fff; 
      background: rgba(22, 8, 45, 0.95); font-size: 13.5px; text-align: center; 
      box-shadow: inset 0 0 12px rgba(0, 242, 254, 0.15); transition: .3s; user-select: text; 
    }
    .secure-input:focus { border-color: #ff007f; box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(255, 0, 127, 0.2); }
    
    .btn { 
      display: flex; align-items: center; justify-content: center; width: 100%; gap: 8px; margin: 8px 0; padding: 14px; 
      border: 0; border-radius: 25px; color: #fff; background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f); 
      background-size: 200% 200%; box-shadow: 0 5px 25px rgba(0, 242, 254, 0.4); 
      cursor: pointer; font-size: 13.5px; font-weight: bold; text-decoration: none; transition: transform .2s ease; 
    }
    .btn:hover { transform: scale(1.03); box-shadow: 0 8px 30px rgba(255, 0, 127, 0.6); }

    .secret-vault-content { display: none; width: 100%; text-align: center; }
    .secret-vault-content.unlocked { display: block; }
    .lock-screen { display: flex; flex-direction: column; width: 100%; align-items: center; }
    .lock-screen.unlocked { display: none; }

    textarea.secret-textarea {
      width: 100%; height: 150px; padding: 12px; border-radius: 14px; border: 1px solid rgba(0,242,254,0.5);
      background: rgba(10,2,22,0.9); color: #fff; font-size: 13px; outline: none; resize: none; margin-bottom: 10px;
      user-select: text;
    }
  </style>
</head>

<body>
  <canvas id="matrixCanvas"></canvas>

  <main class="container">
    <!-- شاشة إدخال كلمة المرور (القفل السيادي) -->
    <div class="lock-screen" id="lockScreen">
      <div class="shield-box"><div class="shield-inner">🛡️</div></div>
      <h1>الحصن المشفر لافي منير</h1>
      <p class="desc">هذا الملف محمي بنظام تشفير محلي تام. أدخل مفتاح السر الخاص بك لفتح الخزنة واستعراض أو تعديل ما في القلب.</p>

      <input type="password" id="vaultKeyInput" class="secure-input" placeholder="🔑 أدخل مفتاح السر (Passkey)" autocomplete="off">
      <button class="btn" id="unlockVaultBtn" type="button">فتح الخزنة المشفرة 🔓</button>
    </div>

    <!-- محتوى الخزنة بعد فتح القفل -->
    <div class="secret-vault-content" id="secretVaultContent">
      <div class="shield-box" style="width: 75px; height: 75px; margin-bottom: 10px;"><div class="shield-inner" style="font-size: 28px;">💎</div></div>
      <h1 style="font-size: 20px;">الخزنة المشفرة مفتوحة</h1>
      <p class="desc" style="margin-bottom: 10px;">أنت وحدك من تملك مفتاح فك التشفير. اكتب أسرارك أو نصوصك الخاصة هنا، وستبقى مؤمنة:</p>

      <textarea id="secretNotes" class="secret-textarea" placeholder="اكتب ما في قلبك هنا... النصوص تشفر محلياً ولن يراها أحد سواك."></textarea>
      <button class="btn" id="saveVaultBtn" type="button">💾 حفظ وتشفير البيانات محلياً</button>
      <button class="btn" id="lockVaultBtn" type="button" style="background: linear-gradient(135deg, #ff0844, #990022); margin-top: 10px;">🔒 إغلاق الخزنة وقفلها</button>
    </div>
  </main>

  <script>
    'use strict';

    // [المطر الرقمي الخلفي]
    (function initMatrix() {
      const canvas = document.getElementById('matrixCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
      const fontSize = 14; let cols = Math.floor(canvas.width / fontSize); let drops = Array(cols).fill(1);
      function draw() {
        ctx.fillStyle = 'rgba(7, 1, 20, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00f2fe'; ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
          ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // [خوارزمية التشفير المحلي]
    function simpleEncrypt(text, key) {
      if (!text) return '';
      let result = '';
      for (let i = 0; i < text.length; i++) {
        const charCode = text.charCodeAt(i) ^ key.charCodeAt(i % key.length);
        result += String.fromCharCode(charCode);
      }
      return btoa(encodeURIComponent(result));
    }

    function simpleDecrypt(encoded, key) {
      if (!encoded) return '';
      try {
        const text = decodeURIComponent(atob(encoded));
        let result = '';
        for (let i = 0; i < text.length; i++) {
          const charCode = text.charCodeAt(i) ^ key.charCodeAt(i % key.length);
          result += String.fromCharCode(charCode);
        }
        return result;
      } catch(e) {
        return null;
      }
    }

    const lockScreen = document.getElementById('lockScreen');
    const secretVaultContent = document.getElementById('secretVaultContent');
    const vaultKeyInput = document.getElementById('vaultKeyInput');
    const unlockVaultBtn = document.getElementById('unlockVaultBtn');
    const secretNotes = document.getElementById('secretNotes');
    const saveVaultBtn = document.getElementById('saveVaultBtn');
    const lockVaultBtn = document.getElementById('lockVaultBtn');

    let currentKey = '';

    unlockVaultBtn.addEventListener('click', () => {
      const key = vaultKeyInput.value.trim();
      if (!key) { alert('يرجى إدخال مفتاح السر أولاً.'); return; }
      currentKey = key;
      
      const savedEncrypted = localStorage.getItem('lafi_sovereign_vault');
      if (savedEncrypted) {
        const decrypted = simpleDecrypt(savedEncrypted, currentKey);
        if (decrypted !== null) {
          secretNotes.value = decrypted;
        } else {
          alert('مفتاح السر غير صحيح! تعذر فك تشفير البيانات.');
          return;
        }
      } else {
        secretNotes.value = '';
      }

      lockScreen.classList.add('unlocked');
      secretVaultContent.classList.add('unlocked');
      vaultKeyInput.value = '';
    });

    saveVaultBtn.addEventListener('click', () => {
      if (!currentKey) return;
      const text = secretNotes.value;
      const encrypted = simpleEncrypt(text, currentKey);
      localStorage.setItem('lafi_sovereign_vault', encrypted);
      alert('🔒 تم تشفير البيانات وحفظها بأمان تام في متصفحك.');
    });

    lockVaultBtn.addEventListener('click', () => {
      currentKey = '';
      secretNotes.value = '';
      secretVaultContent.classList.remove('unlocked');
      lockScreen.classList.remove('unlocked');
      alert('🛡️ تم إغلاق الخزنة وقفلها بنجاح.');
    });
  </script>
</body>
</html>
