<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إبليس | IBLIS SOVEREIGN CORE ⚡</title>

  <meta name="theme-color" content="#030008">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- مكتبة PeerJS للاتصال المباشر -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Tahoma, monospace; }
    body {
      min-height: 100dvh; overflow: hidden; color: #00ff66;
      background: linear-gradient(135deg, #030008, #0a021a, #15002b, #030008);
      background-size: 300% 300%; animation: iblisAurora 12s ease infinite;
    }
    @keyframes iblisAurora {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .container {
      position: relative; z-index: 3; display: flex; flex-direction: column;
      width: 100%; max-width: 480px; height: 100dvh; margin: auto;
      overflow: hidden; background: rgba(8, 2, 18, 0.95);
      border-left: 2px solid #ff0055; border-right: 2px solid #00f2fe;
      backdrop-filter: blur(25px);
    }

    .screen { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
    .screen.active { display: flex; }

    .gateway-screen {
      align-items: center; justify-content: center;
      padding: 25px; overflow-y: auto; text-align: center;
    }

    .avatar-box {
      width: 110px; height: 110px; margin: 0 auto 15px; padding: 3px;
      border-radius: 50%; background: linear-gradient(135deg, #ff0055, #7928ca, #00f2fe);
      box-shadow: 0 0 50px rgba(255, 0, 85, 0.6); animation: avatarGlow 3s infinite alternate;
    }
    .avatar-inner {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; border-radius: 50%; background: #030008;
      font-size: 45px; text-shadow: 0 0 20px #ff0055;
    }
    @keyframes avatarGlow {
      from { transform: scale(1); box-shadow: 0 0 30px rgba(255,0,85,0.5); }
      to { transform: scale(1.05); box-shadow: 0 0 60px rgba(0,242,254,0.8); }
    }

    h1 {
      margin-bottom: 8px; font-size: 24px; font-weight: 900;
      background: linear-gradient(90deg, #ff0055, #00f2fe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
    }
    .gateway-desc { margin-bottom: 15px; color: #a5f3fc; font-size: 11px; line-height: 1.6; }

    .room-input {
      width: 100%; margin-bottom: 10px; padding: 12px 16px;
      outline: none; border: 1px solid #ff0055; border-radius: 18px;
      color: #fff; background: rgba(18, 4, 32, 0.9); font-size: 13px; text-align: center;
      box-shadow: inset 0 0 10px rgba(255,0,85,0.2); transition: .3s;
    }
    .room-input:focus { border-color: #00f2fe; box-shadow: 0 0 20px rgba(0,242,254,0.5); }

    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; gap: 8px; margin: 6px 0; padding: 13px;
      border: 0; border-radius: 20px; color: #fff;
      background: linear-gradient(135deg, #ff0055, #7928ca, #00f2fe);
      cursor: pointer; font-size: 13px; font-weight: bold; transition: transform .2s;
    }
    .btn:hover { transform: scale(1.02); }

    .live-room-content { position: relative; display: flex; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
    .room-top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid rgba(255,0,85,0.3);
      background: rgba(10, 2, 18, 0.95);
    }

    .videos-container { position: relative; display: flex; flex: 1; flex-direction: column; overflow-y: auto; gap: 6px; padding: 6px; }
    .remote-peer-video { width: 100%; min-height: 180px; background: #000; object-fit: cover; border-bottom: 1px solid #ff0055; border-radius: 8px; }
    #localVideo {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      width: 85px; height: 115px; border: 2px solid #ff0055;
      border-radius: 12px; background: #000; object-fit: cover;
    }

    .terminal-logs {
      height: 90px; background: rgba(0,0,0,0.9); border-top: 1px solid #333;
      padding: 8px; font-size: 10px; color: #00f2fe; overflow-y: auto;
    }

    .room-bottom-panel { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-top: 1px solid rgba(0,242,254,0.3); background: rgba(5,1,10,0.95); }
    .room-chat-overlay { display: flex; flex-direction: column; max-height: 70px; gap: 4px; overflow-y: auto; }

    .chat-bubble {
      width: fit-content; max-width: 85%; padding: 4px 8px;
      border-right: 3px solid #ff0055; border-radius: 6px;
      color: #fff; background: rgba(20, 5, 35, 0.9); font-size: 10.5px;
    }

    .room-input-box { display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid #00f2fe; border-radius: 14px; background: rgba(10,2,18,0.9); }
    .room-input-box input { flex: 1; padding: 4px; outline: none; border: none; color: #fff; background: transparent; font-size: 11px; }
    .room-input-box button { padding: 5px 8px; border: none; border-radius: 10px; color: #fff; background: #ff0055; cursor: pointer; font-size: 10px; font-weight: bold; }

    .call-controls { display: flex; justify-content: center; gap: 8px; }
    .control-icon-btn {
      width: 36px; height: 36px; border: 1px solid #00f2fe; border-radius: 50%;
      color: #fff; background: #0a0212; cursor: pointer; font-size: 13px; transition: 0.2s;
    }
    .control-icon-btn.active { border-color: #ff0055; background: #ff0055; }
  </style>
</head>

<body>
  <main class="container" id="mainContainer">
    <!-- بوابة الدخول -->
    <section id="screen-gateway" class="screen active gateway-screen">
      <div class="avatar-box"><div class="avatar-inner">🔥</div></div>
      <h1>مشروع إبليس</h1>
      <p class="gateway-desc">IBLIS SOVEREIGN CORE • المنصة السيادية للربط الفوري ⚡</p>

      <input type="text" id="roomInput" class="room-input" value="lafi-room-1" autocomplete="off" placeholder="اسم الغرفة">
      <input type="text" id="nomadNameInput" class="room-input" value="مشغل-إبليس" autocomplete="off" placeholder="اسم المشغل">

      <button class="btn" id="enterRoomBtn" type="button">دخول الغرفة الحية ⚡</button>
    </section>

    <!-- واجهة التشغيل الحية -->
    <section id="screen-app" class="screen">
      <div class="live-room-content">
        <header class="room-top-bar">
          <span id="roomTitleDisplay" style="font-size:11px; color:#00f2fe;">القطاع: جاري الاتصال... ⚡</span>
          <button onclick="window.exitIblisNode()" style="border:0; color:#ff0055; background:transparent; cursor:pointer; font-weight:bold;">مغادرة ❌</button>
        </header>

        <div class="videos-container" id="videosContainer">
          <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <!-- قسم السينما المشتركة -->
        <div id="cosmicCinemaContainer" style="display:none; width:100%; height:140px; background:#000; border-bottom:1px solid #00f2fe;">
          <div id="mediaStage" style="width:100%; height:100%;"></div>
        </div>

        <div class="terminal-logs" id="terminalLogs">
          <div>[SYSTEM]: تم تهيئة محرك إبليس بنجاح...</div>
        </div>

        <div class="room-bottom-panel">
          <!-- شريط التحكم بالسينما -->
          <div class="room-input-box">
            <input type="text" id="cinemaUrlInput" placeholder="رابط يوتيوب أو فيديو مباشر..." autocomplete="off">
            <button id="broadcastCinemaBtn" type="button">بث سينما 🎬</button>
          </div>

          <div class="room-chat-overlay" id="roomChatOverlay"></div>

          <div class="room-input-box">
            <input type="text" id="roomMsgInput" placeholder="أدخل رسالة أو أمر..." autocomplete="off">
            <button id="sendMsgBtn" type="button">إرسال ⚡</button>
          </div>

          <div class="call-controls">
            <button class="control-icon-btn" id="micBtn" type="button" title="الميكروفون">🎙️</button>
            <button class="control-icon-btn" id="camBtn" type="button" title="الكاميرا">📸</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onChildAdded, onValue, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://lafi-munir-global-default-rtdb.firebaseio.com/" };
    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch(e) {
      console.warn("Firebase Init Error");
    }

    function logIblis(msg, type = 'info') {
      const term = document.getElementById('terminalLogs');
      if (!term) return;
      const entry = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      entry.style.color = type === 'error' ? '#ff0055' : type === 'success' ? '#00ff66' : '#00f2fe';
      entry.textContent = `[${time}] ${msg}`;
      term.appendChild(entry);
      term.scrollTop = term.scrollHeight;
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    window.appState = { roomName: '', peer: null, stream: null, calls: {}, myPeerRef: null };

    function listenToCinema(room) {
      if (!db) return;
      onValue(ref(db, `iblis_rooms/${room}/cinema`), (snap) => {
        const data = snap.val();
        const stage = document.getElementById('mediaStage');
        const container = document.getElementById('cosmicCinemaContainer');
        if (!stage || !container) return;
        if (!data) { container.style.display = 'none'; stage.innerHTML = ''; return; }
        container.style.display = 'block';
        stage.innerHTML = '';
        if (data.type === 'youtube') {
          const iframe = document.createElement('iframe');
          iframe.src = data.src;
          iframe.style.cssText = 'width:100%;height:100%;border:none;';
          iframe.allowFullscreen = true;
          stage.appendChild(iframe);
        } else {
          const v = document.createElement('video');
          v.src = data.src; v.controls = true; v.autoplay = true;
          v.style.cssText = 'width:100%;height:100%;';
          stage.appendChild(v);
        }
      });
    }

    async function enterIblisNode() {
      const room = document.getElementById('roomInput').value.trim() || 'lafi-room-1';
      const username = document.getElementById('nomadNameInput').value.trim() || 'مشغل';
      window.appState.roomName = room;

      showScreen('screen-app');
      listenToCinema(room);
      logIblis(`جاري ربط القطاع: ${room}...`);

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }).catch(() => null);
        window.appState.stream = stream;
        if (stream) document.getElementById('localVideo').srcObject = stream;

        const peer = new Peer({
          config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }
        });
        window.appState.peer = peer;

        peer.on('open', async (id) => {
          logIblis(`تم فتح معرّف النظام: ${id}`, 'success');
          document.getElementById('roomTitleDisplay').textContent = `القطاع: ${room} (${username} 🟢)`;

          if (db) {
            const peerRef = push(ref(db, `iblis_rooms/${room}/peers`));
            await set(peerRef, { peerId: id, name: username, createdAt: Date.now() });
            window.appState.myPeerRef = peerRef;
            await onDisconnect(peerRef).remove();

            onChildAdded(ref(db, `iblis_rooms/${room}/peers`), (snap) => {
              const data = snap.val();
              if (data && data.peerId !== id && !window.appState.calls[data.peerId]) {
                logIblis(`استدعاء عقدة مجاورة: ${data.peerId}`);
                const call = peer.call(data.peerId, window.appState.stream);
                handleCall(call, data.peerId);
              }
            });
          }
        });

        peer.on('call', (call) => {
          call.answer(window.appState.stream);
          handleCall(call, call.peer);
        });

      } catch (err) {
        logIblis(`خطأ في تشغيل العقدة: ${err.message}`, 'error');
      }
    }

    function handleCall(call, peerId) {
      window.appState.calls[peerId] = call;
      call.on('stream', (remoteStream) => {
        let vid = document.getElementById(`remote-${peerId}`);
        if (!vid) {
          vid = document.createElement('video');
          vid.id = `remote-${peerId}`;
          vid.autoplay = true; vid.playsInline = true;
          vid.className = 'remote-peer-video';
          document.getElementById('videosContainer').appendChild(vid);
        }
        vid.srcObject = remoteStream;
        logIblis(`تم استقبال بث من العقدة: ${peerId}`, 'success');
      });
      call.on('close', () => {
        delete window.appState.calls[peerId];
        document.getElementById(`remote-${peerId}`)?.remove();
      });
    }

    window.exitIblisNode = async function() {
      if (window.appState.myPeerRef) {
        await remove(window.appState.myPeerRef).catch(() => {});
      }
      if (window.appState.peer) window.appState.peer.destroy();
      if (window.appState.stream) window.appState.stream.getTracks().forEach(t => t.stop());
      showScreen('screen-gateway');
      logIblis("تم قطع الاتصال.");
      location.reload();
    };

    // التحكم بالصوت والكاميرا
    document.getElementById('micBtn').addEventListener('click', async () => {
      const stream = window.appState.stream;
      if (!stream) return;
      const audioTrack = stream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        document.getElementById('micBtn').classList.toggle('active', !audioTrack.enabled);
        logIblis(audioTrack.enabled ? '🎙️ الميكروفون مفتوح' : '🔇 الميكروفون مكتوم');
      }
    });

    document.getElementById('camBtn').addEventListener('click', async () => {
      const stream = window.appState.stream;
      if (!stream) return;
      const videoTrack = stream.getVideoTracks()[0];
      if (videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        document.getElementById('camBtn').classList.toggle('active', !videoTrack.enabled);
        logIblis(videoTrack.enabled ? '📸 الكاميرا مفتوحة' : '📷 الكاميرا مغلقة');
      }
    });

    document.getElementById('enterRoomBtn').addEventListener('click', enterIblisNode);

    // دردشة النص
    document.getElementById('sendMsgBtn').addEventListener('click', () => {
      const input = document.getElementById('roomMsgInput');
      const txt = input.value.trim();
      if (!txt) return;
      const chat = document.getElementById('roomChatOverlay');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.textContent = `[أنت]: ${txt}`;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      input.value = '';
    });

    // السينما المشتركة
    document.getElementById('broadcastCinemaBtn')?.addEventListener('click', async () => {
      const url = document.getElementById('cinemaUrlInput').value.trim();
      if (!url || !db) return;
      let type = null, src = null;
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.toLowerCase();
        if (host.includes('youtube') || host === 'youtu.be') {
          const m = url.match(/[?&]v=([^#&?]+)/) || url.match(/youtu\.be\/([^#&?]+)/);
          if (m) { type = 'youtube'; src = `https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1`; }
        } else if (/\.(mp4|webm|ogg)$/i.test(parsed.pathname)) {
          type = 'direct'; src = parsed.href;
        }
      } catch(e) { logIblis('رابط غير صالح', 'error'); return; }

      if (!type) { logIblis('رابط غير مدعوم', 'error'); return; }
      const room = window.appState.roomName || 'lafi-room-1';
      await set(ref(db, `iblis_rooms/${room}/cinema`), { type, src, timestamp: Date.now() });
      logIblis('تم بث الوسائط للجميع 🎬', 'success');
    });
  </script>
</body>
</html>
