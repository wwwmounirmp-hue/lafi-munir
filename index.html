<script>
"use strict";
const $=id=>document.getElementById(id);

let peer=null,myPeerId="",myNickName="Sovereign_"+Math.floor(Math.random()*8999+1000);
let meshConnections={},mediaCalls={},localStream=null,screenStream=null;
let rooms={"public":{name:"الغرفة_العامة",pass:"",messages:[]}};
let activeRoom="public";
let myKeyPair=null,sharedKeys={};
let mediaRecorder=null,recChunks=[];
let db=null,qualityIntervals={};

function showNotif(msg,dur){
  dur=dur||3000;
  const n=$("notif");
  n.textContent=msg;
  n.classList.remove("hidden");
  setTimeout(()=>n.classList.add("hidden"),dur);
}

/* ═══ Web Crypto E2EE ═══ */
async function generateECDHKeyPair(){
  myKeyPair=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey","deriveBits"]);
}
async function exportPublicKey(){
  if(!myKeyPair)await generateECDHKeyPair();
  const exported=await crypto.subtle.exportKey("spki",myKeyPair.publicKey);
  return btoa(String.fromCharCode.apply(null,new Uint8Array(exported)));
}
async function deriveSharedKey(pubKeyB64,peerId){
  try{
    const bin=Uint8Array.from(atob(pubKeyB64),c=>c.charCodeAt(0));
    const pubKey=await crypto.subtle.importKey("spki",bin,{name:"ECDH",namedCurve:"P-256"},true,[]);
    const shared=await crypto.subtle.deriveKey({name:"ECDH",public:pubKey},myKeyPair.privateKey,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    sharedKeys[peerId]=shared;
  }catch(e){console.error("derive err",e);}
}
async function encryptData(obj,key){
  const enc=new TextEncoder(),data=enc.encode(JSON.stringify(obj));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  if(!key){
    const raw=enc.encode("SOVEREIGN_LAFI_32BYTE_E2EE!!");
    key=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
  }
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data);
  return {iv:Array.from(iv),cipher:btoa(String.fromCharCode.apply(null,new Uint8Array(ct)))};
}
async function decryptData(encObj,key){
  try{
    const enc=new TextEncoder();
    if(!key){
      const raw=enc.encode("SOVEREIGN_LAFI_32BYTE_E2EE!!");
      key=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
    }
    const iv=new Uint8Array(encObj.iv);
    const cipherBin=Uint8Array.from(atob(encObj.cipher),c=>c.charCodeAt(0));
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,cipherBin);
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){return null;}
}

/* ═══ IndexedDB ═══ */
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("omega_v101",1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains("chatLog"))d.createObjectStore("chatLog",{keyPath:"id",autoIncrement:true});
    };
    r.onsuccess=e=>{db=e.target.result;res();};
    r.onerror=()=>rej();
  });
}
function saveMsg(msg){
  if(!db)return;
  try{
    const tx=db.transaction("chatLog","readwrite");
    tx.objectStore("chatLog").put(msg);
  }catch(e){}
}
async function loadChatLog(){
  if(!db)return [];
  return new Promise(res=>{
    const tx=db.transaction("chatLog","readonly");
    const r=tx.objectStore("chatLog").getAll();
    r.onsuccess=()=>res(r.result||[]);
    r.onerror=()=>res([]);
  });
}

/* ═══ P2P Core ═══ */
async function initP2P(){
  await generateECDHKeyPair();
  $("nickName").value=myNickName;
  peer=new Peer({debug:1,config:{iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"},
    {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
    {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"}
  ]}});
  
  peer.on("open",id=>{
    myPeerId=id;
    $("myPeerIdDisplay").textContent=id.slice(0,10)+"...";
    $("p2pDot").className="status-indicator bg-cyber-green animate-pulse";
    showNotif("🌐 متصل بالشبكة المشفرة!");
    renderRoomList();
    loadAndRenderHistory();
  });
  
  peer.on("connection",conn=>setupConnection(conn));
  peer.on("call",call=>handleIncomingCall(call));
  peer.on("error",err=>showNotif("⚠️ "+err.type));
}

function setupConnection(conn){
  conn.on("open",async()=>{
    meshConnections[conn.peer]=conn;
    updateMeshUI();
    const pubKey=await exportPublicKey();
    conn.send({type:"HANDSHAKE",sender:myPeerId,nickname:myNickName,pubKey,knownPeers:Object.keys(meshConnections)});
  });
  conn.on("data",async data=>{
    if(data.type==="HANDSHAKE"){
      await deriveSharedKey(data.pubKey,data.sender);
      if(Array.isArray(data.knownPeers)){
        data.knownPeers.forEach(pId=>{if(pId!==myPeerId&&!meshConnections[pId])connectToPeerId(pId);});
      }
      showNotif("🤝 اكتملت المصافحة مع: "+data.nickname);
      startQualityMonitor(conn.peer);
      return;
    }
    if(data.encryptedPayload){
      const key=sharedKeys[conn.peer];
      const dec=await decryptData(data.encryptedPayload,key);
      if(dec)handleMeshPacket(dec,conn.peer);
    }
  });
  conn.on("close",()=>{
    delete meshConnections[conn.peer];
    delete sharedKeys[conn.peer];
    if(qualityIntervals[conn.peer]){clearInterval(qualityIntervals[conn.peer]);delete qualityIntervals[conn.peer];}
    updateMeshUI();
    updateQualityUI();
  });
}

function connectToPeerManual(){
  const t=$("peerTargetInput").value.trim();
  if(t){connectToPeerId(t);$("peerTargetInput").value="";}
}
function connectToPeerId(targetId){
  if(targetId===myPeerId||meshConnections[targetId])return;
  const conn=peer.connect(targetId,{reliable:true});
  setupConnection(conn);
}

async function broadcastMeshPacket(pkt){
  for(const pId in meshConnections){
    const conn=meshConnections[pId];
    if(conn&&conn.open){
      const enc=await encryptData(pkt,sharedKeys[pId]);
      conn.send({encryptedPayload:enc});
    }
  }
}

function handleMeshPacket(pkt,sender){
  if(pkt.kind==="CHAT_MSG"){
    if(!rooms[pkt.roomId])rooms[pkt.roomId]={name:pkt.roomId,messages:[]};
    rooms[pkt.roomId].messages.push(pkt);
    if(activeRoom===pkt.roomId)appendMsgUI(pkt,false);
    saveMsg(pkt);
  } else if(pkt.kind==="FILE_SHARE"){
    if(!rooms[pkt.roomId])rooms[pkt.roomId]={name:pkt.roomId,messages:[]};
    rooms[pkt.roomId].messages.push(pkt);
    if(activeRoom===pkt.roomId)appendFileUI(pkt,false);
    saveMsg(pkt);
  } else if(pkt.kind==="ROOM_CREATE"){
    if(!rooms[pkt.roomKey]){rooms[pkt.roomKey]={name:pkt.roomName,pass:pkt.roomPass,messages:[]};renderRoomList();}
  }
}

function updateMeshUI(){
  const c=Object.keys(meshConnections).length;
  $("meshCount").textContent=c;
  $("roomPeerCount").textContent="العقد: "+c;
}

/* ═══ Quality Monitor ═══ */
function startQualityMonitor(peerId){
  if(qualityIntervals[peerId])clearInterval(qualityIntervals[peerId]);
  qualityIntervals[peerId]=setInterval(()=>{
    const call=mediaCalls[peerId];
    if(!call||!call.peerConnection){updateQualityUI();return;}
    call.peerConnection.getStats().then(stats=>{
      let rtt=0,lost=0;
      stats.forEach(r=>{
        if(r.type==="candidate-pair"&&r.state==="succeeded")rtt=(r.currentRoundTripTime||0)*1000;
        if(r.type==="inbound-rtp"&&r.kind==="video")lost=r.packetsLost||0;
      });
      updateQualityUI(peerId,rtt,lost);
    }).catch(()=>{});
  },3000);
}
function updateQualityUI(peerId,rtt,lost){
  const box=$("qualityList");
  const ids=Object.keys(qualityIntervals);
  if(ids.length===0){box.innerHTML="لا اتصالات";return;}
  box.innerHTML=ids.map(id=>{
    const r=rtt||0,l=lost||0;
    const icon=r>300||l>30?"🔴":r>150||l>10?"🟡":"🟢";
    return `<div>${icon} ${id.slice(0,6)}... | RTT: ${Math.round(r)}ms | Lost: ${l}</div>`;
  }).join("");
}

/* ═══ UI Rendering ═══ */
function copyMyId(){
  if(myPeerId){navigator.clipboard.writeText(myPeerId);showNotif("📋 تم نسخ معرفك");}
}
function renderRoomList(){
  const box=$("roomList");
  box.innerHTML="";
  for(const k in rooms){
    const r=rooms[k];
    const div=document.createElement("div");
    div.className=`p-2 rounded-lg cursor-pointer flex justify-between items-center ${activeRoom===k?"bg-cyber-cyan/15 border border-cyber-cyan text-cyber-cyan font-bold":"bg-cyber-bg border border-cyber-border hover:border-cyber-cyan/50 text-gray-300"}`;
    div.onclick=()=>selectRoom(k);
    div.innerHTML=`<span class="truncate"># ${r.name}</span>${r.pass?'<i class="fa-solid fa-key text-[10px] text-cyber-gold"></i>':''}`;
    box.appendChild(div);
  }
}
function selectRoom(k){
  activeRoom=k;
  renderRoomList();
  $("currentRoomTitle").textContent="# "+rooms[k].name;
  $("messagesContainer").innerHTML='<div class="msg-sys">🛡️ قناة مشفرة عبر Mesh</div>';
  rooms[k].messages.forEach(m=>{
    if(m.kind==="CHAT_MSG")appendMsgUI(m,m.senderId===myPeerId);
    else if(m.kind==="FILE_SHARE")appendFileUI(m,m.senderId===myPeerId);
  });
}

async function loadAndRenderHistory(){
  const history=await loadChatLog();
  history.slice(-20).forEach(m=>{
    if(!rooms[m.roomId])rooms[m.roomId]={name:m.roomId,messages:[]};
    rooms[m.roomId].messages.push(m);
  });
  selectRoom(activeRoom);
}

function promptCreateRoom(){$("roomModal").classList.remove("hidden");}
function closeRoomModal(){$("roomModal").classList.add("hidden");}
function confirmCreateRoom(){
  const n=$("modalRoomName").value.trim();
  const p=$("modalRoomPass").value.trim();
  if(!n)return;
  const k="room_"+Date.now();
  rooms[k]={name:n,pass:p,messages:[]};
  broadcastMeshPacket({kind:"ROOM_CREATE",roomKey:k,roomName:n,roomPass:p});
  closeRoomModal();
  selectRoom(k);
  showNotif("✅ غرفة: "+n);
}

/* ═══ Chat ═══ */
function sendChatMessage(){
  const t=$("chatInput").value.trim();
  if(!t)return;
  const pkt={
    kind:"CHAT_MSG",roomId:activeRoom,senderId:myPeerId,senderNick:myNickName,
    text:t,time:new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})
  };
  rooms[activeRoom].messages.push(pkt);
  appendMsgUI(pkt,true);
  broadcastMeshPacket(pkt);
  saveMsg(pkt);
  $("chatInput").value="";
}
function appendMsgUI(m,isMe){
  const c=$("messagesContainer");
  const d=document.createElement("div");
  d.className=`msg-bubble p-3 text-xs md:text-sm ${isMe?"msg-me":"msg-peer"}`;
  d.innerHTML=`<div class="flex justify-between items-center gap-4 border-b border-white/10 pb-1 mb-1 text-[10px] text-gray-400">
    <span class="font-bold ${isMe?"text-cyber-magenta":"text-cyber-cyan"}">${esc(m.senderNick)}</span>
    <span>${m.time}</span>
  </div>
  <div class="text-white whitespace-pre-wrap">${esc(m.text)}</div>`;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}

/* ═══ File ═══ */
function handleFileSelect(evt){
  const f=evt.target.files[0];
  if(!f)return;
  if(f.size>25*1024*1024){showNotif("⚠️ الحد 25MB");return;}
  const r=new FileReader();
  r.onload=e=>{
    const pkt={kind:"FILE_SHARE",roomId:activeRoom,senderId:myPeerId,senderNick:myNickName,
      fileName:f.name,fileType:f.type,fileData:e.target.result,
      time:new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})};
    rooms[activeRoom].messages.push(pkt);
    appendFileUI(pkt,true);
    broadcastMeshPacket(pkt);
    saveMsg(pkt);
  };
  r.readAsDataURL(f);
}
function appendFileUI(f,isMe){
  const c=$("messagesContainer");
  const d=document.createElement("div");
  d.className=`msg-bubble p-3 text-xs md:text-sm ${isMe?"msg-me":"msg-peer"}`;
  let prev="";
  if(f.fileType.startsWith("image/"))prev=`<img src="${f.fileData}" class="max-h-48 rounded border border-cyber-border my-2">`;
  d.innerHTML=`<div class="flex justify-between items-center gap-4 border-b border-white/10 pb-1 mb-1 text-[10px] text-gray-400">
    <span class="font-bold ${isMe?"text-cyber-magenta":"text-cyber-cyan"}">${esc(f.senderNick)}</span>
    <span>${f.time}</span>
  </div>${prev}
  <div class="flex items-center justify-between gap-2 bg-black/40 p-2 rounded border border-cyber-border">
    <span class="truncate font-mono text-[11px]">${esc(f.fileName)}</span>
    <a href="${f.fileData}" download="${f.fileName}" class="bg-cyber-cyan text-black font-bold px-2 py-1 rounded text-[10px]">💾 تحميل</a>
  </div>`;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}

/* ═══ Calls ═══ */
async function startVoiceCall(){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    initiateMediaCall();
  }catch(e){showNotif("❌ ميكروفون مرفوض");}
}
async function startVideoCall(){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:{width:1280,height:720}});
    $("localVideo").srcObject=localStream;
    $("videoStage").classList.remove("hidden");
    initiateMediaCall();
  }catch(e){showNotif("❌ كاميرا مرفوضة");}
}
async function shareScreenCall(){
  try{
    screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    localStream=screenStream;
    $("localVideo").srcObject=screenStream;
    $("videoStage").classList.remove("hidden");
    initiateMediaCall();
  }catch(e){showNotif("❌ تم إلغاء المشاركة");}
}
function initiateMediaCall(){
  $("endCallBtn").classList.remove("hidden");
  for(const pId in meshConnections){
    const call=peer.call(pId,localStream);
    handleCallStream(call);
  }
  showNotif("📞 اتصال بكافة العقود...");
}
function handleIncomingCall(call){
  showNotif("📞 مكالمة من: "+call.peer.slice(0,6));
  if(confirm("هل تقبل المكالمة؟")){
    navigator.mediaDevices.getUserMedia({audio:true,video:true}).then(stream=>{
      localStream=stream;
      $("localVideo").srcObject=localStream;
      $("videoStage").classList.remove("hidden");
      $("endCallBtn").classList.remove("hidden");
      call.answer(localStream);
      handleCallStream(call);
    }).catch(()=>{
      call.answer();
      handleCallStream(call);
    });
  } else {
    call.close();
    showNotif("📴 تم رفض المكالمة");
  }
}
function handleCallStream(call){
  mediaCalls[call.peer]=call;
  call.on("stream",rs=>{
    $("videoStage").classList.remove("hidden");
    let v=document.getElementById("remoteVid_"+call.peer);
    if(!v){
      const w=document.createElement("div");
      w.className="relative bg-black rounded-lg overflow-hidden border border-cyber-cyan";
      w.id="remoteWrapper_"+call.peer;
      w.innerHTML=`<video id="remoteVid_${call.peer}" autoplay playsinline class="w-full h-full object-cover"></video>
        <span class="absolute bottom-1 right-1 bg-black/70 text-cyber-green px-1.5 py-0.5 rounded text-[9px]">${call.peer.slice(0,6)}</span>
        <button class="absolute top-1 left-1 bg-cyber-gold text-black px-1.5 py-0.5 rounded text-[9px] font-bold" onclick="popOutVideo('${call.peer}')" title="فيديو عائم">🔲 PiP</button>`;
      $("remoteVideoContainer").appendChild(w);
      v=document.getElementById("remoteVid_"+call.peer);
    }
    v.srcObject=rs;
  });
  call.on("close",()=>{
    delete mediaCalls[call.peer];
    const w=document.getElementById("remoteWrapper_"+call.peer);
    if(w)w.remove();
  });
}
function endMediaCall(){
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  for(const p in mediaCalls)mediaCalls[p].close();
  mediaCalls={};
  $("videoStage").classList.add("hidden");
  $("endCallBtn").classList.add("hidden");
  showNotif("📴 انتهت المكالمات");
}

/* ═══ PiP Floating Video ═══ */
let pipCounter=0;
function popOutVideo(peerId){
  const src=document.getElementById("remoteVid_"+peerId);
  if(!src)return;
  pipCounter++;
  const pip=document.createElement("div");
  pip.className="pip-video";
  pip.id="pip_"+pipCounter;
  const offset=pipCounter*30;
  pip.style.top=(80+offset)+"px";
  pip.style.right=(20+offset)+"px";
  pip.innerHTML=`<button class="pip-close" onclick="this.parentElement.remove()">✖</button><video autoplay playsinline></video>`;
  document.body.appendChild(pip);
  const newVid=pip.querySelector("video");
  newVid.srcObject=src.srcObject;
  // drag
  let drag=false,offX=0,offY=0;
  pip.addEventListener("pointerdown",e=>{
    if(e.target.classList.contains("pip-close"))return;
    drag=true;
    const r=pip.getBoundingClientRect();
    offX=e.clientX-r.left;
    offY=e.clientY-r.top;
    pip.setPointerCapture(e.pointerId);
  });
  pip.addEventListener("pointermove",e=>{
    if(!drag)return;
    pip.style.left=(e.clientX-offX)+"px";
    pip.style.top=(e.clientY-offY)+"px";
    pip.style.right="auto";
  });
  pip.addEventListener("pointerup",()=>{drag=false;});
  showNotif("🔲 فيديو عائم مُفعّل");
}

/* ═══ Recording ═══ */
function toggleRecord(){
  if(!localStream){showNotif("⚠️ لا يوجد بث");return;}
  if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return;}
  try{
    recChunks=[];
    const mime=["video/webm;codecs=vp9,opus","video/webm"].find(t=>MediaRecorder.isTypeSupported(t));
    mediaRecorder=new MediaRecorder(localStream,mime?{mimeType:mime}:undefined);
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:"video/webm"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;a.download="omega_rec_"+Date.now()+".webm";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      $("recBtn").classList.remove("bg-cyber-red");
      showNotif("💾 تم حفظ التسجيل");
    };
    mediaRecorder.start();
    $("recBtn").classList.add("bg-cyber-red");
    showNotif("⏺️ بدأ التسجيل");
  }catch(e){showNotif("❌ فشل التسجيل");}
}

/* ═══ QR ═══ */
function showQR(){
  if(!myPeerId){showNotif("⚠️ انتظر");return;}
  $("qrModal").classList.remove("hidden");
  $("qrIdText").textContent=myPeerId;
  if(typeof QRCode!=="undefined"){
    QRCode.toCanvas($("qrCanvas"),myPeerId,{width:200,margin:1},err=>{if(err)console.error(err);});

function closeQR(){$("qrModal").classList.add("hidden");}

/* ═══ Utils ═══ */
function broadcastNameChange(){
  myNickName=$("nickName").value.trim()||"Sovereign_Node";
  showNotif("🏷️ تم تحديث الاسم");
}
function regenerateKeys(){
  generateECDHKeyPair().then(()=>showNotif("🔑 مفاتيح جديدة"));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ═══ Matrix ═══ */
function startMatrix(){
  const c=$("matrixCanvas"),x=c.getContext("2d");
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  resize();addEventListener("resize",resize);
  const chars="LAFI-MUNIR-E2EE-MESH-01";
  let drops=Array(Math.floor(c.width/16)).fill(1);
  setInterval(()=>{
    x.fillStyle="rgba(3,0,20,.08)";x.fillRect(0,0,c.width,c.height);
    x.fillStyle="#00f2fe";x.font="12px monospace";
    for(let i=0;i<drops.length;i++){
      x.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,drops[i]*16);
      if(drops[i]*16>c.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
  },50);
}

/* ═══ Boot ═══ */
window.addEventListener("load",async()=>{
  startMatrix();
  await openDB();
  await initP2P();
});
