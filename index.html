<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لافي منير | غرفة الاتصال والترجمة العالمية</title>

  <!-- مكتبة PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #0d0221, #1a0033, #240046, #3c096c);
      background-size: 300% 300%;
      animation: cosmicAurora 12s ease infinite;
    }

    @keyframes cosmicAurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #spaceCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .cinematic-moon {
      position: fixed;
      top: -40px;
      left: 50%;
      z-index: 2;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      transform: translateX(-50%);
      opacity: .9;
      pointer-events: none;
      background: radial-gradient(
        circle at 30% 30%,
        #fff 0%,
        #00f2fe 35%,
        #7928ca 70%,
        #ff007f 100%
      );
      box-shadow:
        0 0 80px rgba(0, 242, 254, .6),
        0 0 140px rgba(255, 0, 127, .4);
      transition: transform .3s ease;
    }

    .cinematic-moon.pulse {
      transform: translateX(-50%) scale(1.08);
    }

    .container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      margin: auto;
      overflow: hidden;
      background: rgba(18, 8, 38, .85);
      border-left: 1px solid rgba(0, 242, 254, .4);
      border-right: 1px solid rgba(0, 242, 254, .4);
      backdrop-filter: blur(25px);
      transition: box-shadow .5s ease;
    }

    .container.connected-aura {
      box-shadow:
        0 0 40px rgba(0, 242, 254, .5),
        inset 0 0 30px rgba(255, 0, 127, .2);
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .gateway-screen {
      align-items: center;
      justify-content: center;
      padding: 30px;
      overflow-y: auto;
      text-align: center;
    }

    .avatar-box {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f);
      box-shadow: 0 0 50px rgba(0, 242, 254, .7);
      animation: avatarGlow 3s infinite alternate;
    }

    .avatar-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0c0614;
      font-size: 45px;
    }

    @keyframes avatarGlow {
      from {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(0, 242, 254, .4);
      }
      to {
        transform: scale(1.06);
        box-shadow: 0 0 60px rgba(255, 0, 127, .7);
      }
    }

    h1 {
      margin-bottom: 8px;
      color: #00f2fe;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, #00f2fe, #a855f7, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gateway-desc {
      margin-bottom: 20px;
      color: #d8b4fe;
      font-size: 12px;
      line-height: 1.6;
    }

    .room-input {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px 16px;
      outline: none;
      border: 1px solid rgba(0, 242, 254, .4);
      border-radius: 20px;
      color: #fff;
      background: rgba(25, 10, 50, .9);
      font-size: 14px;
      text-align: center;
    }

    .room-input:focus {
      border-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, .4);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 8px;
      margin: 6px 0;
      padding: 14px;
      border: 0;
      border-radius: 25px;
      color: #fff;
      background: linear-gradient(135deg, #00f2fe, #7928ca);
      box-shadow: 0 5px 25px rgba(0, 242, 254, .4);
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      transition: transform .2s ease;
    }

    .btn:hover {
      transform: scale(1.02);
    }

    .system-footer {
      margin-top: 15px;
      color: rgba(255, 255, 255, .6);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-align: center;
    }

    .live-room-content {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .room-top-bar {
      z-index: 5;
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(0, 242, 254, .3);
      background: rgba(20, 10, 40, .9);
      backdrop-filter: blur(10px);
    }

    .videos-container {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 120px;
      overflow: hidden;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      background: #080112;
      cursor: pointer;
      object-fit: cover;
    }

    #remoteVideo.fullscreen-mode {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100vw;
      height: 100vh;
      background: #000;
      object-fit: contain;
    }

    #localVideo {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 90px;
      height: 130px;
      border: 2px solid #00f2fe;
      border-radius: 12px;
      background: #190028;
      box-shadow: 0 0 20px rgba(0, 242, 254, .5);
      object-fit: cover;
    }

    #stardustMemoryLayer {
      position: absolute;
      inset: 10px;
      z-index: 8;
      overflow: hidden;
      pointer-events: none;
    }

    .stardust-particle {
      position: absolute;
      padding: 4px 10px;
      border: 1px solid rgba(255, 0, 127, .5);
      border-radius: 12px;
      color: #fff;
      background: rgba(0, 242, 254, .8);
      box-shadow: 0 0 10px rgba(0, 242, 254, .6);
      animation: floatUp 6s linear forwards;
      font-size: 11px;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(80px) scale(.8);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-150px) scale(1.1);
      }
    }

    .room-bottom-panel {
      z-index: 20;
      display: flex;
      flex-shrink: 0;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid rgba(0, 242, 254, .3);
      background: rgba(12, 4, 25, .95);
      backdrop-filter: blur(15px);
    }

    .room-chat-overlay {
      display: flex;
      flex-direction: column;
      max-height: 80px;
      gap: 4px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .room-chat-overlay::-webkit-scrollbar {
      display: none;
    }

    .chat-bubble {
      width: fit-content;
      max-width: 85%;
      padding: 5px 10px;
      border-right: 3px solid #00f2fe;
      border-radius: 10px;
      color: #fff;
      background: rgba(18, 8, 38, .85);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .chat-bubble span {
      margin-left: 5px;
      color: #00f2fe;
      font-weight: bold;
    }

    .room-input-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid rgba(0, 242, 254, .3);
      border-radius: 18px;
      background: rgba(22, 8, 45, .95);
    }

    .lang-selector {
      padding: 4px 4px;
      outline: none;
      border: 1px solid rgba(0, 242, 254, .4);
      border-radius: 12px;
      color: #00f2fe;
      background: rgba(15, 5, 30, .9);
      font-size: 10px;
      cursor: pointer;
    }

    .lang-selector option {
      background: #120826;
      color: #fff;
    }

    .translated-subtext {
      display: block;
      margin-top: 2px;
      color: #00f2fe;
      font-size: 10px;
      opacity: .9;
      border-top: 1px dashed rgba(0, 242, 254, .3);
      padding-top: 2px;
    }

    .room-input-box input {
      flex: 1;
      padding: 0 4px;
      outline: none;
      border: none;
      color: #fff;
      background: transparent;
      font-size: 12px;
    }

    .room-input-box button {
      padding: 6px 12px;
      border: none;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #00f2fe, #ff007f);
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .call-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 2px;
    }

    .control-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 50%;
      color: #fff;
      background: rgba(255, 255, 255, .1);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
      cursor: pointer;
      font-size: 14px;
      transition: .2s;
    }

    .control-icon-btn:hover {
      transform: scale(1.08);
    }

    .control-icon-btn.active {
      border-color: #ff0844;
      background: #ff0844;
      box-shadow: 0 0 15px rgba(255, 8, 68, .6);
    }

    .hangup-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: linear-gradient(135deg, #ff0844, #ffb199);
      box-shadow: 0 4px 15px rgba(255, 8, 68, .5);
      font-size: 15px;
    }

    @media (max-width: 430px) {
      .container {
        max-width: 100%;
        border: none;
      }

      .cinematic-moon {
        width: 170px;
        height: 170px;
      }
    }
  </style>
</head>

<body>
  <div class="cinematic-moon" id="cinematicMoon"></div>
  <canvas id="spaceCanvas"></canvas>

  <main class="container" id="mainContainer">
    <!-- شاشة البوابة -->
    <section id="screen-gateway" class="screen active gateway-screen">
      <div class="avatar-box">
        <div class="avatar-inner">🌌</div>
      </div>

      <h1>لافي منير</h1>

      <p class="gateway-desc">
        غرفة اتصال صوتية ومرئية P2P مع محرك ترجمة ذكي للرسائل عابر للقارات، دردشة حية، مشاركة شاشة، وتسجيل شامل للجلسة.
      </p>

      <input
        type="text"
        id="roomInput"
        class="room-input"
        placeholder="اكتب اسم الغرفة"
        value="lafi-room-1"
        maxlength="80"
        autocomplete="off"
      >

      <button class="btn" id="enterRoomBtn" type="button">
        دخول الغرفة الحية 🎙️
      </button>

      <a
        class="btn"
        href="https://github.com/wwwmounirmp-hue/lafi-munir"
        target="_blank"
        rel="noopener noreferrer"
        style="background: linear-gradient(135deg, rgba(30,15,60,.9), rgba(60,20,90,.9)); border: 1px solid rgba(0,242,254,.4);"
      >
        استكشف 🚀 GitHub
      </a>

      <div class="system-footer">
        STARDUST MEMORY P2P • 2026<br>
        <span style="color:#00f2fe;">صُنع بعشق في سماء السيادة الرقمية 🌌</span>
      </div>
    </section>

    <!-- شاشة الاتصال والدردشة -->
    <section id="screen-app" class="screen">
      <div class="live-room-content">
        <header class="room-top-bar">
          <span id="roomTitleDisplay" style="font-size:11px; font-weight:bold; color:#00f2fe;">
            الغرفة: جاري الاتصال... 🌐
          </span>

          <button
            id="exitRoomBtn"
            type="button"
            style="border:0; color:#ff0844; background:transparent; cursor:pointer; font-size:13px; font-weight:bold;"
          >
            ✕ خروج
          </button>
        </header>

        <div class="videos-container">
          <video id="remoteVideo" autoplay playsinline></video>
          <video id="localVideo" autoplay playsinline muted></video>
          <div id="stardustMemoryLayer"></div>
        </div>

        <div class="room-bottom-panel">
          <div class="room-chat-overlay" id="roomChatOverlay"></div>

          <div class="room-input-box">
            <select id="targetLangSelect" class="lang-selector" title="لغة الترجمة المستهدفة">
              <option value="ar">العربية 🇸🇦</option>
              <option value="en">English 🇺🇸</option>
              <option value="zh">中文 🇨🇳</option>
              <option value="fr">Français 🇫🇷</option>
              <option value="es">Español 🇪🇸</option>
              <option value="de">Deutsch 🇩🇪</option>
              <option value="ja">日本語 🇯🇵</option>
              <option value="tr">Türkçe 🇹🇷</option>
            </select>

            <input
              type="text"
              id="roomMsgInput"
              placeholder="اكتب رسالتك لتعبر القارات... ✨"
              autocomplete="off"
              maxlength="500"
            >
            <button id="sendMsgBtn" type="button">إرسال 🌍</button>
          </div>

          <div class="call-controls">
            <button class="control-icon-btn" id="micBtn" type="button" title="كتم الصوت">🎤</button>
            <button class="control-icon-btn" id="camBtn" type="button" title="الكاميرا">📷</button>
            <button class="control-icon-btn" id="screenShareBtn" type="button" title="مشاركة الشاشة">💻</button>
            <button class="control-icon-btn" id="recordBtn" type="button" title="تسجيل الجلسة كاملة">🔴</button>
            <button class="control-icon-btn hangup-btn" id="hangupBtn" type="button" title="إنهاء المكالمة">📞</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- كود JavaScript العادي -->
  <script>
    'use strict';

    window.appState = {
      globalStream: null,
      screenStream: null,
      originalVideoTrack: null,
      mediaRecorder: null,
      recordedChunks: [],
      currentRoomName: '',
      currentCall: null,
      peer: null,
      myPeerRef: null,
      isInitiator: false,
      isEvaluating: false,
      statsInterval: null,
      isSharingScreen: false,
      isLeaving: false,
      ambientAudioCtx: null,
      ambientOscillator: null,
      recordingStream: null,
      recordingAudioContext: null,
      recordingStopPromise: null,
      resolveRecordingStop: null,
      recordingAnimationId: null
    };

    const $ = id => document.getElementById(id);

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      $(screenId).classList.add('active');
    }

    window.setRoomStatus = function(text) {
      $('roomTitleDisplay').textContent = text;
    };

    function playCosmicSound(type = 'chime') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const ctx = new AudioContext();

        if (type === 'chime') {
          [528, 659.25, 783.99, 1046.5].forEach((frequency, index) => {
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            const startTime = ctx.currentTime + index * .1;

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, startTime);

            gain.gain.setValueAtTime(.05, startTime);
            gain.gain.exponentialRampToValueAtTime(.001, startTime + 1.2);

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            oscillator.start(startTime);
            oscillator.stop(startTime + 1.2);
          });
        }

        if (type === 'sparkle') {
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(880, ctx.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + .3);

          gain.gain.setValueAtTime(.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .4);

          oscillator.connect(gain);
          gain.connect(ctx.destination);

          oscillator.start();
          oscillator.stop(ctx.currentTime + .4);
        }

        setTimeout(() => ctx.close().catch(() => {}), 1500);
      } catch (error) {
        console.warn('Audio unavailable:', error);
      }
    }

    function startAmbientDrone() {
      try {
        stopAmbientDrone();
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        window.appState.ambientAudioCtx = new AudioContext();
        window.appState.ambientOscillator = window.appState.ambientAudioCtx.createOscillator();

        const gain = window.appState.ambientAudioCtx.createGain();
        window.appState.ambientOscillator.type = 'sine';
        window.appState.ambientOscillator.frequency.value = 110;
        gain.gain.value = .015;

        window.appState.ambientOscillator.connect(gain);
        gain.connect(window.appState.ambientAudioCtx.destination);
        window.appState.ambientOscillator.start();
      } catch (error) {
        console.warn('Ambient audio unavailable:', error);
      }
    }

    function stopAmbientDrone() {
      try {
        window.appState.ambientOscillator?.stop();
      } catch (_) {}

      try {
        window.appState.ambientAudioCtx?.close();
      } catch (_) {}

      window.appState.ambientOscillator = null;
      window.appState.ambientAudioCtx = null;
    }

    async function toggleRemoteFullscreen() {
      const video = $('remoteVideo');

      if (document.fullscreenElement) {
        try {
          await document.exitFullscreen();
        } catch (_) {}
        video.classList.remove('fullscreen-mode');
        return;
      }

      if (video.requestFullscreen) {
        video.requestFullscreen().catch(() => {
          video.classList.add('fullscreen-mode');
        });
      } else {
        video.classList.toggle('fullscreen-mode');
      }
    }

    async function translateTextSmart(text, targetLang) {
      if (typeof text !== 'string' || text.length <= 1 || !targetLang) return null;
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=auto|${targetLang}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data && data.responseData && data.responseData.translatedText) {
          const translated = data.responseData.translatedText;
          if (!translated.includes('MATCHES') && !translated.includes('QUOTA')) {
            return translated;
          }
        }
      } catch (err) {
        console.warn('Translation offline or failed:', err);
      }
      return null;
    }

    window.displayStardustMemory = async function(
      sender = 'مستخدم',
      text = '',
      isInitial = false
    ) {
      if (typeof text !== 'string' || !text.trim()) return;

      const chat = $('roomChatOverlay');
      const bubble = document.createElement('div');
      const senderElement = document.createElement('span');
      const textElement = document.createElement('div');

      bubble.className = 'chat-bubble';
      senderElement.textContent = `[${sender}]:`;
      textElement.textContent = text;
      bubble.append(senderElement, textElement);

      const targetLang = $('targetLangSelect')?.value || 'ar';
      if (text.length > 1) {
        const translatedText = await translateTextSmart(text, targetLang);
        if (translatedText && translatedText.trim() !== text.trim()) {
          const sub = document.createElement('span');
          sub.className = 'translated-subtext';
          sub.textContent = `🌐 ${translatedText}`;
          bubble.appendChild(sub);
        }
      }

      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;

      if (!isInitial) {
        const layer = $('stardustMemoryLayer');
        const particle = document.createElement('div');

        particle.className = 'stardust-particle';
        particle.style.left = `${Math.random() * 70}%`;
        particle.style.top = `${30 + Math.random() * 40}%`;
        particle.textContent = `✨ ${text}`;

        layer.appendChild(particle);
        setTimeout(() => particle.remove(), 6000);
      }
    };

    async function sendStardustMsg() {
      const input = $('roomMsgInput');
      const text = input.value.trim();

      if (!text || !window.appState.currentRoomName) return;

      playCosmicSound('sparkle');

      if (typeof window.sendStardustToCloud === 'function') {
        input.value = '';
        await window.sendStardustToCloud(
          window.appState.currentRoomName,
          text
        );
      }
    }

    async function enterRoom() {
      const rawRoomName = $('roomInput').value.trim();
      const roomName = rawRoomName
        .replace(/[.#$[\]/]/g, '-')
        .slice(0, 80);

      if (!roomName) {
        alert('يرجى إدخال اسم الغرفة أولًا.');
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        alert('المتصفح لا يدعم الكاميرا أو الميكروفون.');
        return;
      }

      // تصفير جميع الأقفال وحالة المغادرة وتطهير قفل الاتصال القديم تماماً قبل الدخول
      window.appState.isLeaving = false;
      window.appState.isEvaluating = false;
      if (typeof window.resetConnectionLock === 'function') {
        window.resetConnectionLock();
      }
      window.appState.currentRoomName = roomName;

      $('enterRoomBtn').disabled = true;
      showScreen('screen-app');
      window.setRoomStatus('الغرفة: طلب إذن الكاميرا والميكروفون...');

      try {
        playCosmicSound('chime');
        startAmbientDrone();

        window.appState.globalStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        $('localVideo').srcObject = window.appState.globalStream;
        window.setRoomStatus(`الغرفة: ${roomName} • جاري الاتصال...`);

        if (typeof window.initRoomP2P === 'function') {
          window.initRoomP2P(roomName, window.appState.globalStream);
        }
      } catch (error) {
        console.error('Media error:', error);
        alert('تعذر الوصول إلى الكاميرا أو الميكروفون.');

    }

    async function toggleScreenShare() {
      const call = window.appState.currentCall;

      if (!call?.peerConnection) {
        alert('يجب أن تكون في مكالمة نشطة لمشاركة الشاشة.');
        return;
      }

      if (window.appState.isSharingScreen) {
        await stopScreenShare();
        return;
      }

      try {
        window.appState.screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        const screenTrack = window.appState.screenStream.getVideoTracks()[0];
        const sender = call.peerConnection
          .getSenders()
          .find(item => item.track?.kind === 'video');

        if (!sender) throw new Error('لم يتم العثور على مسار الفيديو.');

        window.appState.originalVideoTrack =
          window.appState.globalStream?.getVideoTracks()[0] || null;

        await sender.replaceTrack(screenTrack);

        $('localVideo').srcObject = window.appState.screenStream;
        window.appState.isSharingScreen = true;
        $('screenShareBtn').classList.add('active');

        screenTrack.addEventListener('ended', async () => {

        console.error('Screen sharing error:', error);
        window.appState.screenStream?.getTracks().forEach(t => t.stop());
        window.appState.screenStream = null;
        window.appState.isSharingScreen = false;
        $('screenShareBtn').classList.remove('active');$('localVideo').srcObject = window.appState.globalStream;

    }

    async function stopScreenShare() {
      if (!window.appState.isSharingScreen) return;

      try {
        const sender = window.appState.currentCall?.peerConnection
          ?.getSenders()
          .find(item => item.track?.kind === 'video');

        if (sender && window.appState.originalVideoTrack) {
          await sender.replaceTrack(window.appState.originalVideoTrack);
        }

        window.appState.screenStream?.getTracks().forEach(t => t.stop());
        $('localVideo').srcObject = window.appState.globalStream;
      } catch (error) {
        console.error('Stop screen sharing error:', error);
      }

      window.appState.screenStream = null;
      window.appState.originalVideoTrack = null;
      window.appState.isSharingScreen = false;
      $('screenShareBtn').classList.remove('active');
    }

    function createMixedRecordingStream() {
      const localVideo = $('localVideo');
      const remoteVideo = $('remoteVideo');

      const canvas = document.createElement('canvas');
      canvas.width = 1280;
      canvas.height = 720;
      const ctx = canvas.getContext('2d');

      function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (remoteVideo.readyState >= 2) {
          ctx.drawImage(remoteVideo, 0, 0, canvas.width, canvas.height);
        }
        if (localVideo.readyState >= 2) {
          ctx.drawImage(localVideo, 20, 20, 240, 150);
        }
        window.appState.recordingAnimationId = requestAnimationFrame(draw);
      }
      draw();

      const canvasStream = canvas.captureStream(30);
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioContext = new AudioContext();
      const destination = audioContext.createMediaStreamDestination();

      function addAudio(stream) {
        const track = stream?.getAudioTracks()?.[0];
        if (!track) return;
        const source = audioContext.createMediaStreamSource(new MediaStream([track]));
        source.connect(destination);
      }

      addAudio(window.appState.globalStream);
      addAudio(remoteVideo.srcObject);

      window.appState.recordingStream = new MediaStream([
        canvasStream.getVideoTracks()[0],
        ...destination.stream.getAudioTracks()
      ]);
      window.appState.recordingAudioContext = audioContext;

      return window.appState.recordingStream;
    }

    function toggleRecording() {
      const button = $('recordBtn');

      if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
        alert('التسجيل غير مدعوم في هذا المتصفح.');
        return;
      }

      if (window.appState.mediaRecorder?.state === 'recording') {
        window.appState.mediaRecorder.stop();
        button.classList.remove('active');
        return;
      }

      const remoteVideoEl = $('remoteVideo');
      if (!window.appState.globalStream || !remoteVideoEl.srcObject) {
        alert('يجب اكتمال الاتصال وظهور فيديو الطرف الآخر لبدء التسجيل.');
        return;
      }

      try {
        const combinedStream = createMixedRecordingStream();
        const mimeTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
        const mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type));

        window.appState.recordedChunks = [];
        window.appState.mediaRecorder = new MediaRecorder(
          combinedStream,
          mimeType ? { mimeType } : undefined
        );

        window.appState.recordingStopPromise = new Promise(resolve => {
          window.appState.resolveRecordingStop = resolve;
        });

        window.appState.mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) window.appState.recordedChunks.push(event.data);
        };

        window.appState.mediaRecorder.onstop = async () => {
          try {
            if (window.appState.recordingAnimationId) {
              cancelAnimationFrame(window.appState.recordingAnimationId);
              window.appState.recordingAnimationId = null;
            }

            if (window.appState.recordedChunks.length > 0) {
              const blob = new Blob(window.appState.recordedChunks, { type: 'video/webm' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');

              a.href = url;
              a.download = `lafi-munir-mixed-call-${Date.now()}.webm`;
              document.body.appendChild(a);
              a.click();

              setTimeout(() => {
                a.remove();
                URL.revokeObjectURL(url);
              }, 1000);
            }

            window.appState.recordingStream?.getTracks().forEach(t => t.stop());

            if (window.appState.recordingAudioContext?.state !== 'closed') {
              try {
                await window.appState.recordingAudioContext?.close();
              } catch (_) {}
            }

            window.appState.recordingStream = null;
            window.appState.recordingAudioContext = null;
            window.appState.mediaRecorder = null;
            $('recordBtn').classList.remove('active');
          } finally {
            const resolveStop = window.appState.resolveRecordingStop;
            window.appState.resolveRecordingStop = null;
            window.appState.recordingStopPromise = null;
            resolveStop?.();
          }
        };

        window.appState.mediaRecorder.start();
        button.classList.add('active');
        alert('بدء تسجيل الجلسة المدمجة (الطرفين معاً) بأمان ✨');
      } catch (error) {
        console.error('Recording error:', error);
        alert('التسجيل غير مدعوم في هذا المتصفح.');
      }
    }

    window.monitorConnectionQuality = function(call) {
      if (!call?.peerConnection) return;

      if (window.appState.statsInterval) {
        clearInterval(window.appState.statsInterval);
      }

      window.appState.statsInterval = setInterval(async () => {
        try {
          const stats = await call.peerConnection.getStats();
          stats.forEach(report => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              const display = $('roomTitleDisplay');
              if (display) {
                display.textContent = report.packetsLost > 15 ? 'الغرفة: متذبذب 🟡' : 'الغرفة: ممتاز 🟢';
              }
            }
          });
        } catch (_) {}
      }, 4000);
    };

    async function stopRecordingSafely() {
      const recorder = window.appState.mediaRecorder;

      if (!recorder || recorder.state === 'inactive') return;

      try {
        if (recorder.state === 'recording') {
          recorder.stop();
        }

        await Promise.race([
          window.appState.recordingStopPromise || Promise.resolve(),
          new Promise(resolve => setTimeout(resolve, 2000))
        ]);
      } catch (error) {
        console.warn('Recording stop error:', error);
      }
    }

    async function goHome() {

      if (window.appState.recordingAnimationId) {
        cancelAnimationFrame(window.appState.recordingAnimationId);
        window.appState.recordingAnimationId = null;
      }

      if (window.appState.recordingAudioContext?.state !== 'closed') {
        try {
          await window.appState.recordingAudioContext?.close();
        } catch (_) {}
      }

      window.appState.globalStream = null;
      window.appState.screenStream = null;
      window.appState.originalVideoTrack = null;
      window.appState.currentCall = null;
      window.appState.recordingStream = null;
      window.appState.recordingAudioContext = null;
      window.appState.mediaRecorder = null;
      window.appState.resolveRecordingStop = null;
      window.appState.recordingStopPromise = null;

      $('localVideo').srcObject = null;
      $('remoteVideo').srcObject = null;
      $('mainContainer').classList.remove('connected-aura');$('cinematicMoon').classList.remove('pulse');

      $('roomChatOverlay').innerHTML = '';$('stardustMemoryLayer').innerHTML = '';
      $('micBtn').classList.remove('active');$('camBtn').classList.remove('active');
      $('screenShareBtn').classList.remove('active');$('recordBtn').classList.remove('active');

      showScreen('screen-gateway');

    window.goHome = goHome;

    $('enterRoomBtn').addEventListener('click', enterRoom);$('exitRoomBtn').addEventListener('click', goHome);
    $('hangupBtn').addEventListener('click', goHome);$('sendMsgBtn').addEventListener('click', sendStardustMsg);
    $('roomMsgInput').addEventListener('keydown', e => {       if (e.key === 'Enter') sendStardustMsg();     });$('micBtn').addEventListener('click', toggleMic);
    $('camBtn').addEventListener('click', toggleCam);$('screenShareBtn').addEventListener('click', toggleScreenShare);
    $('recordBtn').addEventListener('click', toggleRecording);$('remoteVideo').addEventListener('dblclick', toggleRemoteFullscreen);

    window.addEventListener('resize', resizeCanvas);

    for (let i = 0; i < 80; i++) {
      stars.push({

  <!-- كود Firebase وPeerJS المصحح نهائياً -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      remove,
      onChildAdded,
      onChildRemoved,
      onDisconnect,
      limitToLast,
      query,
      get,
      orderByChild
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://lafi-munir-global-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let unsubscribeRoom = null;
    let unsubscribeChat = null;
    let unsubscribePeersRemoved = null;

    window.resetConnectionLock = () => {};

    window.initRoomP2P = function (roomName, stream) {
      if (unsubscribeRoom) unsubscribeRoom();
      if (unsubscribeChat) unsubscribeChat();
      if (unsubscribePeersRemoved) unsubscribePeersRemoved();

      if (window.appState.peer) {
        window.appState.peer.destroy();
        window.appState.peer = null;
      }

      const roomPeersRef = ref(db, `rooms_v3/${roomName}/peers`);
      const messagesRef = query(ref(db, `rooms_v3/${roomName}/stardust`), limitToLast(50));

      const peer = new Peer({
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:global.stun.twilio.com:3478" },
            { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" }
          ]
        }
      });

      window.appState.peer = peer;

      let myPeerId = null;
      let connectingToPeerId = null;

      window.resetConnectionLock = () => {
        connectingToPeerId = null;
      };

      function handleCall(call) {
        if (window.appState.currentCall && window.appState.currentCall !== call) {
          call.close();
          return;
        }

        window.appState.currentCall = call;

        call.on("stream", remoteStream => {
          const remoteVideo = document.getElementById("remoteVideo");
          remoteVideo.srcObject = remoteStream;

          remoteVideo.play().catch(error => {
            console.warn("تعذر تشغيل الفيديو تلقائيًا:", error);
          });

          document.getElementById("cinematicMoon").classList.add("pulse");
          document.getElementById("mainContainer").classList.add("connected-aura");

          window.monitorConnectionQuality(call);
        });

        call.on("close", () => {
          if (window.appState.statsInterval) {
            clearInterval(window.appState.statsInterval);
            window.appState.statsInterval = null;
          }
          window.appState.currentCall = null;
          
          if (connectingToPeerId === call.peer) {
            connectingToPeerId = null;
          }

          const remoteVideo = document.getElementById("remoteVideo");
          if (remoteVideo) remoteVideo.srcObject = null;
          document.getElementById("mainContainer")?.classList.remove("connected-aura");
          document.getElementById("cinematicMoon")?.classList.remove("pulse");
          window.setRoomStatus("الغرفة: انتهت المكالمة 🟡");

          setTimeout(() => {
            if (!window.appState.isLeaving) {
              evaluateInitiatorAndConnect();
            }
          }, 500);
        });

        call.on("error", error => {
          console.error("Call error:", error);
          if (connectingToPeerId === call.peer) {
            connectingToPeerId = null;
          }
          call.close();
        });
      }

      async function evaluateInitiatorAndConnect() {
        if (
          window.appState.isEvaluating ||
          window.appState.isLeaving ||
          !window.appState.peer ||
          window.appState.peer.destroyed ||
          !myPeerId
        ) {
          return;
        }

        window.appState.isEvaluating = true;

        try {
          const snapshot = await get(query(roomPeersRef, orderByChild('createdAt')));
          if (!snapshot.exists() || window.appState.isLeaving) return;

          const peersData = snapshot.val();
          const firstPeerKey = Object.keys(peersData)[0];
          const leadingPeer = peersData[firstPeerKey];

          const amILeader = leadingPeer.peerId === myPeerId;
          window.appState.isInitiator = amILeader;

          if (amILeader && !window.appState.isLeaving) {
            for (const key of Object.keys(peersData)) {
              const p = peersData[key];
              
              if (
                p.peerId !== myPeerId &&
                !window.appState.currentCall &&
                connectingToPeerId === null
              ) {
                connectingToPeerId = p.peerId;

                const call = peer.call(p.peerId, stream);
                handleCall(call);

                call.on("close", () => {
                  if (connectingToPeerId === p.peerId) {
                    connectingToPeerId = null;
                  }
                });

                call.on("error", () => {
                  if (connectingToPeerId === p.peerId) {
                    connectingToPeerId = null;
                  }
                });

                break;
              }
            }
          }
        } catch (err) {
          console.warn("Evaluation error:", err);
        } finally {
          window.appState.isEvaluating = false;
        }
      }

      peer.on("open", async peerIdVar => {
        myPeerId = peerIdVar;
        window.appState.myPeerRef = push(roomPeersRef);

        try {
          await set(window.appState.myPeerRef, {
            peerId: myPeerId,
            createdAt: Date.now()
          });
          await onDisconnect(window.appState.myPeerRef).remove();
        } catch (error) {
          console.error('Firebase error:', error);
          window.setRoomStatus('تعذر الاتصال بالخادم 🔴');
          return;
        }

        window.setRoomStatus(`الغرفة: ${roomName} • متصل 🟢`);

        unsubscribeRoom = onChildAdded(roomPeersRef, async () => {
          await evaluateInitiatorAndConnect();
        });

        unsubscribePeersRemoved = onChildRemoved(roomPeersRef, async () => {
          await evaluateInitiatorAndConnect();
        });

        await evaluateInitiatorAndConnect();

        let firstMessage = true;
        unsubscribeChat = onChildAdded(messagesRef, snapshot => {
          const message = snapshot.val();
          if (!message) return;

          window.displayStardustMemory(
            message.sender || 'مستخدم',
            message.text,
            firstMessage
          );
          firstMessage = false;
        });
      });

      peer.on("call", call => {
        if (window.appState.currentCall && window.appState.currentCall !== call) {
          call.close();
          return;
        }
        call.answer(stream);
        handleCall(call);
      });

      peer.on("error", err => {
        console.error("PeerJS Error:", err);
        window.setRoomStatus("تعذر إنشاء اتصال P2P 🔴");
      });
    };

    window.sendStardustToCloud = async function (roomName, text) {
      try {
        const messagesRef = ref(db, `rooms_v3/${roomName}/stardust`);
        await push(messagesRef, {
          sender: "لافي منير",
          text,
          timestamp: Date.now()
        });
      } catch (error) {
        console.error("Chat Firebase error:", error);
      }
    };

    window.cleanupRoom = async function () {
      window.appState.isLeaving = true;
      if (typeof window.resetConnectionLock === 'function') {
        window.resetConnectionLock();
      }

      if (window.appState.statsInterval) {
        clearInterval(window.appState.statsInterval);
        window.appState.statsInterval = null;
      }

      if (unsubscribeRoom) {
        unsubscribeRoom();
        unsubscribeRoom = null;
      }

      if (unsubscribeChat) {
        unsubscribeChat();
        unsubscribeChat = null;
      }

      if (unsubscribePeersRemoved) {
        unsubscribePeersRemoved();
        unsubscribePeersRemoved = null;
      }

      if (window.appState.myPeerRef) {
        await remove(window.appState.myPeerRef).catch(() => {});
        window.appState.myPeerRef = null;
      }

      window.appState.currentCall?.close();
      window.appState.peer?.destroy();

      window.appState.peer = null;
      window.appState.currentCall = null;
      window.appState.isInitiator = false;
    };

    window.addEventListener("beforeunload", () => {
      window.appState.isLeaving = true;
      if (typeof window.resetConnectionLock === 'function') {
        window.resetConnectionLock();
      }
      window.appState.globalStream?.getTracks().forEach(t => t.stop());
      window.appState.peer?.destroy();
    });
  </script>
