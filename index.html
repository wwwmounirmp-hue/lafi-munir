<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لافي منير | STARDUST SOVEREIGN CORE ⚡</title>

  <meta name="theme-color" content="#030008">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- مكتبة PeerJS للاتصال المباشر -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Tahoma, monospace; }
    body {
      min-height: 100dvh; overflow: hidden; color: #00ff66;
      background: linear-gradient(135deg, #030008, #0a021a, #15002b, #030008);
      background-size: 300% 300%; animation: stardustAurora 12s ease infinite;
    }
    @keyframes stardustAurora {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .container {
      position: relative; z-index: 3; display: flex; flex-direction: column;
      width: 100%; max-width: 480px; height: 100dvh; margin: auto;
      overflow: hidden; background: rgba(8, 2, 18, 0.95);
      border-left: 2px solid #ff0055; border-right: 2px solid #00f2fe;
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.3), 0 0 35px rgba(0, 242, 254, 0.3);
      backdrop-filter: blur(25px);
    }

    .screen { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
    .screen.active { display: flex; }

    .gateway-screen {
      align-items: center; justify-content: center;
      padding: 25px; overflow-y: auto; text-align: center;
    }

    .avatar-box {
      width: 110px; height: 110px; margin: 0 auto 15px; padding: 3px;
      border-radius: 50%; background: linear-gradient(135deg, #ff0055, #7928ca, #00f2fe);
      box-shadow: 0 0 50px rgba(255, 0, 85, 0.8), 0 0 30px rgba(0, 242, 254, 0.6);
      animation: avatarGlow 3s infinite alternate;
    }
    .avatar-inner {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; border-radius: 50%; background: #030008;
      font-size: 45px; text-shadow: 0 0 25px #ff0055, 0 0 10px #00f2fe;
    }
    @keyframes avatarGlow {
      from { transform: scale(1); box-shadow: 0 0 30px rgba(255,0,85,0.6), 0 0 20px rgba(0,242,254,0.4); }
      to { transform: scale(1.06); box-shadow: 0 0 70px rgba(255,0,85,0.9), 0 0 50px rgba(0,242,254,0.9); }
    }

    h1 {
      margin-bottom: 8px; font-size: 24px; font-weight: 900;
      background: linear-gradient(90deg, #ff0055, #00f2fe, #ff0055);
      background-size: 200% auto; animation: textShine 4s linear infinite;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
    }
    @keyframes textShine {
      to { background-position: 200% center; }
    }

    .gateway-desc { margin-bottom: 15px; color: #a5f3fc; font-size: 11px; line-height: 1.6; text-shadow: 0 0 10px rgba(0,242,254,0.4); }

    .room-input {
      width: 100%; margin-bottom: 10px; padding: 12px 16px;
      outline: none; border: 1px solid #ff0055; border-radius: 18px;
      color: #fff; background: rgba(18, 4, 32, 0.9); font-size: 13px; text-align: center;
      box-shadow: inset 0 0 15px rgba(255,0,85,0.3), 0 0 10px rgba(255,0,85,0.2); transition: .3s;
    }
    .room-input:focus { border-color: #00f2fe; box-shadow: 0 0 25px rgba(0,242,254,0.7), inset 0 0 10px rgba(0,242,254,0.3); }

    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; gap: 8px; margin: 6px 0; padding: 13px;
      border: 0; border-radius: 20px; color: #fff;
      background: linear-gradient(135deg, #ff0055, #7928ca, #00f2fe);
      background-size: 200% 200%; animation: btnGrad 5s ease infinite;
      cursor: pointer; font-size: 13px; font-weight: bold;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.5); transition: transform .2s, box-shadow .2s;
    }
    @keyframes btnGrad {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn:hover { transform: scale(1.02); box-shadow: 0 0 35px rgba(0, 242, 254, 0.8); }

    .live-room-content { position: relative; display: flex; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
    .room-top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid rgba(255,0,85,0.4);
      background: rgba(10, 2, 18, 0.95);
      box-shadow: 0 4px 15px rgba(255,0,85,0.2);
    }

    .videos-container { position: relative; display: flex; flex: 1; flex-direction: column; overflow-y: auto; gap: 6px; padding: 6px; }
    .remote-peer-video { width: 100%; min-height: 180px; background: #000; object-fit: cover; border-bottom: 2px solid #ff0055; border-radius: 8px; box-shadow: 0 0 15px rgba(255,0,85,0.4); }
    #localVideo {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      width: 85px; height: 115px; border: 2px solid #00f2fe;
      border-radius: 12px; background: #000; object-fit: cover;
      box-shadow: 0 0 20px rgba(0,242,254,0.6);
    }

    .terminal-logs {
      height: 90px; background: rgba(0,0,0,0.9); border-top: 1px solid #00f2fe44;
      padding: 8px; font-size: 10px; color: #00f2fe; overflow-y: auto;
      text-shadow: 0 0 5px rgba(0,242,254,0.5);
    }

    .room-bottom-panel { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-top: 1px solid rgba(0,242,254,0.4); background: rgba(5,1,10,0.95); box-shadow: 0 -4px 15px rgba(0,242,254,0.2); }
    .room-chat-overlay { display: flex; flex-direction: column; max-height: 70px; gap: 4px; overflow-y: auto; }

    .chat-bubble {
      width: fit-content; max-width: 85%; padding: 4px 8px;
      border-right: 3px solid #ff0055; border-radius: 6px;
      color: #fff; background: rgba(20, 5, 35, 0.9); font-size: 10.5px;
      box-shadow: 0 0 10px rgba(255,0,85,0.2);
    }

    .room-input-box { display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid #00f2fe; border-radius: 14px; background: rgba(10,2,18,0.9); box-shadow: 0 0 10px rgba(0,242,254,0.2); }
    .room-input-box input { flex: 1; padding: 4px; outline: none; border: none; color: #fff; background: transparent; font-size: 11px; }
    .room-input-box button { padding: 5px 8px; border: none; border-radius: 10px; color: #fff; background: linear-gradient(135deg, #ff0055, #7928ca); cursor: pointer; font-size: 10px; font-weight: bold; box-shadow: 0 0 10px rgba(255,0,85,0.4); }

    .call-controls { display: flex; justify-content: center; gap: 8px; }
    .control-icon-btn {
      width: 36px; height: 36px; border: 1px solid #00f2fe; border-radius: 50%;
      color: #fff; background: #0a0212; cursor: pointer; font-size: 13px;
      box-shadow: 0 0 10px rgba(0,242,254,0.4); transition: 0.2s;
    }
    .control-icon-btn.active { border-color: #ff0055; background: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.8); }
  </style>
</head>

<body>
  <main class="container" id="mainContainer">
    <!-- بوابة الدخول -->
    <section id="screen-gateway" class="screen active gateway-screen">
      <div class="avatar-box"><div class="avatar-inner">🪐</div></div>
      <h1>لافي منير</h1>
      <p class="gateway-desc">المحطة الفضائية السيادية • تواصل هولوجرافي عبر النجوم بأعلى معايير الاستقلالية والسرعة.</p>

      <input type="text" id="roomInput" class="room-input" value="lafi-room-1" autocomplete="off" placeholder="اسم الغرفة">
      <input type="text" id="nomadNameInput" class="room-input" value="" autocomplete="off" placeholder="اسم العابر الفضائي (اختياري)">

      <button class="btn" id="enterRoomBtn" type="button">دخول الغرفة الحية 🎙️</button>
      <button class="btn" onclick="window.open('https://github.com/wwwmounirmp-hue/lafi-munir', '_blank')" style="background: linear-gradient(135deg, #1f2937, #111827); border: 1px solid #00f2fe; box-shadow: 0 0 15px rgba(0,242,254,0.4);">استكشف GitHub 🚀</button>
    </section>

    <!-- واجهة التشغيل الحية -->
    <section id="screen-app" class="screen">
      <div class="live-room-content">
        <header class="room-top-bar">
          <span id="roomTitleDisplay" style="font-size:11px; color:#00f2fe; text-shadow:0 0 8px rgba(0,242,254,0.6);">القطاع: جاري الاتصال... ⚡</span>
          <button onclick="window.exitStardustNode()" style="border:0; color:#ff0055; background:transparent; cursor:pointer; font-weight:bold; text-shadow:0 0 8px rgba(255,0,85,0.6);">مغادرة المحطة ❌</button>
        </header>

        <div class="videos-container" id="videosContainer">
          <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <!-- قسم السينما المشتركة -->
        <div id="cosmicCinemaContainer" style="display:none; width:100%; height:140px; background:#000; border-bottom:2px solid #00f2fe; box-shadow:0 0 15px rgba(0,242,254,0.4);">
          <div id="mediaStage" style="width:100%; height:100%;"></div>
        </div>

        <div class="terminal-logs" id="terminalLogs">
          <div>[SYSTEM]: تم تأمين ونشر الدرع السيادي بنجاح...</div>
        </div>

        <div class="room-bottom-panel">
          <!-- شريط التحكم بالسينما -->
          <div class="room-input-box">
            <input type="text" id="cinemaUrlInput" placeholder="أدخل الرابط هنا واضغط Enter أو بث..." autocomplete="off">
            <button id="broadcastCinemaBtn" type="button">بث 🎬</button>
          </div>

          <div class="room-chat-overlay" id="roomChatOverlay"></div>

          <div class="room-input-box">
            <input type="text" id="roomMsgInput" placeholder="أرسل رسالة أو وسائط عابرة للقطاع..." autocomplete="off">
            <button id="sendMsgBtn" type="button">إرسال ⚡</button>
          </div>

          <div class="call-controls">
            <button class="control-icon-btn" id="micBtn" type="button" title="الميكروفون">🎙️</button>
            <button class="control-icon-btn" id="camBtn" type="button" title="الكاميرا">📸</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- [STARDUST SOVEREIGN OBFUSCATED & PROTECTED ENGINE] -->

    async function enterStardustNode(){const room=document.getElementById('roomInput').value.trim()||'lafi-room-1';const username=document.getElementById('nomadNameInput').value.trim()||'عابر';window.appState.roomName=room;showScreen('screen-app');listenToCinema(room);logStardust(`جاري ربط القطاع المحصن: ${room}...`);try{const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true}).catch(()=>null);window.appState.stream=stream;if(stream)document.getElementById('localVideo').srcObject=stream;const peer=new Peer({config:{iceServers:[{urls:"stun:stun.l.google.com:19302"}]}});window.appState.peer=peer;peer.on('open',async(id)=>{logStardust(`تم تفعيل معرّف المحطة المؤمن: ${id}`,'success');document.getElementById('roomTitleDisplay').textContent=`القطاع: ${room} - متصل كـ (${username})`;if(db){const peerRef=push(ref(db,`stardust_rooms/${room}/peers`));await set(peerRef,{peerId:id,name:username,createdAt:Date.now()});window.appState.myPeerRef=peerRef;await onDisconnect(peerRef).remove();onChildAdded(ref(db,`stardust_rooms/${room}/peers`),(snap)=>{const data=snap.val();if(data&&data.peerId!==id&&!window.appState.calls[data.peerId]){logStardust(`استدعاء عقدة مجاورة: ${data.peerId}`);const call=peer.call(data.peerId,window.appState.stream);handleCall(call,data.peerId);}});}});peer.on('call',(call)=>{call.answer(window.appState.stream);handleCall(call,call.peer);});}catch(err){logStardust(`خطأ في تشغيل المحطة: ${err.message}`,'error');}}
