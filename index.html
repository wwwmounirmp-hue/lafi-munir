<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05081a">
<title>لافي منير | دردشة عشوائية</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#05081a;--line:#25324a;--text:#eef4ff;--muted:#94a3bd;--cyan:#42f3ff;--violet:#b45cff;--green:#38ffc2;--red:#ff6e88;--radius:18px}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
body{background:radial-gradient(ellipse at 50% 0%,#15244b 0,transparent 40%),radial-gradient(ellipse at 90% 40%,#4a1170 0,transparent 45%),#02030a;background-attachment:fixed;min-height:100vh}
button,input{cursor:pointer;font:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:2;max-width:900px;margin:auto;padding:14px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border:1px solid #42dfff55;background:#0a1228cc;backdrop-filter:blur(18px);border-radius:var(--radius);box-shadow:0 0 24px #42f3ff33;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:900;color:#07111a;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 30px #42f3ff88}
.brand h1{margin:0;font-size:clamp(15px,2.3vw,20px)}
.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--green);padding:8px 10px;background:#53e6a710;border:1px solid #53e6a733;border-radius:99px}
.dot{width:7px;height:7px;background:currentColor;border-radius:50%;animation:pulse 1.8s infinite}
.panel{background:#0a1228dd;border:1px solid #42dfff55;border-radius:var(--radius);padding:20px;backdrop-filter:blur(18px)}
.btn{border:1px solid var(--line);background:#141e3a;color:var(--text);border-radius:11px;padding:12px 18px;transition:.18s;font-weight:600}
.btn:hover{border-color:#42f3ff99;transform:translateY(-1px)}
.btn.primary{color:#07111a;border:0;background:linear-gradient(120deg,var(--cyan),#a1f5ff)}
.btn.danger{border-color:#ff6e8855;color:#ff9bae}
.btn.big{padding:18px 24px;font-size:16px;width:100%}
.center{text-align:center}
.idle-screen{text-align:center;padding:40px 20px}
.idle-screen .big-ico{font-size:64px;margin-bottom:16px;filter:drop-shadow(0 0 20px var(--cyan))}
.idle-screen h2{margin:0 0 8px;font-size:24px}
.idle-screen p{color:var(--muted);margin:0 0 24px;font-size:14px;line-height:1.7}
.waiting-screen{text-align:center;padding:40px 20px}
.spinner{width:60px;height:60px;border:4px solid #42f3ff22;border-top-color:var(--cyan);border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.partner-screen{display:flex;flex-direction:column;gap:14px}
.partner-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.partner-head .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:#53e6a715;border:1px solid #53e6a733;border-radius:99px;font-size:12px;color:var(--green)}
.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.video-box{position:relative;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center}
.video-box video{width:100%;height:100%;object-fit:cover}
.video-box span{position:absolute;bottom:8px;right:8px;background:#0008;padding:3px 10px;border-radius:6px;font-size:11px;color:var(--cyan)}
.chat-log{background:#02040a;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:160px;max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.chat-msg{padding:8px 12px;border-radius:12px;max-width:85%;font-size:13px;word-break:break-word}
.chat-msg.them{background:#152040;border:1px solid #2b3c5a;align-self:flex-start}
.chat-msg.me{background:#0b3a4a;border:1px solid #1c7787;align-self:flex-end}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#050a1c;color:var(--text);outline:none}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.controls .btn{padding:14px 8px;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#0e1832;border:1px solid #42f3ff88;color:#fff;border-radius:12px;padding:11px 15px;box-shadow:0 0 24px #42f3ff66;z-index:50;transition:.2s;font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@media(max-width:520px){.video-grid{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">L</div>
      <div>
        <h1>لافي منير</h1>
        <p>دردشة عشوائية حقيقية</p>
      </div>
    </div>
    <span class="status"><span class="dot"></span> <span id="connStatus">جارٍ الاتصال...</span></span>
  </header>

  <main id="main" class="panel"></main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue, onDisconnect, push, remove, get, query, limitToLast }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

// ====== Firebase Config ======
const firebaseConfig = {
  databaseURL: "https://lavi-efe54-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ====== المتغيرات ======
const main = document.getElementById('main');
const toastEl = document.getElementById('toast');
function toast(m){ toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 2800); }

let myId = 'u_' + Math.random().toString(36).slice(2,10);
let myName = localStorage.getItem('lafi_name') || '';
let myPeerId = null;
let peer = null;
let localStream = null;
let currentCall = null;
let partnerId = null;
let partnerName = null;
let unsubscribeQueue = null;
let unsubscribeRoom = null;
let isSearching = false;
let myQueueRef = null;

// ====== تأثير النجوم ======
(function initStars(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let w,h,stars=[];
  function resize(){
    w=c.width=innerWidth; h=c.height=innerHeight;
    stars=[]; const n=Math.min(120,Math.max(40,Math.round(w*h/14000)));
    for(let i=0;i<n;i++) stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.2,a:Math.random()*.7+.3,ph:Math.random()*6.28,sp:Math.random()*.4+.1});
  }
  function draw(t){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      const tw=.5+.5*Math.sin(t*.001*s.sp+s.ph);
      ctx.beginPath(); ctx.fillStyle='rgba(66,243,255,'+(s.a*tw)+')';
      ctx.shadowBlur=6; ctx.shadowColor='rgba(66,243,255,.7)';
      ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
    }
    ctx.shadowBlur=0;
    requestAnimationFrame(draw);
  }
  resize(); addEventListener('resize',resize,{passive:true});
  requestAnimationFrame(draw);
})();

// ====== PeerJS ======
function initPeer(){
  return new Promise((resolve,reject)=>{
    try{
      peer = new Peer(undefined, { debug: 0 });
      let done = false;
      peer.on('open', id => { myPeerId = id; done = true; resolve(id); });
      peer.on('error', err => { console.warn('Peer error:', err); });
      peer.on('call', call => {
        if(!localStream){ call.close(); return; }
        call.answer(localStream);
        currentCall = call;
        bindCall(call);
      });
      setTimeout(()=>{ if(!done) reject(new Error('Peer timeout')); }, 15000);
    }catch(e){ reject(e); }
  });
}

function bindCall(call){
  call.on('stream', remoteStream => {
    const rv = document.getElementById('remoteVideo');
    if(rv) rv.srcObject = remoteStream;
  });
  call.on('close', () => {
    toast('انتهت المكالمة');
    leaveChat();
  });
}

// ====== الشاشات ======
function showIdle(){
  cleanup();
  main.innerHTML = `
    <div class="idle-screen">
      <div class="big-ico">🌌</div>
      <h2>دردشة عشوائية حقيقية</h2>
      <p>اضغط الزر أدناه لبدء البحث عن شخص للتحدث معه.<br>عند العثور على شريك، يمكنك الكتابة أو التحدث بالفيديو.</p>
      <input id="nameInput" placeholder="اكتب اسمك (اختياري)" value="${escapeHtml(myName)}" style="width:100%;max-width:300px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#050a1c;color:var(--text);outline:none;margin-bottom:14px;text-align:center">
      <button class="btn primary big" id="startBtn">🔍 ابحث عن شريك</button>
    </div>`;
  document.getElementById('startBtn').onclick = startSearch;
  document.getElementById('nameInput').addEventListener('input', e => { myName = e.target.value.trim().slice(0,24); });
  updateConnStatus('جاهز');
}

function showWaiting(){
  main.innerHTML = `
    <div class="waiting-screen">
      <div class="spinner"></div>
      <h2>🔍 جاري البحث...</h2>
      <p style="color:var(--muted);margin-top:12px">نبحث لك عن شريك. يرجى الانتظار...</p>
      <button class="btn danger" id="cancelBtn" style="margin-top:20px">إلغاء البحث</button>
    </div>`;
  document.getElementById('cancelBtn').onclick = cancelSearch;
}

async function showPartner(){
  main.innerHTML = `
    <div class="partner-screen">
      <div class="partner-head">
        <span class="badge">🟢 متصل بـ: <b>${escapeHtml(partnerName||'مجهول')}</b></span>
      </div>
      <div class="video-grid">
        <div class="video-box"><video id="localVideo" autoplay muted playsinline></video><span>أنت</span></div>
        <div class="video-box"><video id="remoteVideo" autoplay playsinline></video><span>الشريك</span></div>
      </div>
      <div class="chat-log" id="chatLog"><div style="color:var(--muted);text-align:center;padding:20px">💬 ابدأ الحديث...</div></div>
      <div class="chat-input">
        <input id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
        <button class="btn primary" id="sendBtn">إرسال</button>
      </div>
      <div class="controls">
        <button class="btn primary" id="videoBtn">📹 فيديو</button>
        <button class="btn primary" id="audioBtn">📞 صوت</button>
        <button class="btn" id="skipBtn">⏭️ تخطي</button>
        <button class="btn danger" id="endBtn">❌ إنهاء</button>
      </div>
    </div>`;

  document.getElementById('sendBtn').onclick = sendMessage;
  document.getElementById('msgInput').addEventListener('keydown', e => { if(e.key==='Enter') sendMessage(); });
  document.getElementById('videoBtn').onclick = () => callPartner(true);
  document.getElementById('audioBtn').onclick = () => callPartner(false);
  document.getElementById('skipBtn').onclick = skipPartner;
  document.getElementById('endBtn').onclick = leaveChat;
  updateConnStatus('في محادثة');
}

// ====== البحث والمطابقة ======
async function startSearch(){
  if(isSearching) return;
  if(!myName) myName = 'عابر-' + myId.slice(2,6);
  localStorage.setItem('lafi_name', myName);
  isSearching = true;

  showWaiting();
  updateConnStatus('يبحث...');

  if(!peer){
    try{ await initPeer(); toast('تم تهيئة الاتصال'); }
    catch(e){ toast('تعذر تشغيل الاتصال'); isSearching=false; showIdle(); return; }
  }

  const queueRef = ref(db, 'queue');
  const entry = { id: myId, name: myName, peerId: myPeerId, ts: Date.now() };
  myQueueRef = push(queueRef);
  await set(myQueueRef, entry);
  onDisconnect(myQueueRef).remove();

  unsubscribeQueue = onValue(queueRef, snap => {
    if(!isSearching) return;
    const data = snap.val() || {};
    const others = Object.values(data).filter(u => u && u.id !== myId && u.peerId);

    if(others.length === 0) return;

    const partner = others.sort((a,b)=>a.ts-b.ts)[0];

    if(myId < partner.id){
      tryMatch(partner.id, partner.name, partner.peerId);
    }
  });

  const roomsRef = ref(db, 'rooms');
  unsubscribeRoom = onValue(roomsRef, snap => {
    if(!isSearching) return;
    const data = snap.val() || {};
    for(const [roomId, room] of Object.entries(data)){
      if(room && room.b === myId && !room.joined && Date.now() - room.ts < 30000){
        isSearching = false;
        if(unsubscribeQueue){ unsubscribeQueue(); unsubscribeQueue = null; }
        if(unsubscribeRoom){ unsubscribeRoom(); unsubscribeRoom = null; }
        if(myQueueRef){ remove(myQueueRef).catch(()=>{}); myQueueRef = null; }

        partnerId = room.a; partnerName = room.aName;
        set(ref(db, 'rooms/' + roomId + '/joined'), true);

        showPartner().then(async () => {
          await startLocalMedia(false, false);
          listenMessages(roomId);
        });
        return;
      }
    }
  });
}

async function tryMatch(pId, pName, pPeerId){
  if(!isSearching) return;
  isSearching = false;

  if(myQueueRef){ await remove(myQueueRef).catch(()=>{}); myQueueRef = null; }
  if(unsubscribeQueue){ unsubscribeQueue(); unsubscribeQueue = null; }
  if(unsubscribeRoom){ unsubscribeRoom(); unsubscribeRoom = null; }

  partnerId = pId;
  partnerName = pName;

  const roomId = [myId, pId].sort().join('__');
  const roomRef = ref(db, 'rooms/' + roomId);

  await set(roomRef, {
    a: myId, aName: myName, aPeer: myPeerId,
    b: pId, bName: pName, bPeer: pPeerId,
    ts: Date.now()
  });

  await showPartner();
  await startLocalMedia(false, false);

  const call = peer.call(pPeerId, localStream);
  currentCall = call;
  bindCall(call);

  listenMessages(roomId);
}

function listenMessages(roomId){
  const msgsRef = query(ref(db, 'msgs/' + roomId), limitToLast(50));
  onValue(msgsRef, snap => {
    const data = snap.val() || {};
    const log = document.getElementById('chatLog');
    if(!log) return;
    log.innerHTML = '';
    const list = Object.values(data).sort((a,b)=>(a.ts||0)-(b.ts||0));
    if(list.length === 0){
      log.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px">💬 ابدأ الحديث...</div>';
    } else {
      for(const m of list){
        const div = document.createElement('div');
        div.className = 'chat-msg ' + (m.from === myId ? 'me' : 'them');
        div.textContent = (m.from === myId ? 'أنا: ' : '') + m.text;
        log.appendChild(div);
      }
      log.scrollTop = log.scrollHeight;
    }
  });
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text || !partnerId) return;
  const roomId = [myId, partnerId].sort().join('__');
  input.value = '';
  await push(ref(db, 'msgs/' + roomId), { from: myId, text: text, ts: Date.now() });
}

// ====== الوسائط ======
async function startLocalMedia(video, audio){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video, audio });
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); }
    localStream = stream;
    const lv = document.getElementById('localVideo');
    if(lv) lv.srcObject = stream;
  }catch(e){
    console.warn('media error', e);
    toast('تعذر الوصول للكاميرا/الميكروفون');
  }
}

async function callPartner(withVideo){
  if(!peer) { toast('الاتصال غير جاهز'); return; }
  if(!partnerId) { toast('لا يوجد شريك'); return; }

  const roomData = (await get(ref(db, 'rooms/' + [myId,partnerId].sort().join('__')))).val() || {};
  const partnerPeer = roomData.a === myId ? roomData.bPeer : roomData.aPeer;
  if(!partnerPeer){ toast('تعذر تحديد شريك'); return; }

  if(withVideo){
    if(localStream) localStream.getVideoTracks().forEach(t=>t.stop());
    await startLocalMedia(true, true);
  } else {
    if(!localStream || localStream.getAudioTracks().length === 0){
      await startLocalMedia(false, true);
    } else {
      localStream.getVideoTracks().forEach(t=>t.stop());
    }
  }

  if(currentCall){ try{ currentCall.close(); }catch(e){} }
  const call = peer.call(partnerPeer, localStream);
  currentCall = call;
  bindCall(call);
  toast(withVideo ? 'بدأت المكالمة المرئية' : 'بدأت المكالمة الصوتية');
}

async function skipPartner(){
  toast('جاري البحث عن شريك جديد...');
  if(currentCall){ try{ currentCall.close(); }catch(e){} }
  partnerId = null; partnerName = null;
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
  isSearching = false;
  showIdle();
}

async function leaveChat(){
  cleanup();
  showIdle();
}

async function cancelSearch(){
  isSearching = false;
  cleanup();
  showIdle();
}

function cleanup(){
  isSearching = false;
  if(myQueueRef){ remove(myQueueRef).catch(()=>{}); myQueueRef = null; }
  if(unsubscribeQueue){ unsubscribeQueue(); unsubscribeQueue = null; }
  if(unsubscribeRoom){ unsubscribeRoom(); unsubscribeRoom = null; }
  if(currentCall){ try{ currentCall.close(); }catch(e){} currentCall = null; }
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
  partnerId = null; partnerName = null;
}

function updateConnStatus(s){
  const el = document.getElementById('connStatus');
  if(el) el.textContent = s;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

showIdle();
</script>
</body>
</html>
