<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لافي منير | منصة الاتصال والترجمة الجماعية السيادية</title>

  <!-- مكتبة PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #0d0221, #1a0033, #240046, #3c096c);
      background-size: 300% 300%;
      animation: cosmicAurora 12s ease infinite;
    }

    @keyframes cosmicAurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #spaceCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .cinematic-moon {
      position: fixed;
      top: -40px;
      left: 50%;
      z-index: 2;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      transform: translateX(-50%);
      opacity: .9;
      pointer-events: none;
      background: radial-gradient(
        circle at 30% 30%,
        #fff 0%,
        #00f2fe 35%,
        #7928ca 70%,
        #ff007f 100%
      );
      box-shadow:
        0 0 80px rgba(0, 242, 254, .6),
        0 0 140px rgba(255, 0, 127, .4);
      transition: transform .3s ease;
    }

    .cinematic-moon.pulse {
      transform: translateX(-50%) scale(1.08);
    }

    .container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      margin: auto;
      overflow: hidden;
      background: rgba(18, 8, 38, .85);
      border-left: 1px solid rgba(0, 242, 254, .4);
      border-right: 1px solid rgba(0, 242, 254, .4);
      backdrop-filter: blur(25px);
      transition: box-shadow .5s ease;
    }

    .container.connected-aura {
      box-shadow:
        0 0 40px rgba(0, 242, 254, .5),
        inset 0 0 30px rgba(255, 0, 127, .2);
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    .gateway-screen {
      align-items: center;
      justify-content: center;
      padding: 30px;
      overflow-y: auto;
      text-align: center;
    }

    .avatar-box {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f);
      box-shadow: 0 0 50px rgba(0, 242, 254, .7);
      animation: avatarGlow 3s infinite alternate;
    }

    .avatar-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0c0614;
      font-size: 45px;
    }

    @keyframes avatarGlow {
      from {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(0, 242, 254, .4);
      }
      to {
        transform: scale(1.06);
        box-shadow: 0 0 60px rgba(255, 0, 127, .7);
      }
    }

    h1 {
      margin-bottom: 8px;
      color: #00f2fe;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, #00f2fe, #a855f7, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gateway-desc {
      margin-bottom: 20px;
      color: #d8b4fe;
      font-size: 12px;
      line-height: 1.6;
    }

    .room-input {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px 16px;
      outline: none;
      border: 1px solid rgba(0, 242, 254, .4);
      border-radius: 20px;
      color: #fff;
      background: rgba(25, 10, 50, .9);
      font-size: 14px;
      text-align: center;
    }

    .room-input:focus {
      border-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, .4);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 8px;
      margin: 6px 0;
      padding: 14px;
      border: 0;
      border-radius: 25px;
      color: #fff;
      background: linear-gradient(135deg, #00f2fe, #7928ca);
      box-shadow: 0 5px 25px rgba(0, 242, 254, .4);
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      transition: transform .2s ease;
    }

    .btn:hover {
      transform: scale(1.02);
    }

    .system-footer {
      margin-top: 15px;
      color: rgba(255, 255, 255, .6);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-align: center;
    }

    .live-room-content {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .room-top-bar {
      z-index: 5;
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(0, 242, 254, .3);
      background: rgba(20, 10, 40, .9);
      backdrop-filter: blur(10px);
    }

    .videos-container {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 120px;
      overflow-y: auto;
      gap: 5px;
    }

    .remote-peer-video {
      width: 100%;
      height: 100%;
      min-height: 180px;
      background: #080112;
      object-fit: cover;
      border-bottom: 1px solid rgba(0, 242, 254, .2);
    }

    #localVideo {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 90px;
      height: 130px;
      border: 2px solid #00f2fe;
      border-radius: 12px;
      background: #190028;
      box-shadow: 0 0 20px rgba(0, 242, 254, .5);
      object-fit: cover;
    }

    .seats-grid-overlay {
      position: absolute;
      top: 152px;
      left: 12px;
      right: 12px;
      z-index: 15;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      pointer-events: none;
    }

    .seat-slot {
      height: 40px;
      border: 1px solid rgba(0, 242, 254, .4);
      border-radius: 8px;
      background: rgba(12, 4, 25, .75);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #00f2fe;
      font-weight: bold;
    }

    #stardustMemoryLayer {
      position: absolute;
      inset: 10px;
      z-index: 8;
      overflow: hidden;
      pointer-events: none;
    }

    .stardust-particle {
      position: absolute;
      padding: 4px 10px;
      border: 1px solid rgba(255, 0, 127, .5);
      border-radius: 12px;
      color: #fff;
      background: rgba(0, 242, 254, .8);
      box-shadow: 0 0 10px rgba(0, 242, 254, .6);
      animation: floatUp 6s linear forwards;
      font-size: 11px;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(80px) scale(.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-150px) scale(1.1); }
    }

    .room-bottom-panel {
      z-index: 20;
      display: flex;
      flex-shrink: 0;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid rgba(0, 242, 254, .3);
      background: rgba(12, 4, 25, .95);
      backdrop-filter: blur(15px);
    }

    .room-chat-overlay {
      display: flex;
      flex-direction: column;
      max-height: 80px;
      gap: 4px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .room-chat-overlay::-webkit-scrollbar { display: none; }

    .chat-bubble {
      width: fit-content;
      max-width: 85%;
      padding: 5px 10px;
      border-right: 3px solid #00f2fe;
      border-radius: 10px;
      color: #fff;
      background: rgba(18, 8, 38, .85);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .chat-bubble span { margin-left: 5px; color: #00f2fe; font-weight: bold; }

    .room-input-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid rgba(0, 242, 254, .3);
      border-radius: 18px;
      background: rgba(22, 8, 45, .95);
    }

    .lang-selector {
      padding: 4px;
      outline: none;
      border: 1px solid rgba(0, 242, 254, .4);
      border-radius: 12px;
      color: #00f2fe;
      background: rgba(15, 5, 30, .9);
      font-size: 10px;
      cursor: pointer;
    }

    .lang-selector option { background: #120826; color: #fff; }

    .translated-subtext {
      display: block;
      margin-top: 2px;
      color: #00f2fe;
      font-size: 10px;
      opacity: .9;
      border-top: 1px dashed rgba(0, 242, 254, .3);
      padding-top: 2px;
    }

    .room-input-box input {
      flex: 1;
      padding: 0 4px;
      outline: none;
      border: none;
      color: #fff;
      background: transparent;
      font-size: 12px;
    }

    .room-input-box button {
      padding: 6px 12px;
      border: none;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #00f2fe, #ff007f);
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .call-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 2px;
    }

    .control-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 50%;
      color: #fff;
      background: rgba(255, 255, 255, .1);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
      cursor: pointer;
      font-size: 14px;
      transition: .2s;
    }

    .control-icon-btn:hover { transform: scale(1.08); }
    .control-icon-btn.active { border-color: #ff0844; background: #ff0844; box-shadow: 0 0 15px rgba(255, 8, 68, .6); }

    .hangup-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: linear-gradient(135deg, #ff0844, #ffb199);
      box-shadow: 0 4px 15px rgba(255, 8, 68, .5);
      font-size: 15px;
    }

    @media (max-width: 430px) {
      .container { max-width: 100%; border: none; }
      .cinematic-moon { width: 170px; height: 170px; }
    }
  </style>
</head>

<body>
  <div class="cinematic-moon" id="cinematicMoon"></div>
  <canvas id="spaceCanvas"></canvas>

  <main class="container" id="mainContainer">
    <!-- شاشة البوابة -->
    <section id="screen-gateway" class="screen active gateway-screen">
      <div class="avatar-box"><div class="avatar-inner">🌌</div></div>
      <h1>لافي منير</h1>
      <p class="gateway-desc">
        غرفة اتصال صوتية ومرئية P2P جماعية مع محرك ترجمة ذكي للرسائل عابر للقارات، دردشة حية، ومشاركة شاشة.
      </p>

      <input type="text" id="roomInput" class="room-input" placeholder="اكتب اسم الغرفة" value="lafi-room-1" maxlength="80" autocomplete="off">

      <button class="btn" id="enterRoomBtn" type="button">دخول الغرفة الحية 🎙️</button>
      <a class="btn" href="https://github.com/wwwmounirmp-hue/lafi-munir" target="_blank" rel="noopener noreferrer" style="background: linear-gradient(135deg, rgba(30,15,60,.9), rgba(60,20,90,.9)); border: 1px solid rgba(0,242,254,.4);">
        استكشف 🚀 GitHub
      </a>

      <div class="system-footer">
        STARDUST SOVEREIGN CORE • 2026<br>
        <span style="color:#00f2fe;">صُنع بعشق في سماء الاستقلالية البرمجية 🌌</span>
      </div>
    </section>

    <!-- شاشة الاتصال والدردشة -->
    <section id="screen-app" class="screen">
      <div class="live-room-content">
        <header class="room-top-bar">
          <span id="roomTitleDisplay" style="font-size:11px; font-weight:bold; color:#00f2fe;">الغرفة: جاري الاتصال... 🌐</span>
          <button id="exitRoomBtn" type="button" style="border:0; color:#ff0844; background:transparent; cursor:pointer; font-size:13px; font-weight:bold;">✕ خروج</button>
        </header>

        <div class="videos-container" id="videosContainer">
          <video id="localVideo" autoplay playsinline muted></video>

          <!-- شبكة المقاعد الصوتية الجماعية -->
          <div class="seats-grid-overlay">
            <div class="seat-slot">🎙️ مقعد 1</div>
            <div class="seat-slot">💺 مقعد 2</div>
            <div class="seat-slot">💺 مقعد 3</div>
            <div class="seat-slot">💺 مقعد 4</div>
          </div>

          <div id="stardustMemoryLayer"></div>
        </div>

        <div class="room-bottom-panel">
          <div class="room-chat-overlay" id="roomChatOverlay"></div>

          <div class="room-input-box">
            <select id="targetLangSelect" class="lang-selector" title="لغة الترجمة المستهدفة">
              <option value="ar">العربية 🇸🇦</option>
              <option value="en">English 🇺🇸</option>
              <option value="zh">中文 🇨🇳</option>
              <option value="fr">Français 🇫🇷</option>
              <option value="es">Español 🇪🇸</option>
            </select>

            <input type="text" id="roomMsgInput" placeholder="اكتب رسالتك لتعبر القارات... ✨" autocomplete="off" maxlength="500">
            <button id="sendMsgBtn" type="button">إرسال 🌍</button>
          </div>

          <div class="call-controls">
            <button class="control-icon-btn" id="micBtn" type="button" title="كتم الصوت">🎤</button>
            <button class="control-icon-btn" id="camBtn" type="button" title="الكاميرا">📷</button>
            <button class="control-icon-btn" id="screenShareBtn" type="button" title="مشاركة الشاشة">💻</button>
            <button class="control-icon-btn" id="recordBtn" type="button" title="تسجيل الجلسة كاملة">🔴</button>
            <button class="control-icon-btn hangup-btn" id="hangupBtn" type="button" title="إنهاء المكالمة">📞</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    window.appState = {
      globalStream: null,
      screenStream: null,
      originalVideoTrack: null,
      mediaRecorder: null,
      recordedChunks: [],
      currentRoomName: '',
      peersCalls: {},
      peer: null,
      myPeerRef: null,
      isEvaluating: false,
      statsIntervals: {},
      isSharingScreen: false,
      isLeaving: false,
      ambientAudioCtx: null,
      ambientOscillator: null,
      recordingStream: null,
      recordingAudioContext: null,
      recordingStopPromise: null,
      resolveRecordingStop: null,
      recordingAnimationId: null
    };

    window.resetRetryingPeers = () => {};

    const $ = id => document.getElementById(id);

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(screenId).classList.add('active');
    }

    window.setRoomStatus = function(text) {
      $('roomTitleDisplay').textContent = text;
    };

    function playCosmicSound(type = 'chime') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'chime') {
          [528, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const start = ctx.currentTime + idx * .1;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(.05, start);
            gain.gain.exponentialRampToValueAtTime(.001, start + 1.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(start); osc.stop(start + 1.2);
          });
        } else if (type === 'sparkle') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + .3);
          gain.gain.setValueAtTime(.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .4);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + .4);
        }
        setTimeout(() => ctx.close().catch(() => {}), 1500);
      } catch (e) { console.warn('Audio warning:', e); }
    }

    function startAmbientDrone() {
      try {
        stopAmbientDrone();
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        window.appState.ambientAudioCtx = new AudioContext();
        window.appState.ambientOscillator = window.appState.ambientAudioCtx.createOscillator();
        const gain = window.appState.ambientAudioCtx.createGain();
        window.appState.ambientOscillator.type = 'sine';
        window.appState.ambientOscillator.frequency.value = 110;
        gain.gain.value = .015;
        window.appState.ambientOscillator.connect(gain);
        gain.connect(window.appState.ambientAudioCtx.destination);
        window.appState.ambientOscillator.start();
      } catch (e) { console.warn(e); }
    }

    function stopAmbientDrone() {
      try { window.appState.ambientOscillator?.stop(); } catch (_) {}
      try { window.appState.ambientAudioCtx?.close(); } catch (_) {}
      window.appState.ambientOscillator = null;
      window.appState.ambientAudioCtx = null;
    }

    async function translateTextSmart(text, targetLang) {
      if (!text || text.length <= 1 || !targetLang) return null;
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=auto|${targetLang}`);
        if (!res.ok) return null;
        const data = await res.json();
        const translated = data?.responseData?.translatedText;
        if (translated && !translated.includes('MATCHES') && !translated.includes('QUOTA')) {
          return translated;
        }
      } catch (e) { console.warn('Translation offline:', e); }
      return null;
    }

    window.displayStardustMemory = async function(sender = 'مستخدم', text = '', isInitial = false) {
      if (!text || !text.trim()) return;
      const chat = $('roomChatOverlay');
      const bubble = document.createElement('div');
      const senderEl = document.createElement('span');
      const textEl = document.createElement('div');

      bubble.className = 'chat-bubble';
      senderEl.textContent = `[${sender}]:`;
      textEl.textContent = text;
      bubble.append(senderEl, textEl);

      const targetLang = $('targetLangSelect')?.value || 'ar';
      if (text.length > 1) {
        const translated = await translateTextSmart(text, targetLang);
        if (translated && translated.trim() !== text.trim()) {
          const sub = document.createElement('span');
          sub.className = 'translated-subtext';
          sub.textContent = `🌐 ${translated}`;
          bubble.appendChild(sub);
        }
      }

      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;

      if (!isInitial) {
        const layer = $('stardustMemoryLayer');
        const particle = document.createElement('div');
        particle.className = 'stardust-particle';
        particle.style.left = `${Math.random() * 70}%`;
        particle.style.top = `${30 + Math.random() * 40}%`;
        particle.textContent = `✨ ${text}`;
        layer.appendChild(particle);
        setTimeout(() => particle.remove(), 6000);
      }
    };

    async function sendStardustMsg() {
      const input = $('roomMsgInput');
      const text = input.value.trim();
      if (!text || !window.appState.currentRoomName) return;
      playCosmicSound('sparkle');
      if (typeof window.sendStardustToCloud === 'function') {
        input.value = '';
        await window.sendStardustToCloud(window.appState.currentRoomName, text);
      }
    }

    async function enterRoom() {
      const roomName = $('roomInput').value
        .trim()
        .replace(/[.#$[\]/]/g, '-')
        .slice(0, 80);

      if (!roomName) {
        alert('أدخل اسم الغرفة');
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        alert('المتصفح لا يدعم الوسائط');
        return;
      }

      Object.values(window.appState.peersCalls).forEach(call => call.close());
      window.appState.peersCalls = {};
      document.querySelectorAll('.remote-peer-video').forEach(video => video.remove());
      window.resetRetryingPeers?.();

      window.appState.isLeaving = false;
      window.appState.isEvaluating = false;
      window.appState.currentRoomName = roomName;

      $('enterRoomBtn').disabled = true;
      showScreen('screen-app');
      window.setRoomStatus('طلب إذن الميكروفون والكاميرا...');

      try {
        playCosmicSound('chime');
        startAmbientDrone();
        window.appState.globalStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        $('localVideo').srcObject = window.appState.globalStream;
        window.setRoomStatus(`الغرفة: ${roomName} • جاري الاتصال...`);

        if (typeof window.initRoomP2P === 'function') {
          window.initRoomP2P(roomName, window.appState.globalStream);
        }
      } catch (err) {
        console.error('Media error:', err);
        alert('تعذر الوصول إلى الكاميرا أو الميكروفون.');
        await goHome();
      } finally {
        $('enterRoomBtn').disabled = false;
      }
    }

    function toggleMic() {
      const track = window.appState.globalStream?.getAudioTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      $('micBtn').classList.toggle('active', !track.enabled);
    }

    function toggleCam() {
      if (window.appState.isSharingScreen) return;
      const track = window.appState.globalStream?.getVideoTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      $('camBtn').classList.toggle('active', !track.enabled);
    }

    async function toggleScreenShare() {
      const activeCalls = Object.values(window.appState.peersCalls);
      if (activeCalls.length === 0) { alert('يجب أن تكون في غرفة نشطة لمشاركة الشاشة.'); return; }
      if (window.appState.isSharingScreen) { await stopScreenShare(); return; }

      try {
        window.appState.screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        const screenTrack = window.appState.screenStream.getVideoTracks()[0];
        window.appState.originalVideoTrack = window.appState.globalStream?.getVideoTracks()[0] || null;

        activeCalls.forEach(call => {
          const sender = call.peerConnection?.getSenders().find(s => s.track?.kind === 'video');
          if (sender) sender.replaceTrack(screenTrack);
        });

        $('localVideo').srcObject = window.appState.screenStream;
        window.appState.isSharingScreen = true;
        $('screenShareBtn').classList.add('active');

        screenTrack.addEventListener('ended', () => stopScreenShare(), { once: true });
      } catch (e) {
        console.error('Screen share error:', e);
        window.appState.screenStream?.getTracks().forEach(t => t.stop());
        window.appState.screenStream = null;
        window.appState.originalVideoTrack = null;
        window.appState.isSharingScreen = false;
        $('localVideo').srcObject = window.appState.globalStream;
        $('screenShareBtn').classList.remove('active');
      }
    }

    async function stopScreenShare() {
      if (!window.appState.isSharingScreen) return;
      try {
        const activeCalls = Object.values(window.appState.peersCalls);
        activeCalls.forEach(call => {
          const sender = call.peerConnection?.getSenders().find(s => s.track?.kind === 'video');
          if (sender && window.appState.originalVideoTrack) {
            sender.replaceTrack(window.appState.originalVideoTrack);
          }
        });
        window.appState.screenStream?.getTracks().forEach(t => t.stop());
        $('localVideo').srcObject = window.appState.globalStream;
      } catch (e) { console.warn(e); }
      window.appState.screenStream = null;
      window.appState.originalVideoTrack = null;
      window.appState.isSharingScreen = false;
      $('screenShareBtn').classList.remove('active');
    }

    function createMixedRecordingStream() {
      const localVideo = $('localVideo');
      const remoteVideos = Array.from(document.querySelectorAll('.remote-peer-video'));

      const canvas = document.createElement('canvas');
      canvas.width = 1280;
      canvas.height = 720;
      const ctx = canvas.getContext('2d');

      function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (remoteVideos.length > 0) {
          const totalRemotes = remoteVideos.length;
          const columns = Math.ceil(Math.sqrt(totalRemotes));
          const rows = Math.ceil(totalRemotes / columns);
          const width = canvas.width / columns;
          const height = canvas.height / rows;

          remoteVideos.forEach((video, index) => {
            if (video.readyState >= 2) {
              const x = (index % columns) * width;
              const y = Math.floor(index / columns) * height;
              ctx.drawImage(video, x, y, width, height);
            }
          });
        }

        if (localVideo.readyState >= 2) {
          ctx.drawImage(localVideo, 20, 20, 240, 150);
        }

        window.appState.recordingAnimationId = requestAnimationFrame(draw);
      }
      draw();

      const canvasStream = canvas.captureStream(30);
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioContext = new AudioContext();
      const destination = audioContext.createMediaStreamDestination();

      function addAudio(stream) {
        const track = stream?.getAudioTracks()?.[0];
        if (!track) return;
        const source = audioContext.createMediaStreamSource(new MediaStream([track]));
        source.connect(destination);
      }

      addAudio(window.appState.globalStream);
      remoteVideos.forEach(v => addAudio(v.srcObject));

      window.appState.recordingStream = new MediaStream([
        canvasStream.getVideoTracks()[0],
        ...destination.stream.getAudioTracks()
      ]);
      window.appState.recordingAudioContext = audioContext;

      return window.appState.recordingStream;
    }

    function toggleRecording() {
      const button = $('recordBtn');

      if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
        alert('التسجيل غير مدعوم في هذا المتصفح.');
        return;
      }

      if (window.appState.mediaRecorder?.state === 'recording') {
        window.appState.mediaRecorder.stop();
        button.classList.remove('active');
        return;
      }

      const remoteVideos = document.querySelectorAll('.remote-peer-video');
      if (!window.appState.globalStream || remoteVideos.length === 0) {
        alert('يجب أن يكون هناك مشارك نشط في الغرفة لبدء التسجيل.');
        return;
      }

      try {
        const combinedStream = createMixedRecordingStream();
        const mimeTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
        const mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type));

        window.appState.recordedChunks = [];
        window.appState.mediaRecorder = new MediaRecorder(
          combinedStream,
          mimeType ? { mimeType } : undefined
        );

        window.appState.recordingStopPromise = new Promise(resolve => {
          window.appState.resolveRecordingStop = resolve;
        });

        window.appState.mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) window.appState.recordedChunks.push(event.data);
        };

        window.appState.mediaRecorder.onstop = async () => {
          try {
            if (window.appState.recordingAnimationId) {
              cancelAnimationFrame(window.appState.recordingAnimationId);
              window.appState.recordingAnimationId = null;
            }

            if (window.appState.recordedChunks.length > 0) {
              const blob = new Blob(window.appState.recordedChunks, { type: 'video/webm' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');

              a.href = url;
              a.download = `lafi-munir-session-${Date.now()}.webm`;
              document.body.appendChild(a);
              a.click();

              setTimeout(() => {
                a.remove();
                URL.revokeObjectURL(url);
              }, 1000);
            }

            window.appState.recordingStream?.getTracks().forEach(t => t.stop());
            if (window.appState.recordingAudioContext?.state !== 'closed') {
              try { await window.appState.recordingAudioContext?.close(); } catch (_) {}
            }

            window.appState.recordingStream = null;
            window.appState.recordingAudioContext = null;
            window.appState.mediaRecorder = null;
            $('recordBtn').classList.remove('active');
          } finally {
            const resolveStop = window.appState.resolveRecordingStop;
            window.appState.resolveRecordingStop = null;
            window.appState.recordingStopPromise = null;
            resolveStop?.();
          }
        };

        window.appState.mediaRecorder.start();
        button.classList.add('active');
        alert('بدء تسجيل الجلسة بنجاح ✨');
      } catch (error) {
        console.error('Recording error:', error);
        alert('فشل بدء التسجيل.');
      }
    }

    window.monitorConnectionQuality = function(call, targetPeerId) {
      if (!call?.peerConnection) return;
      if (window.appState.statsIntervals[targetPeerId]) {
        clearInterval(window.appState.statsIntervals[targetPeerId]);
      }
      window.appState.statsIntervals[targetPeerId] = setInterval(async () => {
        try {
          const stats = await call.peerConnection.getStats();
          stats.forEach(report => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              const display = $('roomTitleDisplay');
              if (display) {
                display.textContent = report.packetsLost > 15 ? 'الغرفة: متذبذب 🟡' : 'الغرفة: ممتاز 🟢';
              }
            }
          });
        } catch (_) {}
      }, 4000);
    };

    async function stopRecordingSafely() {
      const recorder = window.appState.mediaRecorder;
      if (!recorder || recorder.state === 'inactive') return;
      try {
        if (recorder.state === 'recording') recorder.stop();
        await Promise.race([
          window.appState.recordingStopPromise || Promise.resolve(),
          new Promise(resolve => setTimeout(resolve, 2000))
        ]);
      } catch (e) { console.warn(e); }
    }

    async function goHome() {
      if (window.appState.isLeaving) return;
      window.appState.isLeaving = true;

      stopAmbientDrone();
      await stopRecordingSafely();

      if (typeof window.cleanupRoom === 'function') await window.cleanupRoom();

      Object.values(window.appState.statsIntervals).forEach(clearInterval);
      window.appState.statsIntervals = {};
      window.resetRetryingPeers?.();
      window.appState.currentRoomName = '';

      window.appState.recordingStream?.getTracks().forEach(t => t.stop());

      if (window.appState.recordingAudioContext?.state !== 'closed') {
        try {
          await window.appState.recordingAudioContext.close();
        } catch (_) {}
      }

      window.appState.mediaRecorder = null;
      window.appState.recordingStream = null;
      window.appState.recordingAudioContext = null;
      window.appState.recordingStopPromise = null;
      window.appState.resolveRecordingStop = null;

      window.appState.isSharingScreen = false;
      window.appState.originalVideoTrack = null;
      $('screenShareBtn').classList.remove('active');

      window.appState.globalStream?.getTracks().forEach(t => t.stop());
      window.appState.screenStream?.getTracks().forEach(t => t.stop());

      window.appState.globalStream = null;
      window.appState.screenStream = null;
      window.appState.peersCalls = {};

      $('localVideo').srcObject = null;
      document.querySelectorAll('.remote-peer-video').forEach(v => v.remove());
      $('mainContainer').classList.remove('connected-aura');
      $('cinematicMoon').classList.remove('pulse');$('roomChatOverlay').innerHTML = '';
      $('stardustMemoryLayer').innerHTML = '';$('recordBtn').classList.remove('active');

      showScreen('screen-gateway');
      window.appState.isLeaving = false;
    }

    window.goHome = goHome;

    $('enterRoomBtn').addEventListener('click', enterRoom);
    $('exitRoomBtn').addEventListener('click', goHome);$('hangupBtn').addEventListener('click', goHome);
    $('sendMsgBtn').addEventListener('click', sendStardustMsg);$('roomMsgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendStardustMsg(); });
    $('micBtn').addEventListener('click', toggleMic);$('camBtn').addEventListener('click', toggleCam);
    $('screenShareBtn').addEventListener('click', toggleScreenShare);$('recordBtn').addEventListener('click', toggleRecording);

    const canvas = $('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    for (let i = 0; i < 70; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 1.5, alpha: Math.random(), speed: Math.random() * 0.1 + 0.02 });
    }
    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
        s.y -= s.speed; if (s.y < 0) s.y = canvas.height;
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();
  </script>

  <!-- Firebase & PeerJS Mesh Engine -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, remove, onChildAdded, onChildRemoved, onDisconnect, limitToLast, query, get, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://lafi-munir-global-default-rtdb.firebaseio.com/" };
    const db = getDatabase(initializeApp(firebaseConfig));

    let unsubscribeRoom = null;
    let unsubscribeChat = null;
    let unsubscribePeersRemoved = null;
    const retryingPeers = new Set();

    window.resetRetryingPeers = () => retryingPeers.clear();

    function addRemoteVideo(peerId, stream) {
      let video = document.getElementById(`remote-${peerId}`);
      if (!video) {
        video = document.createElement('video');
        video.id = `remote-${peerId}`;
        video.autoplay = true;
        video.playsInline = true;
        video.controls = false;
        video.setAttribute('aria-label', `فيديو المشارك ${peerId}`);
        video.className = 'remote-peer-video';
        document.getElementById('videosContainer').appendChild(video);
      }
      video.srcObject = stream;
      video.play().catch(e => console.warn(e));
    }

    window.initRoomP2P = function (roomName, stream) {
      if (unsubscribeRoom) unsubscribeRoom();
      if (unsubscribeChat) unsubscribeChat();
      if (unsubscribePeersRemoved) unsubscribePeersRemoved();

      if (window.appState.peer) {
        window.appState.peer.destroy();
        window.appState.peer = null;
      }

      const roomPeersRef = ref(db, `rooms_v3/${roomName}/peers`);
      const messagesRef = query(ref(db, `rooms_v3/${roomName}/stardust`), limitToLast(50));

      const peer = new Peer({
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:global.stun.twilio.com:3478" }
          ]
        }
      });
      window.appState.peer = peer;
      let myPeerId = null;

      function handleCall(call, targetPeerId) {
        window.appState.peersCalls[targetPeerId] = call;

        call.on("stream", remoteStream => {
          retryingPeers.delete(targetPeerId);
          addRemoteVideo(targetPeerId, remoteStream);
          document.getElementById("cinematicMoon").classList.add("pulse");
          document.getElementById("mainContainer").classList.add("connected-aura");
          window.monitorConnectionQuality(call, targetPeerId);
        });

        call.on("close", () => {
          delete window.appState.peersCalls[targetPeerId];
          retryingPeers.delete(targetPeerId);
          document.getElementById(`remote-${targetPeerId}`)?.remove();

          if (window.appState.statsIntervals[targetPeerId]) {
            clearInterval(window.appState.statsIntervals[targetPeerId]);
            delete window.appState.statsIntervals[targetPeerId];
          }

          if (Object.keys(window.appState.peersCalls).length === 0) {
            document.getElementById("mainContainer")?.classList.remove("connected-aura");
            document.getElementById("cinematicMoon")?.classList.remove("pulse");
            window.setRoomStatus("الغرفة: بانتظار مشاركين 🟡");
          }

          setTimeout(() => {
            if (!window.appState.isLeaving) evaluateAndConnectPeers();
          }, 1000);
        });

        call.on("error", () => {
          delete window.appState.peersCalls[targetPeerId];
          retryingPeers.delete(targetPeerId);
          document.getElementById(`remote-${targetPeerId}`)?.remove();
          
          if (window.appState.statsIntervals[targetPeerId]) {
            clearInterval(window.appState.statsIntervals[targetPeerId]);
            delete window.appState.statsIntervals[targetPeerId];
          }

          call.close();

          setTimeout(() => {
            if (!window.appState.isLeaving) {
              evaluateAndConnectPeers();
            }
          }, 1000);
        });
      }

      async function evaluateAndConnectPeers() {
        if (window.appState.isEvaluating || window.appState.isLeaving || !window.appState.peer || window.appState.peer.destroyed || !myPeerId) return;
        window.appState.isEvaluating = true;

        try {
          const snapshot = await get(query(roomPeersRef, orderByChild('createdAt')));
          if (!snapshot.exists() || window.appState.isLeaving) return;

          const peersData = snapshot.val();
          const myEntry = Object.values(peersData).find(p => p.peerId === myPeerId);
          if (!myEntry) return;

          for (const key of Object.keys(peersData)) {
            const p = peersData[key];
            if (
              p.peerId !== myPeerId &&
              p.createdAt < myEntry.createdAt &&
              !window.appState.peersCalls[p.peerId] &&
              !retryingPeers.has(p.peerId)
            ) {
              retryingPeers.add(p.peerId);

              const call = peer.call(p.peerId, stream);
              handleCall(call, p.peerId);
            }
          }
        } catch (e) { console.warn(e); }
        finally { window.appState.isEvaluating = false; }
      }

      peer.on("open", async id => {
        myPeerId = id;
        window.appState.myPeerRef = push(roomPeersRef);

        try {
          await set(window.appState.myPeerRef, { peerId: myPeerId, createdAt: Date.now() });
          await onDisconnect(window.appState.myPeerRef).remove();
        } catch (e) {
          window.setRoomStatus('خطأ في الاتصال بالخادم 🔴');
          return;
        }

        window.setRoomStatus(`الغرفة: ${roomName} • متصل 🟢`);

        unsubscribeRoom = onChildAdded(roomPeersRef, () => evaluateAndConnectPeers());
        unsubscribePeersRemoved = onChildRemoved(roomPeersRef, () => evaluateAndConnectPeers());
        await evaluateAndConnectPeers();

        let firstMsg = true;
        unsubscribeChat = onChildAdded(messagesRef, snap => {
          const msg = snap.val();
          if (msg) {
            window.displayStardustMemory(msg.sender || 'مستخدم', msg.text, firstMsg);
            firstMsg = false;
          }
        });
      });

      peer.on("call", call => {
        if (window.appState.peersCalls[call.peer]) {
          call.close();
          return;
        }
        call.answer(stream);
        handleCall(call, call.peer);
      });

      peer.on("error", () => window.setRoomStatus("خطأ في شبكة P2P 🔴"));
    };

    window.sendStardustToCloud = async function (roomName, text) {
      try {
        await push(ref(db, `rooms_v3/${roomName}/stardust`), {
          sender: "لافي منير",
          text,
          timestamp: Date.now()
        });
      } catch (e) { console.error(e); }
    };

    window.cleanupRoom = async function () {
      window.appState.isLeaving = true;
      retryingPeers.clear();

      if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
      if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
      if (unsubscribePeersRemoved) { unsubscribePeersRemoved(); unsubscribePeersRemoved = null; }

      Object.values(window.appState.statsIntervals).forEach(interval => clearInterval(interval));
      window.appState.statsIntervals = {};

      if (window.appState.myPeerRef) {
        await remove(window.appState.myPeerRef).catch(() => {});
        window.appState.myPeerRef = null;
      }
      Object.values(window.appState.peersCalls).forEach(call => call.close());
      window.appState.peer?.destroy();
      window.appState.peer = null;
      window.appState.peersCalls = {};
    };
  </script>
