<!-- كود Firebase و PeerJS (Module) -->
<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    push,
    set,
    remove,
    onChildAdded
  } from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL:
      "https://lafi-munir-global-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let unsubscribeRoom = null;
  let unsubscribeChat = null;

  window.initRoomP2P = function (roomName, stream) {
    if (unsubscribeRoom) unsubscribeRoom();
    if (unsubscribeChat) unsubscribeChat();

    const roomPeersRef = ref(db, `rooms_v3/${roomName}/peers`);
    const messagesRef = ref(db, `rooms_v3/${roomName}/stardust`);

    const peer = new Peer({
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:global.stun.twilio.com:3478" }
        ]
      }
    });

    window.appState.peer = peer;

    peer.on("open", async peerId => {
      window.appState.myPeerRef = push(roomPeersRef);

      try {
        await set(window.appState.myPeerRef, {
          peerId,
          createdAt: Date.now()
        });
      } catch (error) {
        console.error('Firebase error:', error);
        window.setRoomStatus('تعذر الاتصال بالخادم 🔴');
        return;
      }

      window.setRoomStatus(`الغرفة: ${roomName} • متصل 🟢`);

      unsubscribeRoom = onChildAdded(roomPeersRef, snapshot => {
        const data = snapshot.val();

        if (
          !data?.peerId ||
          data.peerId === peerId ||
          window.appState.currentCall
        ) {
          return;
        }

        if (peerId > data.peerId) {
          const call = peer.call(data.peerId, stream);
          handleCall(call);
        }
      });

      let firstMessage = true;

      unsubscribeChat = onChildAdded(messagesRef, snapshot => {
        const message = snapshot.val();

        if (!message) return;

        window.displayStardustMemory(
          message.sender,
          message.text,
          firstMessage
        );

        firstMessage = false;
      });
    });

    peer.on("call", call => {
      if (window.appState.currentCall) {
        call.close();
        return;
      }

      call.answer(stream);
      handleCall(call);
    });

    peer.on("error", err => {
      console.error("PeerJS Error:", err);
      window.setRoomStatus("تعذر إنشاء اتصال P2P 🔴");
    });
  };

  window.sendStardustToCloud = async function (roomName, text) {
    try {
      const messagesRef = ref(db, `rooms_v3/${roomName}/stardust`);

      await push(messagesRef, {
        sender: "لافي منير",
        text,
        timestamp: Date.now()
      });
    } catch (error) {
      console.error("Chat Firebase error:", error);
    }
  };

  function handleCall(call) {
    window.appState.currentCall = call;

    call.on("stream", remoteStream => {
      const remoteVideo = document.getElementById("remoteVideo");
      remoteVideo.srcObject = remoteStream;

      remoteVideo.play().catch(error => {
        console.warn("تعذر تشغيل الفيديو تلقائيًا:", error);
      });

      document.getElementById("cinematicMoon").classList.add("pulse");
      document.getElementById("mainContainer").classList.add("connected-aura");

      window.monitorConnectionQuality(call);
    });

    call.on("close", () => {
      window.appState.currentCall = null;
      document.getElementById("remoteVideo").srcObject = null;
      document.getElementById("mainContainer").classList.remove("connected-aura");
      window.setRoomStatus("الغرفة: انتهت المكالمة 🟡");
    });
  }

  window.cleanupRoom = async function () {
    if (window.appState.statsInterval) {
      clearInterval(window.appState.statsInterval);
      window.appState.statsInterval = null;
    }

    if (unsubscribeRoom) {
      unsubscribeRoom();
      unsubscribeRoom = null;
    }

    if (unsubscribeChat) {
      unsubscribeChat();
      unsubscribeChat = null;
    }

    if (window.appState.myPeerRef) {
      await remove(window.appState.myPeerRef).catch(() => {});
      window.appState.myPeerRef = null;
    }

    window.appState.currentCall?.close();
    window.appState.peer?.destroy();

    window.appState.peer = null;
    window.appState.currentCall = null;
  };

  window.addEventListener("beforeunload", () => {
    window.appState.globalStream?.getTracks().forEach(track => track.stop());
    window.appState.peer?.destroy();
  });
</script>
</body>
</html>
